  # ===========================================================================
  # Userspace Build (shepherds + .maz modules + test programs)
  # ===========================================================================

  userspace-build:
    desc: Build all ARM64 userspace programs (shepherds, .maz modules, test programs)
    deps: [rachel-arm64, stdio-arm64, diskshepherd-arm64, clocks, sievetest, attrtest, handletest, clocktest, helloworld-maz, prefs-maz, fontsvc-maz, fs-maz]

