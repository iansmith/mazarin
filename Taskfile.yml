# Taskfile for mazzy - Go Native Toolchain Build (Shell-Free)
# Builds diplomat UEFI bootloader + kmazarin kernel for ARM64, x86_64, and RISC-V
#
# Usage:
#   task                          # Build diplomat + kmazarin for ARM64 (default)
#   task run                      # Build and run ARM64 diplomat+kmazarin in QEMU
#   task run-x86_64               # Build and run x86_64 diplomat+kmazarin in QEMU
#   task run-riscv64              # Build and run RISC-V diplomat+kmazarin in QEMU
#   task kmazarin-arm64           # Build kmazarin kernel (ARM64)
#   task kmazarin-x86_64          # Build kmazarin kernel (x86_64)
#   task kmazarin-riscv64         # Build kmazarin kernel (RISC-V)
#   task disk-arm64               # Create ext2 disk image (ARM64 userspace)
#   task disk-x86_64              # Create ext2 disk image (x86_64 userspace)
#   task disk-riscv64             # Create ext2 disk image (RISC-V userspace)
#   task clean                    # Remove build artifacts
#
# Environment:
#   GO=/path/to/go                        # Go compiler (>= 1.24)
#   QEMU=/path/to/qemu-system-aarch64     # QEMU ARM64 (>= 10.2)
#   QEMU_X86_64=/path/to/qemu-system-x86_64  # QEMU x86_64 for diplomat
#   QEMU_RISCV64=/path/to/qemu-system-riscv64  # QEMU RISC-V for diplomat
#   OVMF=/path/to/edk2-x86_64-code.fd     # OVMF firmware for diplomat
#   GOTOOLCHAIN=auto                      # Required
#   DEBUG=1                               # Optional: disable optimizations

version: '3'

includes:
  # Build tools
  gen-overlay:  {taskfile: ./cmd/gen-overlay/Taskfile.yml}
  elf2pe:       {taskfile: ./cmd/elf2pe/Taskfile.yml}
  mkesp:        {taskfile: ./cmd/mkesp/Taskfile.yml}
  mktestkernel: {taskfile: ./cmd/mktestkernel/Taskfile.yml}
  # Shepherds
  rachel:       {taskfile: ./flock/cmd/rachel/Taskfile.yml}
  linux:        {taskfile: ./flock/cmd/linux/Taskfile.yml}
  fs:           {taskfile: ./flock/cmd/fs/Taskfile.yml}
  # .maz programs
  helloworld:   {taskfile: ./flock/cmd/helloworld/Taskfile.yml}
  prefs:        {taskfile: ./flock/cmd/prefs/Taskfile.yml}
  fontsvc:      {taskfile: ./flock/cmd/fontsvc/Taskfile.yml}
  keymapper:    {taskfile: ./flock/cmd/keymapper/Taskfile.yml}
  linux-ui:     {taskfile: ./flock/cmd/linux-ui/Taskfile.yml}
  # Test programs
  sievetest:    {taskfile: ./flock/cmd/sievetest/Taskfile.yml}
  attrtest:     {taskfile: ./flock/cmd/attrtest/Taskfile.yml}
  handletest:   {taskfile: ./flock/cmd/handletest/Taskfile.yml}
  clocktest:    {taskfile: ./flock/cmd/clocktest/Taskfile.yml}
  # Shepherds (clocks)
  clocks:       {taskfile: ./flock/cmd/clocks/Taskfile.yml}
  # Shepherds (versai)
  versai:       {taskfile: ./mazarin/apps/versai/Taskfile.yml}
  # Shepherds (calc)
  calc:         {taskfile: ./mazarin/apps/calc/Taskfile.yml}
  # Kernel
  kmazarin:     {taskfile: ./kmazarin/Taskfile.yml}
  # Bootloader
  diplomat:     {taskfile: ./diplomat/Taskfile.yml}
  # Libraries
  mazarin:      {taskfile: ./mazarin/Taskfile.yml}
  mancini:      {taskfile: ./mazarin/mancini/Taskfile.yml}

vars:
  # Environment variables (shell-free using Go templates)
  GO: '{{env "GO" | default "go"}}'
  QEMU: '{{env "QEMU" | default "qemu-system-aarch64"}}'
  QEMU_X86_64: '{{env "QEMU_X86_64" | default "qemu-system-x86_64"}}'
  QEMU_RISCV64: '{{env "QEMU_RISCV64" | default "qemu-system-riscv64"}}'
  OVMF: '{{env "OVMF" | default ""}}'
  DEBUG: '{{env "DEBUG" | default ""}}'

  # Build configuration (prefixed to avoid conflicts with Go env vars)
  TARGET_GOARCH: arm64
  TARGET_GOOS: linux
  BUILD_DIR: build

  # QEMU display: cocoa on macOS, sdl everywhere else
  DISPLAY: '{{if eq OS "darwin"}}cocoa{{else}}sdl{{end}}'

  # QEMU RAM size — override with QEMU_RAM=512M or QEMU_RAM=4G to test different sizes
  QEMU_RAM: '{{env "QEMU_RAM" | default "2G"}}'

  # Kmazarin load address - must match shared/constants.KmazarinLoadAddr
  # If the constant changes, check-env will fail with a clear error message.
  KMAZARIN_LOAD_ADDR: "0x43800000"

  # Debug build: disable optimizations and inlining
  # Usage: DEBUG=1 task kmazarin-arm64
  GCFLAGS: '{{if eq .DEBUG "1"}}-gcflags=all=-N -l{{end}}'

  # Output files
  KMAZARIN_ELF: '{{.BUILD_DIR}}/kmazarin.elf'
  KMAZARIN_OVERLAY_JSON: '{{.BUILD_DIR}}/kmazarin-overlay.json'
  USERSPACE_OVERLAY_JSON: '{{.BUILD_DIR}}/userspace-overlay.json'
  SIEVETEST_ELF: '{{.BUILD_DIR}}/sievetest.elf'
  ATTRTEST_ELF: '{{.BUILD_DIR}}/attrtest.elf'
  HANDLETEST_ELF: '{{.BUILD_DIR}}/handletest.elf'
  CLOCKTEST_ELF: '{{.BUILD_DIR}}/clocktest.elf'
  CLOCKS_ELF: '{{.BUILD_DIR}}/clocks.elf'
  VERSAI_ELF: '{{.BUILD_DIR}}/versai.elf'
  CALC_ELF: '{{.BUILD_DIR}}/calc.elf'

  # .maz program build artifacts (per-architecture: thin overlay, maz overlay, manifest)
  THIN_OVERLAY_DIR: '{{.BUILD_DIR}}/thin-overlay'
  THIN_OVERLAY_JSON: '{{.BUILD_DIR}}/thin-overlay.json'
  THIN_MANIFEST: '{{.BUILD_DIR}}/thin-stubs.manifest'
  MAZ_OVERLAY_JSON: '{{.BUILD_DIR}}/maz-overlay.json'
  HELLOWORLD_MAZ: '{{.BUILD_DIR}}/helloworld.maz'
  PREFS_MAZ: '{{.BUILD_DIR}}/prefs.maz'
  FONTSVC_MAZ: '{{.BUILD_DIR}}/fontsvc.maz'
  KEYMAPPER_MAZ: '{{.BUILD_DIR}}/keymapper.maz'
  LINUX_UI_MAZ: '{{.BUILD_DIR}}/linux-ui.maz'
  THIN_OVERLAY_AMD64_DIR: '{{.BUILD_DIR}}/thin-overlay-amd64'
  THIN_OVERLAY_AMD64_JSON: '{{.BUILD_DIR}}/thin-overlay-amd64.json'
  THIN_MANIFEST_AMD64: '{{.BUILD_DIR}}/thin-stubs-amd64.manifest'
  MAZ_OVERLAY_AMD64_JSON: '{{.BUILD_DIR}}/maz-overlay-amd64.json'
  HELLOWORLD_MAZ_AMD64: '{{.BUILD_DIR}}/helloworld-amd64.maz'
  PREFS_MAZ_AMD64: '{{.BUILD_DIR}}/prefs-amd64.maz'
  FONTSVC_MAZ_AMD64: '{{.BUILD_DIR}}/fontsvc-amd64.maz'
  KEYMAPPER_MAZ_AMD64: '{{.BUILD_DIR}}/keymapper-amd64.maz'
  LINUX_UI_MAZ_AMD64: '{{.BUILD_DIR}}/linux-ui-amd64.maz'
  RACHEL_ELF: '{{.BUILD_DIR}}/rachel.elf'
  LINUX_ELF: '{{.BUILD_DIR}}/linux.elf'
  FS_ELF: '{{.BUILD_DIR}}/fs.elf'
  DISK_IMAGE: '{{.BUILD_DIR}}/disk.img'

  # x86_64 userspace programs
  RACHEL_AMD64_ELF: '{{.BUILD_DIR}}/rachel-amd64.elf'
  LINUX_AMD64_ELF: '{{.BUILD_DIR}}/linux-amd64.elf'
  FS_AMD64_ELF: '{{.BUILD_DIR}}/fs-amd64.elf'
  SIEVETEST_AMD64_ELF: '{{.BUILD_DIR}}/sievetest-amd64.elf'
  ATTRTEST_AMD64_ELF: '{{.BUILD_DIR}}/attrtest-amd64.elf'
  HANDLETEST_AMD64_ELF: '{{.BUILD_DIR}}/handletest-amd64.elf'
  CLOCKTEST_AMD64_ELF: '{{.BUILD_DIR}}/clocktest-amd64.elf'
  CLOCKS_AMD64_ELF: '{{.BUILD_DIR}}/clocks-amd64.elf'
  VERSAI_AMD64_ELF: '{{.BUILD_DIR}}/versai-amd64.elf'
  CALC_AMD64_ELF: '{{.BUILD_DIR}}/calc-amd64.elf'
  DISK_AMD64_IMAGE: '{{.BUILD_DIR}}/disk-amd64.img'

  # RISC-V 64-bit userspace programs
  RACHEL_RISCV64_ELF: '{{.BUILD_DIR}}/rachel-riscv64.elf'
  LINUX_RISCV64_ELF: '{{.BUILD_DIR}}/linux-riscv64.elf'
  FS_RISCV64_ELF: '{{.BUILD_DIR}}/fs-riscv64.elf'
  SIEVETEST_RISCV64_ELF: '{{.BUILD_DIR}}/sievetest-riscv64.elf'
  ATTRTEST_RISCV64_ELF: '{{.BUILD_DIR}}/attrtest-riscv64.elf'
  HANDLETEST_RISCV64_ELF: '{{.BUILD_DIR}}/handletest-riscv64.elf'
  CLOCKTEST_RISCV64_ELF: '{{.BUILD_DIR}}/clocktest-riscv64.elf'
  CLOCKS_RISCV64_ELF: '{{.BUILD_DIR}}/clocks-riscv64.elf'
  VERSAI_RISCV64_ELF: '{{.BUILD_DIR}}/versai-riscv64.elf'
  CALC_RISCV64_ELF: '{{.BUILD_DIR}}/calc-riscv64.elf'
  HELLOWORLD_MAZ_RISCV64: '{{.BUILD_DIR}}/helloworld-riscv64.maz'
  PREFS_MAZ_RISCV64: '{{.BUILD_DIR}}/prefs-riscv64.maz'
  FONTSVC_MAZ_RISCV64: '{{.BUILD_DIR}}/fontsvc-riscv64.maz'
  KEYMAPPER_MAZ_RISCV64: '{{.BUILD_DIR}}/keymapper-riscv64.maz'
  LINUX_UI_MAZ_RISCV64: '{{.BUILD_DIR}}/linux-ui-riscv64.maz'
  DISK_RISCV64_IMAGE: '{{.BUILD_DIR}}/disk-riscv64.img'

  # Fonts base image (built once, used as -base for disk images)
  LOUIS14_DIR: '{{env "LOUIS14_DIR" | default "../louis14"}}'
  FONTS_DIR:   '{{env "FONTS_DIR"   | default "../louis14/fonts"}}'
  FONTS_BASE_IMAGE: '{{.BUILD_DIR}}/fonts-base.img'
  FONTS_PAD_MB: '300'

  # Diplomat (x86_64 UEFI bootloader) output files
  DIPLOMAT_EXE: '{{.BUILD_DIR}}/diplomat.exe'
  DIPLOMAT_EFI: '{{.BUILD_DIR}}/diplomat.efi'
  ESP_IMAGE: '{{.BUILD_DIR}}/esp.img'

  # Diplomat ARM64 UEFI
  DIPLOMAT_ARM64_EFI: '{{.BUILD_DIR}}/diplomat-arm64.efi'
  ESP_ARM64_IMAGE: '{{.BUILD_DIR}}/esp-arm64.img'
  OVMF_ARM64: '{{env "OVMF_ARM64" | default ""}}'

  # Diplomat RISC-V 64-bit (ELF, loaded via -kernel — UEFI firmware broken on RISC-V)
  DIPLOMAT_RISCV64_ELF: '{{.BUILD_DIR}}/diplomat-riscv64.elf'

  # Kmazarin AMD64 (for diplomat x86_64 boot)
  KMAZARIN_AMD64_ELF: '{{.BUILD_DIR}}/kmazarin-amd64.elf'
  KMAZARIN_AMD64_OVERLAY_JSON: '{{.BUILD_DIR}}/kmazarin-amd64-overlay.json'

  # Kmazarin RISC-V 64-bit (for diplomat riscv64 boot)
  KMAZARIN_RISCV64_ELF: '{{.BUILD_DIR}}/kmazarin-riscv64.elf'
  KMAZARIN_RISCV64_OVERLAY_JSON: '{{.BUILD_DIR}}/kmazarin-riscv64-overlay.json'

  # Runtime patches directory
  RUNTIME_PATCHES_DIR: runtime-patches
  USERSPACE_OVERLAY_DIR: mazarin/overlay/userspace
  MAZ_EXIT_OVERLAY_DIR: mazarin/overlay/maz
  MAZ_EXIT_OVERLAY_JSON: '{{.BUILD_DIR}}/maz-exit-overlay.json'

  # Shepherd overlay — adds //go:noinline + keep-alive to prevent DCE of runtime functions
  # Per-architecture because sigctxt methods differ (ARM64: r0-r29, x86_64: rax/rbx, RISC-V: different)
  SHEPHERD_OVERLAY_DIR: '{{.BUILD_DIR}}/shepherd-overlay'
  SHEPHERD_OVERLAY_JSON: '{{.BUILD_DIR}}/shepherd-overlay.json'
  MERGED_SHEPHERD_OVERLAY_JSON: '{{.BUILD_DIR}}/merged-shepherd-overlay.json'
  SHEPHERD_OVERLAY_AMD64_DIR: '{{.BUILD_DIR}}/shepherd-overlay-amd64'
  SHEPHERD_OVERLAY_AMD64_JSON: '{{.BUILD_DIR}}/shepherd-overlay-amd64.json'
  MERGED_SHEPHERD_OVERLAY_AMD64_JSON: '{{.BUILD_DIR}}/merged-shepherd-overlay-amd64.json'
  SHEPHERD_OVERLAY_RISCV64_DIR: '{{.BUILD_DIR}}/shepherd-overlay-riscv64'
  SHEPHERD_OVERLAY_RISCV64_JSON: '{{.BUILD_DIR}}/shepherd-overlay-riscv64.json'
  MERGED_SHEPHERD_OVERLAY_RISCV64_JSON: '{{.BUILD_DIR}}/merged-shepherd-overlay-riscv64.json'

tasks:
  # ===========================================================================
  # Environment and Version Checks
  # ===========================================================================

  check-env:
    run: once
    desc: Verify GO, QEMU, GOTOOLCHAIN, and tool versions
    cmds:
      # Check GOTOOLCHAIN
      - '{{.GO}} tool go-env -check GOTOOLCHAIN=auto -msg "GOTOOLCHAIN must be ''auto''. Run: export GOTOOLCHAIN=auto"'
      # Check Go version >= 1.24
      - '{{.GO}} tool check-version -go {{.GO}} -min 1.24'
      # Check QEMU version >= 10.2
      - '{{.GO}} tool check-version -qemu {{.QEMU}} -min 10.2'
      # Verify KMAZARIN_LOAD_ADDR matches the constant
      - '{{.GO}} tool print-kmazarin-addr -check {{.KMAZARIN_LOAD_ADDR}}'
      - '{{.GO}} tool go-echo "Environment check passed"'
    silent: true

  # ===========================================================================
  # Type-Check (vet) — quick compile check without producing binaries
  # ===========================================================================

  check:
    desc: Type-check all shepherds and userspace packages (ARM64)
    deps: [merged-shepherd-overlay, mazarin:userspace-overlay]
    cmds:
      - '{{.GO}} tool go-echo "Type-checking shepherds (ARM64)..."'
      - 'CGO_ENABLED=0 GOARCH={{.TARGET_GOARCH}} GOOS={{.TARGET_GOOS}} {{.GO}} build -tags mazhost -overlay={{.MERGED_SHEPHERD_OVERLAY_JSON}} -o /dev/null ./flock/cmd/rachel ./flock/cmd/linux ./flock/cmd/fs'
      - 'CGO_ENABLED=0 GOARCH={{.TARGET_GOARCH}} GOOS={{.TARGET_GOOS}} {{.GO}} build -overlay={{.USERSPACE_OVERLAY_JSON}} -o /dev/null ./flock/cmd/clocks'
      - '{{.GO}} tool go-echo "Type-check passed"'

  # ===========================================================================
  # Build Directory
  # ===========================================================================

  build-dir:
    run: once
    desc: Create build directory
    cmds:
      - '{{.GO}} tool go-mkdir {{.BUILD_DIR}}'
    status:
      - '{{.GO}} tool go-test -d {{.BUILD_DIR}}'

  # ===========================================================================
  # Overlay Generation
  # ===========================================================================

  shepherd-overlay:
    run: once
    method: checksum
    desc: Generate shepherd overlay for ARM64 (//go:noinline + keep-alive for all stubbable runtime functions)
    deps: [build-dir]
    sources:
      - 'cmd/gen-ast-stubs/**/*.go'
    generates:
      - '{{.SHEPHERD_OVERLAY_JSON}}'
    cmds:
      - '{{.GO}} tool go-echo "Generating shepherd overlay for ARM64 (//go:noinline + keep-alive)..."'
      - 'TARGET_GOARCH=arm64 TARGET_GOOS=linux {{.GO}} tool gen-ast-stubs -go={{.GO}} -runtime-from-go -packages=runtime,syscall -output={{.SHEPHERD_OVERLAY_DIR}} -overlay={{.SHEPHERD_OVERLAY_JSON}} -mode=shepherd'

  shepherd-overlay-amd64:
    run: once
    method: checksum
    desc: Generate shepherd overlay for x86_64 (//go:noinline + keep-alive for all stubbable runtime functions)
    deps: [build-dir]
    sources:
      - 'cmd/gen-ast-stubs/**/*.go'
    generates:
      - '{{.SHEPHERD_OVERLAY_AMD64_JSON}}'
    cmds:
      - '{{.GO}} tool go-echo "Generating shepherd overlay for x86_64 (//go:noinline + keep-alive)..."'
      - 'TARGET_GOARCH=amd64 TARGET_GOOS=linux {{.GO}} tool gen-ast-stubs -go={{.GO}} -runtime-from-go -packages=runtime,syscall -output={{.SHEPHERD_OVERLAY_AMD64_DIR}} -overlay={{.SHEPHERD_OVERLAY_AMD64_JSON}} -mode=shepherd'

  shepherd-overlay-riscv64:
    run: once
    method: checksum
    desc: Generate shepherd overlay for RISC-V (//go:noinline + keep-alive for all stubbable runtime functions)
    deps: [build-dir]
    sources:
      - 'cmd/gen-ast-stubs/**/*.go'
    generates:
      - '{{.SHEPHERD_OVERLAY_RISCV64_JSON}}'
    cmds:
      - '{{.GO}} tool go-echo "Generating shepherd overlay for RISC-V (//go:noinline + keep-alive)..."'
      - 'TARGET_GOARCH=riscv64 TARGET_GOOS=linux {{.GO}} tool gen-ast-stubs -go={{.GO}} -runtime-from-go -packages=runtime,syscall -output={{.SHEPHERD_OVERLAY_RISCV64_DIR}} -overlay={{.SHEPHERD_OVERLAY_RISCV64_JSON}} -mode=shepherd'

  merged-shepherd-overlay:
    run: once
    method: checksum
    desc: Merge shepherd + userspace overlays for ARM64 disk shepherd builds
    deps: [shepherd-overlay, mazarin:userspace-overlay]
    sources:
      - '{{.SHEPHERD_OVERLAY_JSON}}'
      - '{{.USERSPACE_OVERLAY_JSON}}'
    generates:
      - '{{.MERGED_SHEPHERD_OVERLAY_JSON}}'
    cmds:
      - '{{.GO}} tool go-echo "Merging shepherd + userspace overlays (ARM64)..."'
      - '{{.GO}} tool gen-overlay -type merge -base {{.SHEPHERD_OVERLAY_JSON}} -extra {{.USERSPACE_OVERLAY_JSON}} -o {{.MERGED_SHEPHERD_OVERLAY_JSON}}'

  merged-shepherd-overlay-amd64:
    run: once
    method: checksum
    desc: Merge shepherd + userspace overlays for x86_64 disk shepherd builds
    deps: [shepherd-overlay-amd64, mazarin:userspace-overlay]
    sources:
      - '{{.SHEPHERD_OVERLAY_AMD64_JSON}}'
      - '{{.USERSPACE_OVERLAY_JSON}}'
    generates:
      - '{{.MERGED_SHEPHERD_OVERLAY_AMD64_JSON}}'
    cmds:
      - '{{.GO}} tool go-echo "Merging shepherd + userspace overlays (x86_64)..."'
      - '{{.GO}} tool gen-overlay -type merge -base {{.SHEPHERD_OVERLAY_AMD64_JSON}} -extra {{.USERSPACE_OVERLAY_JSON}} -o {{.MERGED_SHEPHERD_OVERLAY_AMD64_JSON}}'

  merged-shepherd-overlay-riscv64:
    run: once
    method: checksum
    desc: Merge shepherd + userspace overlays for RISC-V disk shepherd builds
    deps: [shepherd-overlay-riscv64, mazarin:userspace-overlay]
    sources:
      - '{{.SHEPHERD_OVERLAY_RISCV64_JSON}}'
      - '{{.USERSPACE_OVERLAY_JSON}}'
    generates:
      - '{{.MERGED_SHEPHERD_OVERLAY_RISCV64_JSON}}'
    cmds:
      - '{{.GO}} tool go-echo "Merging shepherd + userspace overlays (RISC-V)..."'
      - '{{.GO}} tool gen-overlay -type merge -base {{.SHEPHERD_OVERLAY_RISCV64_JSON}} -extra {{.USERSPACE_OVERLAY_JSON}} -o {{.MERGED_SHEPHERD_OVERLAY_RISCV64_JSON}}'

  # ===========================================================================
  # Boot Image Conversion
  # ===========================================================================

  convert-boot-image:
    run: once
    desc: Copy boot image binary for disk
    deps: [build-dir]
    sources:
      - assets/boot-mazarin.bin
    generates:
      - '{{.BUILD_DIR}}/boot-image.bin'
    cmds:
      - '{{.GO}} tool go-cat -o {{.BUILD_DIR}}/boot-image.bin assets/boot-mazarin.bin'

  # ===========================================================================
  # Stage Embedded fs.elf for go:embed
  # ===========================================================================

  # NOTE: All three staging tasks write to the SAME output file
  # (kmazarin/kmazarin/fs.elf). We deliberately omit `generates` so that
  # Task always runs the copy when switching architectures. With `generates`,
  # Task's mtime fingerprinting considers the file up-to-date if a previous
  # arch's copy is newer — embedding the wrong architecture's binary.
  stage-embedded-fs-arm64:
    desc: Copy fs.elf into kmazarin/kmazarin/ for go:embed
    deps: [fs:arm64]
    cmds:
      - '{{.GO}} tool go-cp {{.FS_ELF}} kmazarin/kmazarin/fs.elf'

  stage-embedded-fs-x86_64:
    desc: Copy fs-amd64.elf into kmazarin/kmazarin/ for go:embed
    deps: [fs:x86_64]
    cmds:
      - '{{.GO}} tool go-cp {{.FS_AMD64_ELF}} kmazarin/kmazarin/fs.elf'

  stage-embedded-fs-riscv64:
    desc: Copy fs-riscv64.elf into kmazarin/kmazarin/ for go:embed
    deps: [fs:riscv64]
    cmds:
      - '{{.GO}} tool go-cp {{.FS_RISCV64_ELF}} kmazarin/kmazarin/fs.elf'

  # ===========================================================================
  # Stage Embedded kernel.toml for go:embed
  # ===========================================================================

  # NOTE: All three staging tasks write to the SAME output file
  # (kmazarin/kmazarin/kernel.toml). We deliberately omit `generates` so that
  # Task always runs the copy when switching architectures. With `generates`,
  # Task's mtime fingerprinting considers the file up-to-date if a previous
  # arch's copy is newer — embedding the wrong architecture's config.
  stage-kernel-config-arm64:
    desc: Copy kernel.arm64.toml into kmazarin/kmazarin/ for go:embed
    cmds:
      - '{{.GO}} tool go-cp config/kernel.arm64.toml kmazarin/kmazarin/kernel.toml'

  stage-kernel-config-x86_64:
    desc: Copy kernel.amd64.toml into kmazarin/kmazarin/ for go:embed
    cmds:
      - '{{.GO}} tool go-cp config/kernel.amd64.toml kmazarin/kmazarin/kernel.toml'

  stage-kernel-config-riscv64:
    desc: Copy kernel.riscv64.toml into kmazarin/kmazarin/ for go:embed
    cmds:
      - '{{.GO}} tool go-cp config/kernel.riscv64.toml kmazarin/kmazarin/kernel.toml'

  # ===========================================================================
  # Kmazarin Kernel Build
  # ===========================================================================

  # ===========================================================================
  # Flock Userspace Programs
  # ===========================================================================

  # ===========================================================================
  # .maz Programs (PIE + thin stubs, dynamically linked at load time)
  # ===========================================================================
  # .maz programs are loaded INTO a shepherd's address space, sharing its Go
  # runtime. They are built as PIE with thin runtime stubs (for {} loops)
  # that get patched at load time by the kernel to target the shepherd's real
  # functions. The build pipeline:
  #   1. gen-ast-stubs generates thin overlay (runtime+syscall → for{})
  #   2. Merge thin overlay with userspace overlay (syscall + runtime hooks)
  #   3. Build as PIE with merged overlay
  #   4. maz-reloc scans binary, generates .maz_imports section

  thin-overlay:
    run: once
    method: checksum
    desc: Generate thin client overlay for ARM64 (runtime + syscall stubs)
    deps: [build-dir]
    sources:
      - cmd/gen-ast-stubs/main.go
    generates:
      - '{{.THIN_OVERLAY_JSON}}'
      - '{{.THIN_MANIFEST}}'
    cmds:
      - '{{.GO}} tool go-echo "Generating thin client overlay for ARM64 (runtime + syscall)..."'
      - 'TARGET_GOARCH=arm64 TARGET_GOOS=linux {{.GO}} tool gen-ast-stubs -go={{.GO}} -runtime-from-go -packages=runtime,syscall -output={{.THIN_OVERLAY_DIR}} -overlay={{.THIN_OVERLAY_JSON}} -manifest={{.THIN_MANIFEST}}'

  thin-overlay-amd64:
    run: once
    method: checksum
    desc: Generate thin client overlay for x86_64 (runtime + syscall stubs)
    deps: [build-dir]
    sources:
      - cmd/gen-ast-stubs/main.go
    generates:
      - '{{.THIN_OVERLAY_AMD64_JSON}}'
      - '{{.THIN_MANIFEST_AMD64}}'
    cmds:
      - '{{.GO}} tool go-echo "Generating thin client overlay for x86_64 (runtime + syscall)..."'
      - 'TARGET_GOARCH=amd64 TARGET_GOOS=linux {{.GO}} tool gen-ast-stubs -go={{.GO}} -runtime-from-go -packages=runtime,syscall -output={{.THIN_OVERLAY_AMD64_DIR}} -overlay={{.THIN_OVERLAY_AMD64_JSON}} -manifest={{.THIN_MANIFEST_AMD64}}'

  maz-overlay:
    run: once
    method: checksum
    desc: Generate merged overlay for ARM64 .maz build (thin stubs + userspace syscall routing + maz-exit)
    deps: [thin-overlay, mazarin:userspace-overlay, mazarin:maz-exit-overlay]
    sources:
      - '{{.THIN_OVERLAY_JSON}}'
      - '{{.USERSPACE_OVERLAY_JSON}}'
      - '{{.MAZ_EXIT_OVERLAY_JSON}}'
    generates:
      - '{{.MAZ_OVERLAY_JSON}}'
    cmds:
      - '{{.GO}} tool go-echo "Merging thin + userspace + maz-exit overlays for ARM64 .maz build..."'
      - '{{.GO}} tool gen-overlay -type merge -base {{.THIN_OVERLAY_JSON}} -extra {{.USERSPACE_OVERLAY_JSON}} -o {{.MAZ_OVERLAY_JSON}}'
      - '{{.GO}} tool gen-overlay -type merge -base {{.MAZ_OVERLAY_JSON}} -extra {{.MAZ_EXIT_OVERLAY_JSON}} -o {{.MAZ_OVERLAY_JSON}}'

  maz-overlay-amd64:
    run: once
    method: checksum
    desc: Generate merged overlay for x86_64 .maz build (thin stubs + userspace syscall routing + maz-exit)
    deps: [thin-overlay-amd64, mazarin:userspace-overlay, mazarin:maz-exit-overlay]
    sources:
      - '{{.THIN_OVERLAY_AMD64_JSON}}'
      - '{{.USERSPACE_OVERLAY_JSON}}'
      - '{{.MAZ_EXIT_OVERLAY_JSON}}'
    generates:
      - '{{.MAZ_OVERLAY_AMD64_JSON}}'
    cmds:
      - '{{.GO}} tool go-echo "Merging thin + userspace + maz-exit overlays for x86_64 .maz build..."'
      - '{{.GO}} tool gen-overlay -type merge -base {{.THIN_OVERLAY_AMD64_JSON}} -extra {{.USERSPACE_OVERLAY_JSON}} -o {{.MAZ_OVERLAY_AMD64_JSON}}'
      - '{{.GO}} tool gen-overlay -type merge -base {{.MAZ_OVERLAY_AMD64_JSON}} -extra {{.MAZ_EXIT_OVERLAY_JSON}} -o {{.MAZ_OVERLAY_AMD64_JSON}}'

  # ===========================================================================
  # Userspace Build (shepherds + .maz modules + test programs)
  # ===========================================================================

  userspace-build:
    desc: Build all ARM64 userspace programs (shepherds, .maz modules, test programs)
    deps: [rachel:arm64, linux:arm64, fs:arm64, clocks:arm64, versai:arm64, calc:arm64, handletest:arm64, clocktest:arm64, helloworld:arm64, prefs:arm64, fontsvc:arm64, keymapper:arm64, linux-ui:arm64]

  userspace-build-x86_64:
    desc: Build all x86_64 userspace programs (shepherds + test programs)
    deps: [rachel:x86_64, linux:x86_64, fs:x86_64, clocks:x86_64, versai:x86_64, calc:x86_64, handletest:x86_64, clocktest:x86_64]

  userspace-build-riscv64:
    desc: Build all RISC-V userspace programs (shepherds, .maz/.mzr modules, test programs)
    deps: [rachel:riscv64, linux:riscv64, fs:riscv64, clocks:riscv64, versai:riscv64, calc:riscv64, handletest:riscv64, clocktest:riscv64, helloworld:riscv64, prefs:riscv64, fontsvc:riscv64, keymapper:riscv64, linux-ui:riscv64]

  # ===========================================================================
  # Disk Image
  # ===========================================================================

  fonts-base:
    desc: Create base disk image with fonts (run once, cached until fonts change)
    method: checksum
    sources:
      - '{{.FONTS_DIR}}/**/*'
      - 'fonts/fonts.csv'
    generates:
      - '{{.FONTS_BASE_IMAGE}}'
    status:
      - test -f {{.FONTS_BASE_IMAGE}}
    preconditions:
      - sh: test -d {{.FONTS_DIR}}
        msg: "Fonts directory not found at {{.FONTS_DIR}}. Set FONTS_DIR env var or skip this task."
    cmds:
      - '{{.GO}} tool go-echo "Creating fonts base image from {{.FONTS_DIR}}..."'
      - '{{.GO}} tool go-cp fonts/fonts.csv {{.FONTS_DIR}}/fonts.csv'
      - '{{.GO}} tool mkfat32 -o {{.FONTS_BASE_IMAGE}} -pad {{.FONTS_PAD_MB}} -dir /fonts={{.FONTS_DIR}}'
      - '{{.GO}} tool go-echo "Fonts base image created at {{.FONTS_BASE_IMAGE}}"'

  disk-arm64:
    desc: Create ext2 disk image with ARM64 flock binaries and kmazarin kernel
    deps: [rachel:arm64, linux:arm64, fs:arm64, handletest:arm64, clocktest:arm64, clocks:arm64, versai:arm64, calc:arm64, helloworld:arm64, prefs:arm64, fontsvc:arm64, keymapper:arm64, linux-ui:arm64, kmazarin:arm64, convert-boot-image]
    method: checksum
    vars:
      MKEXT2_FONTS:
        sh: test -d "{{.FONTS_DIR}}" && echo "-dir /fonts={{.FONTS_DIR}}" || echo ""
    sources:
      - '{{.RACHEL_ELF}}'
      - '{{.LINUX_ELF}}'
      - '{{.FS_ELF}}'
      - '{{.HANDLETEST_ELF}}'
      - '{{.CLOCKTEST_ELF}}'
      - '{{.CLOCKS_ELF}}'
      - '{{.VERSAI_ELF}}'
      - '{{.CALC_ELF}}'
      - '{{.HELLOWORLD_MAZ}}'
      - '{{.PREFS_MAZ}}'
      - '{{.FONTSVC_MAZ}}'
      - '{{.KEYMAPPER_MAZ}}'
      - '{{.LINUX_UI_MAZ}}'
      - '{{.KMAZARIN_ELF}}'
      - '{{.BUILD_DIR}}/boot-image.bin'
      - 'config/startup.arm64.toml'
      - 'config/rachel.arm64.toml'
    generates:
      - '{{.DISK_IMAGE}}'
    cmds:
      - '{{.GO}} tool go-echo "Creating ext2 disk image (ARM64)..."'
      - '{{.GO}} tool go-mkdir {{.BUILD_DIR}}/disk-staging-arm64'
      - '{{.GO}} tool go-cp config/startup.arm64.toml {{.BUILD_DIR}}/disk-staging-arm64/startup.toml'
      - '{{.GO}} tool go-cp config/rachel.arm64.toml {{.BUILD_DIR}}/disk-staging-arm64/rachel.toml'
      - '{{.GO}} tool go-cp fonts/fonts.csv {{.FONTS_DIR}}/fonts.csv'
      - '{{.GO}} tool mkext2 -o {{.DISK_IMAGE}} -size 512 {{.MKEXT2_FONTS}} {{.RACHEL_ELF}} {{.LINUX_ELF}} {{.FS_ELF}} {{.HANDLETEST_ELF}} {{.CLOCKTEST_ELF}} {{.CLOCKS_ELF}} {{.VERSAI_ELF}} {{.CALC_ELF}} {{.HELLOWORLD_MAZ}} {{.PREFS_MAZ}} {{.FONTSVC_MAZ}} {{.KEYMAPPER_MAZ}} {{.LINUX_UI_MAZ}} {{.KMAZARIN_ELF}} {{.BUILD_DIR}}/boot-image.bin {{.BUILD_DIR}}/disk-staging-arm64/startup.toml {{.BUILD_DIR}}/disk-staging-arm64/rachel.toml'
      - '{{.GO}} tool go-echo "Disk image created at {{.DISK_IMAGE}}"'

  disk-x86_64:
    desc: Create ext2 disk image with x86_64 flock binaries and kmazarin kernel
    deps: [rachel:x86_64, linux:x86_64, fs:x86_64, handletest:x86_64, clocktest:x86_64, clocks:x86_64, helloworld:amd64, prefs:amd64, fontsvc:amd64, keymapper:amd64, linux-ui:amd64, kmazarin:x86_64, convert-boot-image]
    method: checksum
    vars:
      MKEXT2_FONTS:
        sh: test -d "{{.FONTS_DIR}}" && echo "-dir /fonts={{.FONTS_DIR}}" || echo ""
    sources:
      - '{{.RACHEL_AMD64_ELF}}'
      - '{{.LINUX_AMD64_ELF}}'
      - '{{.FS_AMD64_ELF}}'
      - '{{.HANDLETEST_AMD64_ELF}}'
      - '{{.CLOCKTEST_AMD64_ELF}}'
      - '{{.CLOCKS_AMD64_ELF}}'
      - '{{.HELLOWORLD_MAZ_AMD64}}'
      - '{{.PREFS_MAZ_AMD64}}'
      - '{{.FONTSVC_MAZ_AMD64}}'
      - '{{.LINUX_UI_MAZ_AMD64}}'
      - '{{.KMAZARIN_AMD64_ELF}}'
      - '{{.BUILD_DIR}}/boot-image.bin'
      - 'config/startup.amd64.toml'
    generates:
      - '{{.DISK_AMD64_IMAGE}}'
    cmds:
      - '{{.GO}} tool go-echo "Creating ext2 disk image for x86_64..."'
      # Stage amd64 ELFs in a subdirectory so we don't overwrite ARM64 build/rachel.elf
      - '{{.GO}} tool go-mkdir {{.BUILD_DIR}}/disk-staging-amd64'
      - '{{.GO}} tool go-cp {{.RACHEL_AMD64_ELF}} {{.BUILD_DIR}}/disk-staging-amd64/rachel.elf'
      - '{{.GO}} tool go-cp {{.LINUX_AMD64_ELF}} {{.BUILD_DIR}}/disk-staging-amd64/linux.elf'
      - '{{.GO}} tool go-cp {{.FS_AMD64_ELF}} {{.BUILD_DIR}}/disk-staging-amd64/fs.elf'
      - '{{.GO}} tool go-cp {{.HANDLETEST_AMD64_ELF}} {{.BUILD_DIR}}/disk-staging-amd64/handletest.elf'
      - '{{.GO}} tool go-cp {{.CLOCKTEST_AMD64_ELF}} {{.BUILD_DIR}}/disk-staging-amd64/clocktest.elf'
      - '{{.GO}} tool go-cp {{.CLOCKS_AMD64_ELF}} {{.BUILD_DIR}}/disk-staging-amd64/clocks.elf'
      - '{{.GO}} tool go-cp {{.HELLOWORLD_MAZ_AMD64}} {{.BUILD_DIR}}/disk-staging-amd64/helloworld.maz'
      - '{{.GO}} tool go-cp {{.PREFS_MAZ_AMD64}} {{.BUILD_DIR}}/disk-staging-amd64/prefs.maz'
      - '{{.GO}} tool go-cp {{.FONTSVC_MAZ_AMD64}} {{.BUILD_DIR}}/disk-staging-amd64/fontsvc.maz'
      - '{{.GO}} tool go-cp {{.KEYMAPPER_MAZ_AMD64}} {{.BUILD_DIR}}/disk-staging-amd64/keymapper.maz'
      - '{{.GO}} tool go-cp {{.LINUX_UI_MAZ_AMD64}} {{.BUILD_DIR}}/disk-staging-amd64/linux-ui.maz'
      - '{{.GO}} tool go-cp config/startup.amd64.toml {{.BUILD_DIR}}/disk-staging-amd64/startup.toml'
      - '{{.GO}} tool go-cp config/rachel.amd64.toml {{.BUILD_DIR}}/disk-staging-amd64/rachel.toml'
      - '{{.GO}} tool go-cp fonts/fonts.csv {{.FONTS_DIR}}/fonts.csv'
      - '{{.GO}} tool mkext2 -o {{.DISK_AMD64_IMAGE}} -size 512 {{.MKEXT2_FONTS}} {{.BUILD_DIR}}/disk-staging-amd64/rachel.elf {{.BUILD_DIR}}/disk-staging-amd64/linux.elf {{.BUILD_DIR}}/disk-staging-amd64/fs.elf {{.BUILD_DIR}}/disk-staging-amd64/handletest.elf {{.BUILD_DIR}}/disk-staging-amd64/clocktest.elf {{.BUILD_DIR}}/disk-staging-amd64/clocks.elf {{.BUILD_DIR}}/disk-staging-amd64/helloworld.maz {{.BUILD_DIR}}/disk-staging-amd64/prefs.maz {{.BUILD_DIR}}/disk-staging-amd64/fontsvc.maz {{.BUILD_DIR}}/disk-staging-amd64/keymapper.maz {{.BUILD_DIR}}/disk-staging-amd64/linux-ui.maz {{.BUILD_DIR}}/disk-staging-amd64/startup.toml {{.BUILD_DIR}}/disk-staging-amd64/rachel.toml {{.KMAZARIN_AMD64_ELF}} {{.BUILD_DIR}}/boot-image.bin'
      - '{{.GO}} tool go-echo "x86_64 disk image created at {{.DISK_AMD64_IMAGE}}"'

  disk-riscv64:
    desc: Create ext2 disk image with RISC-V 64-bit flock binaries and kmazarin kernel
    deps: [rachel:riscv64, linux:riscv64, fs:riscv64, handletest:riscv64, clocktest:riscv64, clocks:riscv64, helloworld:riscv64, prefs:riscv64, fontsvc:riscv64, keymapper:riscv64, linux-ui:riscv64, kmazarin:riscv64, convert-boot-image]
    method: checksum
    vars:
      MKEXT2_FONTS:
        sh: test -d "{{.FONTS_DIR}}" && echo "-dir /fonts={{.FONTS_DIR}}" || echo ""
    sources:
      - '{{.RACHEL_RISCV64_ELF}}'
      - '{{.LINUX_RISCV64_ELF}}'
      - '{{.FS_RISCV64_ELF}}'
      - '{{.HANDLETEST_RISCV64_ELF}}'
      - '{{.CLOCKTEST_RISCV64_ELF}}'
      - '{{.CLOCKS_RISCV64_ELF}}'
      - '{{.HELLOWORLD_MAZ_RISCV64}}'
      - '{{.PREFS_MAZ_RISCV64}}'
      - '{{.FONTSVC_MAZ_RISCV64}}'
      - '{{.LINUX_UI_MAZ_RISCV64}}'
      - '{{.KMAZARIN_RISCV64_ELF}}'
      - '{{.BUILD_DIR}}/boot-image.bin'
      - 'config/startup.riscv64.toml'
    generates:
      - '{{.DISK_RISCV64_IMAGE}}'
    cmds:
      - '{{.GO}} tool go-echo "Creating ext2 disk image for RISC-V 64-bit..."'
      - '{{.GO}} tool go-mkdir {{.BUILD_DIR}}/disk-staging-riscv64'
      - '{{.GO}} tool go-cp {{.RACHEL_RISCV64_ELF}} {{.BUILD_DIR}}/disk-staging-riscv64/rachel.elf'
      - '{{.GO}} tool go-cp {{.LINUX_RISCV64_ELF}} {{.BUILD_DIR}}/disk-staging-riscv64/linux.elf'
      - '{{.GO}} tool go-cp {{.FS_RISCV64_ELF}} {{.BUILD_DIR}}/disk-staging-riscv64/fs.elf'
      - '{{.GO}} tool go-cp {{.HANDLETEST_RISCV64_ELF}} {{.BUILD_DIR}}/disk-staging-riscv64/handletest.elf'
      - '{{.GO}} tool go-cp {{.CLOCKTEST_RISCV64_ELF}} {{.BUILD_DIR}}/disk-staging-riscv64/clocktest.elf'
      - '{{.GO}} tool go-cp {{.CLOCKS_RISCV64_ELF}} {{.BUILD_DIR}}/disk-staging-riscv64/clocks.elf'
      - '{{.GO}} tool go-cp {{.HELLOWORLD_MAZ_RISCV64}} {{.BUILD_DIR}}/disk-staging-riscv64/helloworld.mzr'
      - '{{.GO}} tool go-cp {{.PREFS_MAZ_RISCV64}} {{.BUILD_DIR}}/disk-staging-riscv64/prefs.mzr'
      - '{{.GO}} tool go-cp {{.FONTSVC_MAZ_RISCV64}} {{.BUILD_DIR}}/disk-staging-riscv64/fontsvc.mzr'
      - '{{.GO}} tool go-cp {{.KEYMAPPER_MAZ_RISCV64}} {{.BUILD_DIR}}/disk-staging-riscv64/keymapper.mzr'
      - '{{.GO}} tool go-cp {{.LINUX_UI_MAZ_RISCV64}} {{.BUILD_DIR}}/disk-staging-riscv64/linux-ui.mzr'
      - '{{.GO}} tool go-cp config/startup.riscv64.toml {{.BUILD_DIR}}/disk-staging-riscv64/startup.toml'
      - '{{.GO}} tool go-cp config/rachel.riscv64.toml {{.BUILD_DIR}}/disk-staging-riscv64/rachel.toml'
      - '{{.GO}} tool go-cp fonts/fonts.csv {{.FONTS_DIR}}/fonts.csv'
      - '{{.GO}} tool mkext2 -o {{.DISK_RISCV64_IMAGE}} -size 512 {{.MKEXT2_FONTS}} {{.BUILD_DIR}}/disk-staging-riscv64/rachel.elf {{.BUILD_DIR}}/disk-staging-riscv64/linux.elf {{.BUILD_DIR}}/disk-staging-riscv64/fs.elf {{.BUILD_DIR}}/disk-staging-riscv64/handletest.elf {{.BUILD_DIR}}/disk-staging-riscv64/clocktest.elf {{.BUILD_DIR}}/disk-staging-riscv64/clocks.elf {{.BUILD_DIR}}/disk-staging-riscv64/helloworld.mzr {{.BUILD_DIR}}/disk-staging-riscv64/prefs.mzr {{.BUILD_DIR}}/disk-staging-riscv64/fontsvc.mzr {{.BUILD_DIR}}/disk-staging-riscv64/keymapper.mzr {{.BUILD_DIR}}/disk-staging-riscv64/linux-ui.mzr {{.BUILD_DIR}}/disk-staging-riscv64/startup.toml {{.BUILD_DIR}}/disk-staging-riscv64/rachel.toml {{.KMAZARIN_RISCV64_ELF}} {{.BUILD_DIR}}/boot-image.bin'
      - '{{.GO}} tool go-echo "RISC-V 64-bit disk image created at {{.DISK_RISCV64_IMAGE}}"'

  # ===========================================================================
  # Run Tasks
  # ===========================================================================

  run:
    desc: "Run ARM64 diplomat+kmazarin in QEMU (shorthand for run-arm64)"
    cmds:
      - task: run-arm64
        vars:
          TIMEOUT: '{{.TIMEOUT | default "5"}}'

  run-arm64:
    desc: "Run ARM64 diplomat+kmazarin in QEMU (TIMEOUT=N for timeout, default=5s)"
    deps: [diplomat:esp-arm64, disk-arm64]
    vars:
      TIMEOUT: '{{.TIMEOUT | default "5"}}'
      LOG_FILE: /tmp/diplomat-arm64-serial.log
      CPU_LOG_FILE: /tmp/qemu-arm64-cpu.log
    cmds:
      - task: stop-arm64
      - '{{.GO}} tool go-rm {{.LOG_FILE}}'
      - '{{.GO}} tool go-echo "Starting diplomat ARM64 in QEMU (timeout {{.TIMEOUT}}s)..."'
      - task: run-arm64-background
      - '{{.GO}} tool go-sleep {{.TIMEOUT}}s'
      - task: stop-arm64
      - '{{.GO}} tool go-sleep 0.3'
      - '{{.GO}} tool go-echo'
      - '{{.GO}} tool go-echo "=== Diplomat ARM64 Serial Output ==="'
      - '{{.GO}} tool safe-serial-read {{.LOG_FILE}}'
      - '{{.GO}} tool go-echo'
      - '{{.GO}} tool go-echo "Log files:"'
      - '{{.GO}} tool go-echo "  Serial:   {{.LOG_FILE}}"'
      - '{{.GO}} tool go-echo "  CPU log:  {{.CPU_LOG_FILE}}"'
      - '{{.GO}} tool go-echo'
      - '{{.GO}} tool go-echo "To view CPU log: tail -100 {{.CPU_LOG_FILE}}"'

  run-arm64-background:
    desc: Start QEMU with ARM64 diplomat in background (internal task)
    internal: true
    vars:
      LOG_FILE: /tmp/diplomat-arm64-serial.log
      CPU_LOG_FILE: /tmp/qemu-arm64-cpu.log
      FW_CODE: '{{if ne .OVMF_ARM64 ""}}{{.OVMF_ARM64}}{{else}}{{dir .QEMU}}/../share/qemu/edk2-aarch64-code.fd{{end}}'
      FW_VARS_TEMPLATE: '{{if ne .OVMF_ARM64 ""}}{{dir .OVMF_ARM64}}/edk2-arm-vars.fd{{else}}{{dir .QEMU}}/../share/qemu/edk2-arm-vars.fd{{end}}'
    cmds:
      - '{{.GO}} tool go-rm {{.CPU_LOG_FILE}}'
      - '{{.GO}} tool go-cp {{.FW_VARS_TEMPLATE}} {{.BUILD_DIR}}/edk2-arm-vars.fd'
      - '{{.GO}} tool go-start {{.QEMU}} -M virt -cpu cortex-a72 -m {{.QEMU_RAM}} -rtc base=utc,clock=host -drive if=pflash,format=raw,readonly=on,file={{.FW_CODE}} -drive if=pflash,format=raw,file={{.BUILD_DIR}}/edk2-arm-vars.fd -drive file={{.ESP_ARM64_IMAGE}},format=raw,if=virtio -drive if=none,format=raw,readonly=on,file={{.DISK_IMAGE}},id=flock0 -device virtio-blk-pci,drive=flock0,bus=pcie.0 -device virtio-gpu-pci -device virtio-keyboard-pci -device virtio-tablet-pci -device virtio-rng-pci -serial file:{{.LOG_FILE}} -monitor tcp:127.0.0.1:4446,server,nowait -display {{.DISPLAY}} -no-reboot'
      - '{{.GO}} tool go-echo "QEMU (ARM64 UEFI) started in background"'
      - '{{.GO}} tool go-echo "Monitor: tcp:127.0.0.1:4446"'
      - '{{.GO}} tool go-echo "Log file: {{.LOG_FILE}}"'
      - '{{.GO}} tool go-echo "CPU log: {{.CPU_LOG_FILE}}"'

  # ── ARM64 HVF (macOS only) ──────────────────────────────────────────
  # Uses Apple Hypervisor.framework for near-native speed on Apple Silicon Macs.
  # Requires macOS with an Apple Silicon (M-series) CPU.
  # Not available on Linux or Intel Macs — use run-arm64 (TCG) instead.
  run-arm64-hvf:
    desc: "Run ARM64 diplomat+kmazarin in QEMU with HVF acceleration (macOS Apple Silicon only)"
    deps: [diplomat:esp-arm64, disk-arm64]
    vars:
      TIMEOUT: '{{.TIMEOUT | default "5"}}'
      LOG_FILE: /tmp/diplomat-arm64-serial.log
      CPU_LOG_FILE: /tmp/qemu-arm64-cpu.log
    cmds:
      - task: stop-arm64
      - '{{.GO}} tool go-rm {{.LOG_FILE}}'
      - '{{.GO}} tool go-echo "Starting diplomat ARM64 in QEMU+HVF (timeout {{.TIMEOUT}}s)..."'
      - task: run-arm64-hvf-background
      - '{{.GO}} tool go-sleep {{.TIMEOUT}}s'
      - task: stop-arm64
      - '{{.GO}} tool go-sleep 0.3'
      - '{{.GO}} tool go-echo'
      - '{{.GO}} tool go-echo "=== Diplomat ARM64 (HVF) Serial Output ==="'
      - '{{.GO}} tool safe-serial-read {{.LOG_FILE}}'
      - '{{.GO}} tool go-echo'
      - '{{.GO}} tool go-echo "Log files:"'
      - '{{.GO}} tool go-echo "  Serial:   {{.LOG_FILE}}"'
      - '{{.GO}} tool go-echo "  CPU log:  {{.CPU_LOG_FILE}}"'
      - '{{.GO}} tool go-echo'
      - '{{.GO}} tool go-echo "To view CPU log: tail -100 {{.CPU_LOG_FILE}}"'

  run-arm64-hvf-background:
    desc: Start QEMU with ARM64 diplomat + HVF in background (macOS Apple Silicon only)
    internal: true
    vars:
      LOG_FILE: /tmp/diplomat-arm64-serial.log
      CPU_LOG_FILE: /tmp/qemu-arm64-cpu.log
      FW_CODE: '{{if ne .OVMF_ARM64 ""}}{{.OVMF_ARM64}}{{else}}{{dir .QEMU}}/../share/qemu/edk2-aarch64-code.fd{{end}}'
      FW_VARS_TEMPLATE: '{{if ne .OVMF_ARM64 ""}}{{dir .OVMF_ARM64}}/edk2-arm-vars.fd{{else}}{{dir .QEMU}}/../share/qemu/edk2-arm-vars.fd{{end}}'
    cmds:
      - '{{.GO}} tool go-rm {{.CPU_LOG_FILE}}'
      - '{{.GO}} tool go-cp {{.FW_VARS_TEMPLATE}} {{.BUILD_DIR}}/edk2-arm-vars.fd'
      - '{{.GO}} tool go-start {{.QEMU}} -M virt -accel hvf -cpu host -m {{.QEMU_RAM}} -rtc base=utc,clock=host -drive if=pflash,format=raw,readonly=on,file={{.FW_CODE}} -drive if=pflash,format=raw,file={{.BUILD_DIR}}/edk2-arm-vars.fd -drive file={{.ESP_ARM64_IMAGE}},format=raw,if=virtio -drive if=none,format=raw,readonly=on,file={{.DISK_IMAGE}},id=flock0 -device virtio-blk-pci,drive=flock0,bus=pcie.0 -device virtio-gpu-pci -device virtio-keyboard-pci -device virtio-mouse-pci -device virtio-tablet-pci -device virtio-rng-pci -serial file:{{.LOG_FILE}} -monitor tcp:127.0.0.1:4446,server,nowait -display {{.DISPLAY}} -no-reboot'
      - '{{.GO}} tool go-echo "QEMU (ARM64 UEFI + HVF) started in background"'
      - '{{.GO}} tool go-echo "Monitor: tcp:127.0.0.1:4446"'
      - '{{.GO}} tool go-echo "Log file: {{.LOG_FILE}}"'
      - '{{.GO}} tool go-echo "CPU log: {{.CPU_LOG_FILE}}"'

  run-x86_64:
    desc: "Run x86_64 diplomat+kmazarin in QEMU (TIMEOUT=N for timeout, default=5s)"
    deps: [diplomat:esp-x86_64-kmazarin, disk-x86_64]
    vars:
      TIMEOUT: '{{.TIMEOUT | default "5"}}'
      LOG_FILE: /tmp/diplomat-serial.log
    cmds:
      - task: stop-x86_64
      - '{{.GO}} tool go-rm {{.LOG_FILE}}'
      - '{{.GO}} tool go-echo "Starting diplomat x86_64 + kmazarin in QEMU (timeout {{.TIMEOUT}}s)..."'
      - task: run-x86_64-background
      - '{{.GO}} tool go-sleep {{.TIMEOUT}}s'
      - task: stop-x86_64
      - '{{.GO}} tool go-sleep 0.3'
      - '{{.GO}} tool go-echo'
      - '{{.GO}} tool go-echo "=== Diplomat x86_64 + Kmazarin Serial Output ==="'
      - '{{.GO}} tool safe-serial-read {{.LOG_FILE}}'
      - '{{.GO}} tool go-echo'
      - '{{.GO}} tool go-echo "Log file: {{.LOG_FILE}}"'

  run-x86_64-background:
    desc: Start QEMU with diplomat + kmazarin in background (internal task)
    internal: true
    vars:
      LOG_FILE: /tmp/diplomat-serial.log
      FW_CODE: '{{if ne .OVMF ""}}{{.OVMF}}{{else}}{{dir .QEMU_X86_64}}/../share/qemu/edk2-x86_64-code.fd{{end}}'
    cmds:
      - '{{.GO}} tool go-start {{.QEMU_X86_64}} -machine q35,accel=tcg -cpu max -m 8G -drive if=pflash,format=raw,readonly=on,file={{.FW_CODE}} -drive file={{.BUILD_DIR}}/esp-kmazarin.img,format=raw,if=ide -drive file={{.BUILD_DIR}}/disk-amd64.img,format=raw,if=none,id=drive-virtio-disk0 -device virtio-blk-pci,drive=drive-virtio-disk0,bus=pcie.0,addr=0x10 -boot c -serial file:{{.LOG_FILE}} -monitor tcp:127.0.0.1:4445,server,nowait -device virtio-vga -device virtio-keyboard-pci -device virtio-tablet-pci -device virtio-rng-pci -display cocoa -no-reboot'
      - '{{.GO}} tool go-echo "QEMU (x86_64 + kmazarin) started in background"'
      - '{{.GO}} tool go-echo "Monitor: tcp:127.0.0.1:4445"'
      - '{{.GO}} tool go-echo "Log file: {{.LOG_FILE}}"'

  run-x86_64-diplomat-only:
    desc: "Run x86_64 diplomat (no kmazarin) in QEMU with OVMF (TIMEOUT=N for timeout, default=5s)"
    deps: [diplomat:esp-x86_64]
    vars:
      TIMEOUT: '{{.TIMEOUT | default "5"}}'
      LOG_FILE: /tmp/diplomat-serial.log
    cmds:
      - task: stop-x86_64
      - '{{.GO}} tool go-rm {{.LOG_FILE}}'
      - '{{.GO}} tool go-echo "Starting diplomat in QEMU (timeout {{.TIMEOUT}}s)..."'
      - task: run-x86_64-diplomat-only-background
      - '{{.GO}} tool go-sleep {{.TIMEOUT}}s'
      - task: stop-x86_64
      - '{{.GO}} tool go-sleep 0.3'
      - '{{.GO}} tool go-echo'
      - '{{.GO}} tool go-echo "=== Diplomat Serial Output ==="'
      - '{{.GO}} tool safe-serial-read {{.LOG_FILE}}'
      - '{{.GO}} tool go-echo'
      - '{{.GO}} tool go-echo "Log file: {{.LOG_FILE}}"'

  run-x86_64-diplomat-only-background:
    desc: Start QEMU with diplomat in background (internal task)
    internal: true
    vars:
      LOG_FILE: /tmp/diplomat-serial.log
      FW_CODE: '{{if ne .OVMF ""}}{{.OVMF}}{{else}}{{dir .QEMU_X86_64}}/../share/qemu/edk2-x86_64-code.fd{{end}}'
    cmds:
      - '{{.GO}} tool go-start {{.QEMU_X86_64}} -machine q35,accel=tcg -cpu max -m 8G -drive if=pflash,format=raw,readonly=on,file={{.FW_CODE}} -drive file={{.ESP_IMAGE}},format=raw,if=ide -boot c -serial file:{{.LOG_FILE}} -monitor tcp:127.0.0.1:4445,server,nowait -display none -no-reboot'
      - '{{.GO}} tool go-echo "QEMU (x86_64) started in background"'
      - '{{.GO}} tool go-echo "Monitor: tcp:127.0.0.1:4445"'
      - '{{.GO}} tool go-echo "Log file: {{.LOG_FILE}}"'

  run-riscv64:
    desc: "Run RISC-V diplomat+kmazarin in QEMU via OpenSBI -kernel (TIMEOUT=N for timeout, default=5s)"
    deps: [diplomat:riscv64, disk-riscv64]
    vars:
      TIMEOUT: '{{.TIMEOUT | default "5"}}'
      LOG_FILE: /tmp/diplomat-riscv64-serial.log
    cmds:
      - task: stop-riscv64
      - '{{.GO}} tool go-rm {{.LOG_FILE}}'
      - '{{.GO}} tool go-echo "Starting RISC-V diplomat+kmazarin in QEMU (timeout {{.TIMEOUT}}s)..."'
      - task: run-riscv64-background
      - '{{.GO}} tool go-sleep {{.TIMEOUT}}s'
      - task: stop-riscv64
      - '{{.GO}} tool go-sleep 0.3'
      - '{{.GO}} tool go-echo'
      - '{{.GO}} tool go-echo "=== Diplomat RISC-V 64-bit Serial Output ==="'
      - '{{.GO}} tool safe-serial-read {{.LOG_FILE}}'
      - '{{.GO}} tool go-echo'
      - '{{.GO}} tool go-echo "Log file: {{.LOG_FILE}}"'

  run-riscv64-background:
    desc: Start QEMU with RISC-V diplomat via OpenSBI -kernel in background (internal task)
    internal: true
    vars:
      LOG_FILE: /tmp/diplomat-riscv64-serial.log
      # VIRTIO_TRANSPORT options: "pci" (default) or "mmio" (legacy RISC-V fallback)
      VIRTIO_TRANSPORT: '{{.VIRTIO_TRANSPORT | default "pci"}}'
    cmds:
      - |
        {{if eq .VIRTIO_TRANSPORT "mmio"}}
        {{.GO}} tool go-start {{.QEMU_RISCV64}} -M virt -m {{.QEMU_RAM}} -rtc base=utc,clock=host -bios default -kernel {{.DIPLOMAT_RISCV64_ELF}} -drive file={{.DISK_RISCV64_IMAGE}},format=raw,if=none,id=drive-virtio-disk0 -device virtio-blk-device,drive=drive-virtio-disk0 -device virtio-gpu-pci -device virtio-keyboard-pci -device virtio-mouse-pci -device virtio-rng-pci -serial file:{{.LOG_FILE}} -monitor tcp:127.0.0.1:4447,server,nowait -display {{.DISPLAY}} -no-reboot -global virtio-mmio.force-legacy=false
        {{else}}
        {{.GO}} tool go-start {{.QEMU_RISCV64}} -M virt -m {{.QEMU_RAM}} -rtc base=utc,clock=host -bios default -kernel {{.DIPLOMAT_RISCV64_ELF}} -drive file={{.DISK_RISCV64_IMAGE}},format=raw,if=none,id=boot-mmio,readonly=on -device virtio-blk-device,drive=boot-mmio -drive file={{.DISK_RISCV64_IMAGE}},format=raw,if=none,id=drive-virtio-disk0,file.locking=off -device virtio-blk-pci,drive=drive-virtio-disk0 -device virtio-gpu-pci -device virtio-keyboard-pci -device virtio-mouse-pci -device virtio-rng-pci -serial file:{{.LOG_FILE}} -monitor tcp:127.0.0.1:4447,server,nowait -display {{.DISPLAY}} -no-reboot -global virtio-mmio.force-legacy=false
        {{end}}
      - '{{.GO}} tool go-echo "QEMU (RISC-V diplomat via OpenSBI, VirtIO {{.VIRTIO_TRANSPORT}}) started in background"'
      - '{{.GO}} tool go-echo "Monitor: tcp:127.0.0.1:4447"'
      - '{{.GO}} tool go-echo "Log file: {{.LOG_FILE}}"'

  # ===========================================================================
  # Direct Kernel Boot (RISC-V) - Bypass UEFI
  # ===========================================================================

  run-riscv64-direct:
    desc: "Run RISC-V kmazarin directly with OpenSBI (no UEFI, TIMEOUT=N for timeout, default=5s)"
    deps: [kmazarin:riscv64, disk-arm64]
    vars:
      TIMEOUT: '{{.TIMEOUT | default "5"}}'
      LOG_FILE: /tmp/kmazarin-riscv64-serial.log
    cmds:
      - task: stop-riscv64-direct
      - '{{.GO}} tool go-rm {{.LOG_FILE}}'
      - '{{.GO}} tool go-echo "Starting RISC-V kmazarin with direct kernel boot (timeout {{.TIMEOUT}}s)..."'
      - task: run-riscv64-direct-background
      - '{{.GO}} tool go-sleep {{.TIMEOUT}}s'
      - task: stop-riscv64-direct
      - '{{.GO}} tool go-sleep 0.3'
      - '{{.GO}} tool go-echo'
      - '{{.GO}} tool go-echo "=== RISC-V Kmazarin Serial Output ==="'
      - '{{.GO}} tool safe-serial-read {{.LOG_FILE}}'
      - '{{.GO}} tool go-echo'
      - '{{.GO}} tool go-echo "Log file: {{.LOG_FILE}}"'

  run-riscv64-direct-background:
    desc: Start QEMU with direct RISC-V kernel boot in background (internal task)
    internal: true
    vars:
      LOG_FILE: /tmp/kmazarin-riscv64-serial.log
      OPENSBI: '{{dir .QEMU_RISCV64}}/../share/qemu/opensbi-riscv64-generic-fw_dynamic.bin'
    cmds:
      - '{{.GO}} tool go-start {{.QEMU_RISCV64}} -M virt -cpu rv64 -m 2G -bios {{.OPENSBI}} -kernel {{.KMAZARIN_RISCV64_ELF}} -drive if=none,format=raw,readonly=on,file={{.DISK_IMAGE}},id=flock0 -device virtio-blk-pci,drive=flock0,bus=pcie.0 -device virtio-gpu-pci -device virtio-keyboard-pci -device virtio-tablet-pci -device virtio-rng-pci -serial file:{{.LOG_FILE}} -monitor tcp:127.0.0.1:4448,server,nowait -display {{.DISPLAY}} -no-reboot'
      - '{{.GO}} tool go-echo "QEMU (RISC-V direct kernel boot) started in background"'
      - '{{.GO}} tool go-echo "Monitor: tcp:127.0.0.1:4448"'
      - '{{.GO}} tool go-echo "Log file: {{.LOG_FILE}}"'

  # ===========================================================================
  # Stop Tasks
  # ===========================================================================

  stop-x86_64:
    desc: Stop x86_64 QEMU instance
    cmds:
      - cmd: '{{.GO}} tool go-nc -w 1s -c quit 127.0.0.1 4445'
        ignore_error: true
      - '{{.GO}} tool go-sleep 0.5'

  stop-arm64:
    desc: Stop ARM64 QEMU instance
    cmds:
      - cmd: '{{.GO}} tool go-nc -w 1s -c quit 127.0.0.1 4446'
        ignore_error: true
      - '{{.GO}} tool go-sleep 0.5'

  stop-riscv64:
    desc: Stop RISC-V diplomat QEMU instance
    cmds:
      - cmd: '{{.GO}} tool go-nc -w 1s -c quit 127.0.0.1 4447'
        ignore_error: true
      - '{{.GO}} tool go-sleep 0.5'

  stop-riscv64-direct:
    desc: Stop RISC-V direct kernel boot QEMU instance
    cmds:
      - cmd: '{{.GO}} tool go-nc -w 1s -c quit 127.0.0.1 4448'
        ignore_error: true
      - '{{.GO}} tool go-sleep 0.5'

  stop:
    desc: Stop all running QEMU instances
    cmds:
      # Send quit command to QEMU monitor if it's listening
      - cmd: '{{.GO}} tool go-nc -w 1s -c quit 127.0.0.1 4444'
        ignore_error: true
      - '{{.GO}} tool go-sleep 0.5'

  # ===========================================================================
  # Utility Tasks
  # ===========================================================================

  qemu-console:
    desc: "Send command to QEMU monitor (CMD='info registers' or other QEMU command)"
    vars:
      CMD: '{{.CMD | default "info registers"}}'
    cmds:
      - '{{.GO}} tool go-nc -c "{{.CMD}}" 127.0.0.1 4444'

  show:
    desc: "Show serial output using safe-serial-read with pagination"
    cmds:
      - '{{.GO}} tool safe-serial-read -p'

  show-debug:
    desc: "Show last N lines of debug log (N=100 default)"
    vars:
      N: '{{.N | default "100"}}'
    cmds:
      - '{{.GO}} tool go-tail -n {{.N}} /tmp/qemu-debug.log'

  test:
    desc: Run Go tests
    deps: [check-env]
    cmds:
      - '{{.GO}} tool go-echo "Running tests..."'
      - '{{.GO}} test -v ./shared/...'

  clean:
    desc: Remove build artifacts
    cmds:
      - '{{.GO}} tool go-echo "Cleaning build artifacts..."'
      - '{{.GO}} tool go-rm -r {{.BUILD_DIR}}'
      - '{{.GO}} tool go-rm -f kmazarin/kmazarin/fs.elf'
      - '{{.GO}} tool go-rm -f kmazarin/kmazarin/kernel.toml'
      - '{{.GO}} tool go-echo "Cleaned."'

  # ===========================================================================
  # Default Target
  # ===========================================================================

  all:
    desc: Build diplomat + kmazarin for all architectures (x86_64, ARM64, RISC-V)
    deps: [diplomat:esp-x86_64-kmazarin, diplomat:esp-arm64, diplomat:riscv64, disk-arm64, disk-x86_64, disk-riscv64]

  default:
    desc: Build diplomat + kmazarin for ARM64 (default target)
    deps: [diplomat:esp-arm64, disk-arm64]
