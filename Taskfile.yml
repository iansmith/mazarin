# Taskfile for mazzy - Go Native Toolchain Build (Shell-Free)
# Builds bare-metal ARM64 kernel (Cardinal + Kmazarin) and flock userspace programs
#
# Usage:
#   task              # Build cardinal and kmazarin (default)
#   task cardinal     # Build cardinal bootloader
#   task kmazarin     # Build kmazarin kernel
#   task priest       # Build priest syscall router
#   task disk         # Create FAT32 disk image
#   task clean        # Remove build artifacts
#
# Environment:
#   GO=/path/to/go                        # Go compiler (>= 1.24)
#   QEMU=/path/to/qemu-system-aarch64     # QEMU (>= 10.2)
#   GOTOOLCHAIN=auto                      # Required
#   DEBUG=1                               # Optional: disable optimizations

version: '3'

vars:
  # Environment variables (shell-free using Go templates)
  GO: '{{env "GO" | default "go"}}'
  QEMU: '{{env "QEMU" | default "qemu-system-aarch64"}}'
  DEBUG: '{{env "DEBUG" | default ""}}'

  # Build configuration (prefixed to avoid conflicts with Go env vars)
  TARGET_GOARCH: arm64
  TARGET_GOOS: linux
  BUILD_DIR: build

  # Debug build: disable optimizations and inlining
  # Usage: DEBUG=1 task cardinal
  GCFLAGS: '{{if eq .DEBUG "1"}}-gcflags=all=-N -l{{end}}'

  # Output files
  CARDINAL_ELF: '{{.BUILD_DIR}}/cardinal.elf'
  KMAZARIN_ELF: '{{.BUILD_DIR}}/kmazarin.elf'
  KMAZARIN_OVERLAY_JSON: '{{.BUILD_DIR}}/kmazarin-overlay.json'
  USERSPACE_OVERLAY_JSON: '{{.BUILD_DIR}}/userspace-overlay.json'
  THIN_OVERLAY_JSON: '{{.BUILD_DIR}}/thin-overlay.json'
  PRIEST_ELF: '{{.BUILD_DIR}}/priest.elf'
  PRIEST2_ELF: '{{.BUILD_DIR}}/priest2.elf'
  HELLOWORLD_ELF: '{{.BUILD_DIR}}/helloworld.elf'
  HELLOWORLD_THIN_ELF: '{{.BUILD_DIR}}/helloworld-thin.elf'
  HELLOWORLD_MAZ: '{{.BUILD_DIR}}/helloworld.maz'
  DISK_IMAGE: '{{.BUILD_DIR}}/disk.img'

  # Generated embedded data
  KMAZARIN_DATA_ASM: cardinal/asm/dev/kmazarin_data_arm64.s
  BOOT_IMAGE_DATA_ASM: cardinal/asm/dev/boot_mazarin_data_arm64.s

  # Source files
  BOOT_IMAGE_BIN: assets/boot-mazarin.bin

  # Runtime patches directory
  RUNTIME_PATCHES_DIR: runtime-patches
  USERSPACE_OVERLAY_DIR: mazarin/overlay/userspace

tasks:
  # ===========================================================================
  # Environment and Version Checks
  # ===========================================================================

  check-env:
    desc: Verify GO, QEMU, GOTOOLCHAIN, and tool versions
    cmds:
      # Check GOTOOLCHAIN
      - '{{.GO}} tool go-env -check GOTOOLCHAIN=auto -msg "GOTOOLCHAIN must be ''auto''. Run: export GOTOOLCHAIN=auto"'
      # Check Go version >= 1.24
      - '{{.GO}} tool check-version -go {{.GO}} -min 1.24'
      # Check QEMU version >= 10.2
      - '{{.GO}} tool check-version -qemu {{.QEMU}} -min 10.2'
      - echo "Environment check passed"
    silent: true

  # ===========================================================================
  # Build Directory
  # ===========================================================================

  build-dir:
    desc: Create build directory
    cmds:
      - '{{.GO}} tool go-mkdir {{.BUILD_DIR}}'
    status:
      - '{{.GO}} tool go-test -d {{.BUILD_DIR}}'

  # ===========================================================================
  # Overlay Generation
  # ===========================================================================

  kmazarin-overlay:
    desc: Generate runtime overlay JSON for kmazarin
    deps: [build-dir]
    sources:
      - '{{.RUNTIME_PATCHES_DIR}}/cgo_mmap.go'
      - '{{.RUNTIME_PATCHES_DIR}}/malloc.go'
      - '{{.RUNTIME_PATCHES_DIR}}/mcache.go'
      - '{{.RUNTIME_PATCHES_DIR}}/os_linux_arm64.go'
      - '{{.RUNTIME_PATCHES_DIR}}/preempt.go'
      - '{{.RUNTIME_PATCHES_DIR}}/tagptr_64bit.go'
      - '{{.RUNTIME_PATCHES_DIR}}/syscall/syscall_linux.go'
    generates:
      - '{{.KMAZARIN_OVERLAY_JSON}}'
    cmds:
      - '{{.GO}} tool gen-overlay -type kmazarin -patches {{.RUNTIME_PATCHES_DIR}} -o {{.KMAZARIN_OVERLAY_JSON}}'

  userspace-overlay:
    desc: Generate runtime overlay JSON for userspace programs
    deps: [build-dir]
    sources:
      - '{{.USERSPACE_OVERLAY_DIR}}/syscall_linux.go'
      - '{{.USERSPACE_OVERLAY_DIR}}/asm_linux_arm64.s'
      - '{{.USERSPACE_OVERLAY_DIR}}/runtime/cgo_mmap.go'
      - '{{.USERSPACE_OVERLAY_DIR}}/runtime/lock_spinbit.go'
    generates:
      - '{{.USERSPACE_OVERLAY_JSON}}'
    cmds:
      - '{{.GO}} tool gen-overlay -type userspace -patches {{.USERSPACE_OVERLAY_DIR}} -o {{.USERSPACE_OVERLAY_JSON}}'

  thin-overlay:
    desc: Generate thin client overlay via AST stub generator
    deps: [build-dir]
    generates:
      - '{{.THIN_OVERLAY_JSON}}'
      - '{{.BUILD_DIR}}/thin-stubs.manifest'
    vars:
      GOROOT:
        sh: '{{.GO}} env GOROOT'
    cmds:
      - '{{.GO}} tool gen-ast-stubs -runtime={{.GOROOT}}/src/runtime -output={{.BUILD_DIR}}/thin-overlay/runtime -overlay={{.THIN_OVERLAY_JSON}} -manifest={{.BUILD_DIR}}/thin-stubs.manifest'
      - echo "Generated {{.THIN_OVERLAY_JSON}}"

  # ===========================================================================
  # Embedded Data Generation
  # ===========================================================================

  embed-kmazarin:
    desc: Generate assembly with embedded kmazarin binary
    deps: [kmazarin]
    sources:
      - '{{.KMAZARIN_ELF}}'
    generates:
      - '{{.KMAZARIN_DATA_ASM}}'
    cmds:
      - '{{.GO}} tool incbin2goasm -sym kmazarin_binary -global -o {{.KMAZARIN_DATA_ASM}} {{.KMAZARIN_ELF}}'

  embed-boot-image:
    desc: Generate assembly with embedded boot image
    deps: [build-dir]
    sources:
      - '{{.BOOT_IMAGE_BIN}}'
    generates:
      - '{{.BOOT_IMAGE_DATA_ASM}}'
    cmds:
      - '{{.GO}} tool incbin2goasm -sym _binary_boot_mazarin_bin -global -o {{.BOOT_IMAGE_DATA_ASM}} {{.BOOT_IMAGE_BIN}}'

  # ===========================================================================
  # Kmazarin Kernel Build
  # ===========================================================================

  kmazarin:
    desc: Build kmazarin kernel
    deps: [check-env, kmazarin-overlay]
    sources:
      - 'kmazarin/**/*.go'
      - 'kmazarin/**/*.s'
      - 'shared/**/*.go'
      - '{{.KMAZARIN_OVERLAY_JSON}}'
    generates:
      - '{{.KMAZARIN_ELF}}'
    vars:
      KMAZARIN_LOAD_ADDR:
        sh: '{{.GO}} tool print-kmazarin-addr'
    cmds:
      - echo "Building kmazarin kernel (static Go binary at {{.KMAZARIN_LOAD_ADDR}})..."
      - 'CGO_ENABLED=0 GOARCH={{.TARGET_GOARCH}} GOOS={{.TARGET_GOOS}} {{.GO}} build -overlay={{.ROOT_DIR}}/{{.KMAZARIN_OVERLAY_JSON}} {{.GCFLAGS}} -ldflags="-checklinkname=0 -T {{.KMAZARIN_LOAD_ADDR}}" -o {{.KMAZARIN_ELF}} ./kmazarin/kmazarin'
      - echo "Fixing kmazarin ELF for QEMU compatibility..."
      - '{{.GO}} tool fix-go-elf {{.KMAZARIN_ELF}}'
      - echo "Relocating kmazarin to high memory (0xFFFFFFFF41800000)..."
      - '{{.GO}} tool relocate-kmazarin {{.KMAZARIN_ELF}} {{.KMAZARIN_ELF}}.tmp'
      - '{{.GO}} tool go-mv {{.KMAZARIN_ELF}}.tmp {{.KMAZARIN_ELF}}'
      - echo "Kmazarin kernel built at {{.KMAZARIN_ELF}}"

  # ===========================================================================
  # Cardinal Bootloader Build
  # ===========================================================================

  cardinal:
    desc: Build cardinal bootloader
    deps: [check-env, embed-kmazarin, embed-boot-image]
    sources:
      - 'cardinal/**/*.go'
      - 'cardinal/**/*.s'
      - '{{.KMAZARIN_DATA_ASM}}'
      - '{{.BOOT_IMAGE_DATA_ASM}}'
      - '{{.KMAZARIN_ELF}}'
    generates:
      - '{{.CARDINAL_ELF}}'
    cmds:
      - echo "Building cardinal bootloader..."
      - 'CGO_ENABLED=0 GOARCH={{.TARGET_GOARCH}} GOOS={{.TARGET_GOOS}} {{.GO}} build {{.GCFLAGS}} -ldflags="-checklinkname=0 -T 0x40100000" -o {{.CARDINAL_ELF}} ./cardinal/main'
      - echo "Patching entry point to _cardinal_boot..."
      - '{{.GO}} tool patch-entry {{.CARDINAL_ELF}} _cardinal_boot'
      - echo "Patching linker values..."
      - '{{.GO}} tool compute-linker-values -patch -kmazarin {{.KMAZARIN_ELF}} {{.CARDINAL_ELF}}'
      - echo "Fixing ELF for QEMU compatibility..."
      - '{{.GO}} tool fix-go-elf {{.CARDINAL_ELF}}'
      - echo "Cardinal ready at {{.CARDINAL_ELF}}"

  # ===========================================================================
  # Flock Userspace Programs
  # ===========================================================================

  priest:
    desc: Build priest syscall router
    deps: [check-env, userspace-overlay]
    sources:
      - 'flock/**/*.go'
      - 'flock/**/*.s'
      - 'mazarin/**/*.go'
      - '{{.USERSPACE_OVERLAY_JSON}}'
    generates:
      - '{{.PRIEST_ELF}}'
    cmds:
      - echo "Building priest (syscall router with overlay)..."
      - 'CGO_ENABLED=0 GOARCH={{.TARGET_GOARCH}} GOOS={{.TARGET_GOOS}} {{.GO}} build -overlay={{.ROOT_DIR}}/{{.USERSPACE_OVERLAY_JSON}} {{.GCFLAGS}} -o {{.PRIEST_ELF}} ./flock/cmd/priest'
      - echo "Priest built at {{.PRIEST_ELF}}"

  priest2:
    desc: Build priest2 scheduling test program
    deps: [check-env, userspace-overlay]
    sources:
      - 'flock/**/*.go'
      - 'flock/**/*.s'
      - 'mazarin/**/*.go'
      - '{{.USERSPACE_OVERLAY_JSON}}'
    generates:
      - '{{.PRIEST2_ELF}}'
    cmds:
      - echo "Building priest2 (scheduling test program)..."
      - 'CGO_ENABLED=0 GOARCH={{.TARGET_GOARCH}} GOOS={{.TARGET_GOOS}} {{.GO}} build -overlay={{.ROOT_DIR}}/{{.USERSPACE_OVERLAY_JSON}} {{.GCFLAGS}} -o {{.PRIEST2_ELF}} ./flock/cmd/priest2'
      - echo "Priest2 built at {{.PRIEST2_ELF}}"

  helloworld:
    desc: Build helloworld test program
    deps: [check-env, userspace-overlay]
    sources:
      - 'flock/**/*.go'
      - 'flock/**/*.s'
      - 'mazarin/**/*.go'
      - '{{.USERSPACE_OVERLAY_JSON}}'
    generates:
      - '{{.HELLOWORLD_ELF}}'
    cmds:
      - echo "Building helloworld (userspace program)..."
      - 'CGO_ENABLED=0 GOARCH={{.TARGET_GOARCH}} GOOS={{.TARGET_GOOS}} {{.GO}} build -overlay={{.ROOT_DIR}}/{{.USERSPACE_OVERLAY_JSON}} {{.GCFLAGS}} -o {{.HELLOWORLD_ELF}} ./flock/cmd/helloworld'
      - echo "Helloworld built at {{.HELLOWORLD_ELF}}"

  helloworld-thin:
    desc: Build helloworld with thin client overlay (minimal runtime)
    deps: [check-env, thin-overlay]
    sources:
      - 'flock/**/*.go'
      - 'flock/**/*.s'
      - '{{.THIN_OVERLAY_JSON}}'
    generates:
      - '{{.HELLOWORLD_THIN_ELF}}'
    cmds:
      - echo "Building helloworld-thin (minimal runtime stubs)..."
      - 'CGO_ENABLED=0 GOARCH={{.TARGET_GOARCH}} GOOS={{.TARGET_GOOS}} {{.GO}} build -overlay={{.ROOT_DIR}}/{{.THIN_OVERLAY_JSON}} {{.GCFLAGS}} -o {{.HELLOWORLD_THIN_ELF}} ./flock/cmd/helloworld'
      - echo "Helloworld-thin built at {{.HELLOWORLD_THIN_ELF}}"

  helloworld-maz:
    desc: Build helloworld.maz (direct SVC, no overlay)
    deps: [check-env, build-dir]
    sources:
      - 'flock/**/*.go'
      - 'flock/**/*.s'
    generates:
      - '{{.HELLOWORLD_MAZ}}'
    cmds:
      - echo "Building helloworld.maz (direct SVC, no overlay)..."
      - 'CGO_ENABLED=0 GOARCH={{.TARGET_GOARCH}} GOOS={{.TARGET_GOOS}} {{.GO}} build {{.GCFLAGS}} -o {{.HELLOWORLD_MAZ}} ./flock/cmd/helloworld'
      - echo "Helloworld.maz built at {{.HELLOWORLD_MAZ}}"

  # ===========================================================================
  # Disk Image
  # ===========================================================================

  disk:
    desc: Create FAT32 disk image with flock binaries
    deps: [priest, priest2, helloworld-maz]
    sources:
      - '{{.PRIEST_ELF}}'
      - '{{.PRIEST2_ELF}}'
      - '{{.HELLOWORLD_MAZ}}'
    generates:
      - '{{.DISK_IMAGE}}'
    cmds:
      - echo "Creating FAT32 disk image..."
      - '{{.GO}} tool mkfat32 -o {{.DISK_IMAGE}} {{.PRIEST_ELF}} {{.PRIEST2_ELF}} {{.HELLOWORLD_MAZ}}'
      - echo "Disk image created at {{.DISK_IMAGE}}"

  # ===========================================================================
  # Run and Stop
  # ===========================================================================

  run:
    desc: "Run QEMU with cardinal/kmazarin (TIMEOUT=N for timeout in seconds, 0=no timeout)"
    deps: [disk, cardinal]
    vars:
      TIMEOUT: '{{.TIMEOUT | default "5"}}'
      LOG_FILE: /tmp/cardinal-serial.log
    cmds:
      - task: stop
      - '{{.GO}} tool go-rm {{.LOG_FILE}}'
      - echo "Starting QEMU (timeout {{.TIMEOUT}}s)..."
      - task: run-qemu-background
      - '{{.GO}} tool go-sleep {{.TIMEOUT}}s'
      - task: stop
      - '{{.GO}} tool go-sleep 0.3'
      - 'echo ""'
      - 'echo "=== Serial Output (last 50 lines) ==="'
      - '{{.GO}} tool safe-serial-read'
      - 'echo ""'
      - 'echo "Log file: {{.LOG_FILE}}"'

  run-qemu-background:
    desc: Start QEMU in background (internal task)
    internal: true
    vars:
      LOG_FILE: /tmp/cardinal-serial.log
    cmds:
      - '{{.GO}} tool go-start {{.QEMU}} -M virt,virtualization=off -cpu cortex-a72 -m 8G -kernel {{.CARDINAL_ELF}} -nodefaults -device virtio-gpu-pci -object rng-random,id=rng0,filename=/dev/urandom -device virtio-rng-device,rng=rng0 -display none -serial file:{{.LOG_FILE}} -monitor tcp:127.0.0.1:4444,server,nowait -semihosting -no-reboot -drive file={{.DISK_IMAGE}},if=none,format=raw,readonly=on,id=disk0 -device virtio-blk-device,drive=disk0'
      - '{{.GO}} tool go-echo "QEMU started in background"'
      - '{{.GO}} tool go-echo "Monitor: tcp:127.0.0.1:4444"'
      - '{{.GO}} tool go-echo "Log file: {{.LOG_FILE}}"'

  qemu-console:
    desc: "Send command to QEMU monitor (CMD='info registers' or other QEMU command)"
    vars:
      CMD: '{{.CMD | default "info registers"}}'
    cmds:
      - '{{.GO}} tool go-nc -c "{{.CMD}}" 127.0.0.1 4444'

  show:
    desc: "Show serial output using safe-serial-read with pagination"
    cmds:
      - '{{.GO}} tool safe-serial-read -p'

  stop:
    desc: Stop all running QEMU instances
    cmds:
      # Send quit command to QEMU monitor if it's listening
      - cmd: '{{.GO}} tool go-nc -w 1s -c quit 127.0.0.1 4444'
        ignore_error: true
      - '{{.GO}} tool go-sleep 0.5'

  # ===========================================================================
  # Utility Tasks
  # ===========================================================================

  test:
    desc: Run Go tests
    deps: [check-env]
    cmds:
      - echo "Running tests..."
      - '{{.GO}} test -v ./cardinal/bitfield'

  clean:
    desc: Remove build artifacts
    cmds:
      - echo "Cleaning build artifacts..."
      - '{{.GO}} tool go-rm -r {{.BUILD_DIR}}'
      - '{{.GO}} tool go-rm {{.KMAZARIN_DATA_ASM}}'
      - '{{.GO}} tool go-rm {{.BOOT_IMAGE_DATA_ASM}}'
      - echo "Cleaned."

  # ===========================================================================
  # Default Target
  # ===========================================================================

  all:
    desc: Build cardinal and kmazarin (default)
    deps: [cardinal]

  default:
    deps: [all]
