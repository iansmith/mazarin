# Taskfile for mazzy - Go Native Toolchain Build (Shell-Free)
# Builds bare-metal ARM64 kernel (Cardinal + Kmazarin) and flock userspace programs
#
# Usage:
#   task              # Build cardinal and kmazarin (default)
#   task cardinal     # Build cardinal bootloader
#   task kmazarin     # Build kmazarin kernel
#   task priest       # Build priest syscall router
#   task disk         # Create FAT32 disk image
#   task clean        # Remove build artifacts
#
# Environment:
#   GO=/path/to/go                        # Go compiler (>= 1.24)
#   QEMU=/path/to/qemu-system-aarch64     # QEMU ARM64 (>= 10.2)
#   QEMU_AMD64=/path/to/qemu-system-x86_64  # QEMU x86_64 for diplomat
#   OVMF=/path/to/edk2-x86_64-code.fd     # OVMF firmware for diplomat
#   GOTOOLCHAIN=auto                      # Required
#   DEBUG=1                               # Optional: disable optimizations

version: '3'

vars:
  # Environment variables (shell-free using Go templates)
  GO: '{{env "GO" | default "go"}}'
  QEMU: '{{env "QEMU" | default "qemu-system-aarch64"}}'
  QEMU_AMD64: '{{env "QEMU_AMD64" | default "qemu-system-x86_64"}}'
  OVMF: '{{env "OVMF" | default ""}}'
  DEBUG: '{{env "DEBUG" | default ""}}'

  # Build configuration (prefixed to avoid conflicts with Go env vars)
  TARGET_GOARCH: arm64
  TARGET_GOOS: linux
  BUILD_DIR: build

  # QEMU display: cocoa on macOS, sdl everywhere else
  DISPLAY: '{{if eq OS "darwin"}}cocoa{{else}}sdl{{end}}'

  # Kmazarin load address - must match cardinal/constants.KmazarinLoadAddr
  # If the constant changes, check-env will fail with a clear error message.
  KMAZARIN_LOAD_ADDR: "0x43800000"

  # Debug build: disable optimizations and inlining
  # Usage: DEBUG=1 task cardinal
  GCFLAGS: '{{if eq .DEBUG "1"}}-gcflags=all=-N -l{{end}}'

  # Output files
  CARDINAL_ELF: '{{.BUILD_DIR}}/cardinal.elf'
  KMAZARIN_ELF: '{{.BUILD_DIR}}/kmazarin.elf'
  KMAZARIN_OVERLAY_JSON: '{{.BUILD_DIR}}/kmazarin-overlay.json'
  USERSPACE_OVERLAY_JSON: '{{.BUILD_DIR}}/userspace-overlay.json'
  THIN_OVERLAY_JSON: '{{.BUILD_DIR}}/thin-overlay.json'
  PRIESTSIEVE_ELF: '{{.BUILD_DIR}}/priestsieve.elf'
  PRIEST2_ELF: '{{.BUILD_DIR}}/priest2.elf'
  PRIEST3_ELF: '{{.BUILD_DIR}}/priest3.elf'
  SIEVETEST_ELF: '{{.BUILD_DIR}}/sievetest.elf'
  SIEVE3_ELF: '{{.BUILD_DIR}}/sieve3.elf'
  SIEVE5_ELF: '{{.BUILD_DIR}}/sieve5.elf'
  SIEVE6_ELF: '{{.BUILD_DIR}}/sieve6.elf'
  SIEVE7_ELF: '{{.BUILD_DIR}}/sieve7.elf'
  SIEVE8_ELF: '{{.BUILD_DIR}}/sieve8.elf'
  SIEVE9_ELF: '{{.BUILD_DIR}}/sieve9.elf'
  DAPOPE_ELF: '{{.BUILD_DIR}}/dapope.elf'
  STDIO_ELF: '{{.BUILD_DIR}}/stdio.elf'
  HELLOWORLD_ELF: '{{.BUILD_DIR}}/helloworld.elf'
  HELLOWORLD_THIN_ELF: '{{.BUILD_DIR}}/helloworld-thin.elf'
  HELLOWORLD_MAZ: '{{.BUILD_DIR}}/helloworld.maz'
  DISK_IMAGE: '{{.BUILD_DIR}}/disk.img'

  # Diplomat (x86_64 UEFI bootloader) output files
  DIPLOMAT_EXE: '{{.BUILD_DIR}}/diplomat.exe'
  DIPLOMAT_EFI: '{{.BUILD_DIR}}/diplomat.efi'
  ESP_IMAGE: '{{.BUILD_DIR}}/esp.img'

  # Diplomat ARM64 UEFI
  DIPLOMAT_ARM64_EFI: '{{.BUILD_DIR}}/diplomat-arm64.efi'
  ESP_ARM64_IMAGE: '{{.BUILD_DIR}}/esp-arm64.img'
  OVMF_ARM64: '{{env "OVMF_ARM64" | default ""}}'

  # Kmazarin AMD64 (for diplomat x86_64 boot)
  KMAZARIN_AMD64_ELF: '{{.BUILD_DIR}}/kmazarin-amd64.elf'
  KMAZARIN_AMD64_OVERLAY_JSON: '{{.BUILD_DIR}}/kmazarin-amd64-overlay.json'

  # Runtime patches directory
  RUNTIME_PATCHES_DIR: runtime-patches
  USERSPACE_OVERLAY_DIR: mazarin/overlay/userspace

tasks:
  # ===========================================================================
  # Environment and Version Checks
  # ===========================================================================

  check-env:
    run: once
    desc: Verify GO, QEMU, GOTOOLCHAIN, and tool versions
    cmds:
      # Check GOTOOLCHAIN
      - '{{.GO}} tool go-env -check GOTOOLCHAIN=auto -msg "GOTOOLCHAIN must be ''auto''. Run: export GOTOOLCHAIN=auto"'
      # Check Go version >= 1.24
      - '{{.GO}} tool check-version -go {{.GO}} -min 1.24'
      # Check QEMU version >= 10.2
      - '{{.GO}} tool check-version -qemu {{.QEMU}} -min 10.2'
      # Verify KMAZARIN_LOAD_ADDR matches the constant
      - '{{.GO}} tool print-kmazarin-addr -check {{.KMAZARIN_LOAD_ADDR}}'
      - '{{.GO}} tool go-echo "Environment check passed"'
    silent: true

  # ===========================================================================
  # Build Directory
  # ===========================================================================

  build-dir:
    run: once
    desc: Create build directory
    cmds:
      - '{{.GO}} tool go-mkdir {{.BUILD_DIR}}'
    status:
      - '{{.GO}} tool go-test -d {{.BUILD_DIR}}'

  # ===========================================================================
  # Overlay Generation
  # ===========================================================================

  kmazarin-overlay:
    run: once
    desc: Generate runtime overlay JSON for kmazarin
    deps: [build-dir]
    sources:
      - '{{.RUNTIME_PATCHES_DIR}}/cgo_mmap.go'
      - '{{.RUNTIME_PATCHES_DIR}}/malloc.go'
      - '{{.RUNTIME_PATCHES_DIR}}/mcache.go'
      - '{{.RUNTIME_PATCHES_DIR}}/os_linux_arm64.go'
      - '{{.RUNTIME_PATCHES_DIR}}/preempt.go'
      - '{{.RUNTIME_PATCHES_DIR}}/sys_linux_arm64.s'
      - '{{.RUNTIME_PATCHES_DIR}}/tagptr_64bit.go'
      - '{{.RUNTIME_PATCHES_DIR}}/traceback.go'
      - '{{.RUNTIME_PATCHES_DIR}}/panic.go'
      - '{{.RUNTIME_PATCHES_DIR}}/syscall/syscall_linux.go'
    generates:
      - '{{.KMAZARIN_OVERLAY_JSON}}'
    cmds:
      - '{{.GO}} tool gen-overlay -type kmazarin -patches {{.RUNTIME_PATCHES_DIR}} -o {{.KMAZARIN_OVERLAY_JSON}}'

  kmazarin-amd64-overlay:
    run: once
    desc: Generate runtime overlay JSON for kmazarin (x86_64)
    deps: [build-dir]
    sources:
      - '{{.RUNTIME_PATCHES_DIR}}/cgo_mmap.go'
      - '{{.RUNTIME_PATCHES_DIR}}/malloc.go'
      - '{{.RUNTIME_PATCHES_DIR}}/mcache.go'
      - '{{.RUNTIME_PATCHES_DIR}}/os_linux_noauxv.go'
      - '{{.RUNTIME_PATCHES_DIR}}/preempt.go'
      - '{{.RUNTIME_PATCHES_DIR}}/sys_linux_amd64.s'
      - '{{.RUNTIME_PATCHES_DIR}}/tagptr_64bit.go'
      - '{{.RUNTIME_PATCHES_DIR}}/syscall/syscall_linux.go'
    generates:
      - '{{.KMAZARIN_AMD64_OVERLAY_JSON}}'
    cmds:
      - '{{.GO}} tool gen-overlay -type kmazarin-amd64 -patches {{.RUNTIME_PATCHES_DIR}} -o {{.KMAZARIN_AMD64_OVERLAY_JSON}}'

  userspace-overlay:
    run: once
    desc: Generate runtime overlay JSON for userspace programs
    deps: [build-dir]
    sources:
      - '{{.USERSPACE_OVERLAY_DIR}}/syscall_linux.go'
      - '{{.USERSPACE_OVERLAY_DIR}}/asm_linux_arm64.s'
      - '{{.USERSPACE_OVERLAY_DIR}}/runtime/cgo_mmap.go'
      - '{{.USERSPACE_OVERLAY_DIR}}/runtime/lock_spinbit.go'
    generates:
      - '{{.USERSPACE_OVERLAY_JSON}}'
    cmds:
      - '{{.GO}} tool gen-overlay -type userspace -patches {{.USERSPACE_OVERLAY_DIR}} -o {{.USERSPACE_OVERLAY_JSON}}'

  thin-overlay:
    desc: Generate thin client overlay via AST stub generator
    deps: [build-dir]
    generates:
      - '{{.THIN_OVERLAY_JSON}}'
      - '{{.BUILD_DIR}}/thin-stubs.manifest'
    cmds:
      - '{{.GO}} tool gen-ast-stubs -go={{.GO}} -runtime-from-go -output={{.BUILD_DIR}}/thin-overlay/runtime -overlay={{.THIN_OVERLAY_JSON}} -manifest={{.BUILD_DIR}}/thin-stubs.manifest'
      - '{{.GO}} tool go-echo "Generated {{.THIN_OVERLAY_JSON}}"'

  # ===========================================================================
  # Boot Image Conversion
  # ===========================================================================

  convert-boot-image:
    run: once
    desc: Copy boot image binary for disk
    deps: [build-dir]
    sources:
      - assets/boot-mazarin.bin
    generates:
      - '{{.BUILD_DIR}}/boot-image.bin'
    cmds:
      - '{{.GO}} tool go-cat -o {{.BUILD_DIR}}/boot-image.bin assets/boot-mazarin.bin'

  # ===========================================================================
  # Kmazarin Kernel Build
  # ===========================================================================

  kmazarin:
    desc: Build kmazarin kernel
    run: once
    deps: [check-env, kmazarin-overlay]
    sources:
      - 'kmazarin/**/*.go'
      - 'kmazarin/**/*.s'
      - 'shared/**/*.go'
      - '{{.KMAZARIN_OVERLAY_JSON}}'
    generates:
      - '{{.KMAZARIN_ELF}}'
    cmds:
      - '{{.GO}} tool go-echo "Building kmazarin kernel (static Go binary at {{.KMAZARIN_LOAD_ADDR}})..."'
      - 'CGO_ENABLED=0 GOARCH={{.TARGET_GOARCH}} GOOS={{.TARGET_GOOS}} {{.GO}} build -overlay={{.ROOT_DIR}}/{{.KMAZARIN_OVERLAY_JSON}} {{.GCFLAGS}} -ldflags="-checklinkname=0 -T {{.KMAZARIN_LOAD_ADDR}}" -o {{.KMAZARIN_ELF}} ./kmazarin/kmazarin'
      - '{{.GO}} tool go-echo "Fixing kmazarin ELF for QEMU compatibility..."'
      - '{{.GO}} tool fix-go-elf {{.KMAZARIN_ELF}}'
      - '{{.GO}} tool go-echo "Relocating kmazarin to high memory (0xFFFFFFFF41800000)..."'
      - 'cp {{.KMAZARIN_ELF}} {{.KMAZARIN_ELF}}.prereloc'
      - '{{.GO}} tool relocate-kmazarin {{.KMAZARIN_ELF}} {{.KMAZARIN_ELF}}.tmp'
      - '{{.GO}} tool go-mv {{.KMAZARIN_ELF}}.tmp {{.KMAZARIN_ELF}}'
      - '{{.GO}} tool go-echo "Kmazarin kernel built at {{.KMAZARIN_ELF}}"'

  kmazarin-amd64:
    desc: Build kmazarin kernel for x86_64
    run: once
    deps: [check-env, kmazarin-amd64-overlay]
    sources:
      - 'kmazarin/**/*.go'
      - 'kmazarin/**/*.s'
      - 'shared/**/*.go'
      - '{{.KMAZARIN_AMD64_OVERLAY_JSON}}'
    generates:
      - '{{.KMAZARIN_AMD64_ELF}}'
    cmds:
      - '{{.GO}} tool go-echo "Building kmazarin kernel for x86_64 (static Go binary at {{.KMAZARIN_LOAD_ADDR}})..."'
      - 'CGO_ENABLED=0 GOARCH=amd64 GOOS=linux {{.GO}} build -overlay={{.ROOT_DIR}}/{{.KMAZARIN_AMD64_OVERLAY_JSON}} {{.GCFLAGS}} -ldflags="-checklinkname=0 -T {{.KMAZARIN_LOAD_ADDR}}" -o {{.KMAZARIN_AMD64_ELF}} ./kmazarin/kmazarin'
      - '{{.GO}} tool go-echo "Fixing kmazarin-amd64 ELF headers..."'
      - '{{.GO}} tool fix-go-elf {{.KMAZARIN_AMD64_ELF}}'
      - '{{.GO}} tool go-echo "Kmazarin AMD64 kernel built at {{.KMAZARIN_AMD64_ELF}} (NOTE: not relocated to high memory yet)"'

  # ===========================================================================
  # Cardinal Bootloader Build
  # ===========================================================================

  cardinal:
    run: once
    desc: Build cardinal bootloader
    deps: [check-env, kmazarin, cardinal-linux-overlay]
    sources:
      - 'cardinal/**/*.go'
      - 'cardinal/**/*.s'
      - '{{.KMAZARIN_ELF}}'
      - '{{.BUILD_DIR}}/cardinal-linux-overlay.json'
    generates:
      - '{{.CARDINAL_ELF}}'
    cmds:
      - '{{.GO}} tool go-echo "Building cardinal bootloader..."'
      - 'CGO_ENABLED=0 GOARCH={{.TARGET_GOARCH}} GOOS={{.TARGET_GOOS}} {{.GO}} build {{.GCFLAGS}} -ldflags="-checklinkname=0 -T 0x40100000" -overlay={{.BUILD_DIR}}/cardinal-linux-overlay.json -o {{.CARDINAL_ELF}} ./cardinal/main'
      - '{{.GO}} tool go-echo "Patching entry point to _cardinal_boot..."'
      - '{{.GO}} tool patch-entry {{.CARDINAL_ELF}} _cardinal_boot'
      - '{{.GO}} tool go-echo "Patching linker values..."'
      - '{{.GO}} tool compute-linker-values -patch -kmazarin {{.KMAZARIN_ELF}} {{.CARDINAL_ELF}}'
      - '{{.GO}} tool go-echo "Fixing ELF for QEMU compatibility..."'
      - '{{.GO}} tool fix-go-elf {{.CARDINAL_ELF}}'
      - '{{.GO}} tool go-echo "Cardinal ready at {{.CARDINAL_ELF}}"'

  # ===========================================================================
  # Flock Userspace Programs
  # ===========================================================================

  priestsieve:
    desc: Build priestsieve prime sieve test program
    deps: [check-env, userspace-overlay]
    sources:
      - 'flock/**/*.go'
      - 'flock/**/*.s'
      - 'mazarin/**/*.go'
      - '{{.USERSPACE_OVERLAY_JSON}}'
    generates:
      - '{{.PRIESTSIEVE_ELF}}'
    cmds:
      - '{{.GO}} tool go-echo "Building priestsieve (prime sieve test with overlay)..."'
      - 'CGO_ENABLED=0 GOARCH={{.TARGET_GOARCH}} GOOS={{.TARGET_GOOS}} {{.GO}} build -overlay={{.ROOT_DIR}}/{{.USERSPACE_OVERLAY_JSON}} {{.GCFLAGS}} -o {{.PRIESTSIEVE_ELF}} ./flock/cmd/priestsieve'
      - '{{.GO}} tool go-echo "Priestsieve built at {{.PRIESTSIEVE_ELF}}"'

  dapope:
    desc: Build dapope input event handler priest
    deps: [check-env, userspace-overlay]
    sources:
      - 'flock/**/*.go'
      - 'flock/**/*.s'
      - 'mazarin/**/*.go'
      - '{{.USERSPACE_OVERLAY_JSON}}'
    generates:
      - '{{.DAPOPE_ELF}}'
    cmds:
      - '{{.GO}} tool go-echo "Building dapope (input event handler with overlay)..."'
      - 'CGO_ENABLED=0 GOARCH={{.TARGET_GOARCH}} GOOS={{.TARGET_GOOS}} {{.GO}} build -overlay={{.ROOT_DIR}}/{{.USERSPACE_OVERLAY_JSON}} {{.GCFLAGS}} -o {{.DAPOPE_ELF}} ./flock/cmd/dapope'
      - '{{.GO}} tool go-echo "Dapope built at {{.DAPOPE_ELF}}"'

  stdio:
    desc: Build stdio console priest
    deps: [check-env, userspace-overlay]
    sources:
      - 'flock/**/*.go'
      - 'flock/**/*.s'
      - 'mazarin/**/*.go'
      - '{{.USERSPACE_OVERLAY_JSON}}'
    generates:
      - '{{.STDIO_ELF}}'
    cmds:
      - '{{.GO}} tool go-echo "Building stdio (console priest with overlay)..."'
      - 'CGO_ENABLED=0 GOARCH={{.TARGET_GOARCH}} GOOS={{.TARGET_GOOS}} {{.GO}} build -overlay={{.ROOT_DIR}}/{{.USERSPACE_OVERLAY_JSON}} {{.GCFLAGS}} -o {{.STDIO_ELF}} ./flock/cmd/stdio'
      - '{{.GO}} tool go-echo "Stdio built at {{.STDIO_ELF}}"'

  priest2:
    desc: Build priest2 scheduling test program
    deps: [check-env, userspace-overlay]
    sources:
      - 'flock/**/*.go'
      - 'flock/**/*.s'
      - 'mazarin/**/*.go'
      - '{{.USERSPACE_OVERLAY_JSON}}'
    generates:
      - '{{.PRIEST2_ELF}}'
    cmds:
      - '{{.GO}} tool go-echo "Building priest2 (scheduling test program)..."'
      - 'CGO_ENABLED=0 GOARCH={{.TARGET_GOARCH}} GOOS={{.TARGET_GOOS}} {{.GO}} build -overlay={{.ROOT_DIR}}/{{.USERSPACE_OVERLAY_JSON}} {{.GCFLAGS}} -o {{.PRIEST2_ELF}} ./flock/cmd/priest2'
      - '{{.GO}} tool go-echo "Priest2 built at {{.PRIEST2_ELF}}"'

  priest3:
    desc: Build priest3 scheduling test program (prints 4s, 6s, 7s)
    deps: [check-env, userspace-overlay]
    sources:
      - 'flock/**/*.go'
      - 'flock/**/*.s'
      - 'mazarin/**/*.go'
      - '{{.USERSPACE_OVERLAY_JSON}}'
    generates:
      - '{{.PRIEST3_ELF}}'
    cmds:
      - '{{.GO}} tool go-echo "Building priest3 (scheduling test program)..."'
      - 'CGO_ENABLED=0 GOARCH={{.TARGET_GOARCH}} GOOS={{.TARGET_GOOS}} {{.GO}} build -overlay={{.ROOT_DIR}}/{{.USERSPACE_OVERLAY_JSON}} {{.GCFLAGS}} -o {{.PRIEST3_ELF}} ./flock/cmd/priest3'
      - '{{.GO}} tool go-echo "Priest3 built at {{.PRIEST3_ELF}}"'

  sievetest:
    desc: Build sievetest (simple prime sieve for multi-priest testing)
    deps: [check-env, userspace-overlay]
    sources:
      - 'flock/cmd/sievetest/**/*.go'
      - 'mazarin/**/*.go'
      - '{{.USERSPACE_OVERLAY_JSON}}'
    generates:
      - '{{.SIEVETEST_ELF}}'
    cmds:
      - '{{.GO}} tool go-echo "Building sievetest..."'
      - 'CGO_ENABLED=0 GOARCH={{.TARGET_GOARCH}} GOOS={{.TARGET_GOOS}} {{.GO}} build -overlay={{.ROOT_DIR}}/{{.USERSPACE_OVERLAY_JSON}} {{.GCFLAGS}} -o {{.SIEVETEST_ELF}} ./flock/cmd/sievetest'
      - '{{.GO}} tool go-echo "Sievetest built at {{.SIEVETEST_ELF}}"'

  sieve3:
    desc: Build sieve3 (single-threaded prime sieve, worker 3)
    deps: [check-env, userspace-overlay]
    sources:
      - 'flock/cmd/sieve3/**/*.go'
      - 'mazarin/**/*.go'
      - '{{.USERSPACE_OVERLAY_JSON}}'
    generates:
      - '{{.SIEVE3_ELF}}'
    cmds:
      - '{{.GO}} tool go-echo "Building sieve3..."'
      - 'CGO_ENABLED=0 GOARCH={{.TARGET_GOARCH}} GOOS={{.TARGET_GOOS}} {{.GO}} build -overlay={{.ROOT_DIR}}/{{.USERSPACE_OVERLAY_JSON}} {{.GCFLAGS}} -o {{.SIEVE3_ELF}} ./flock/cmd/sieve3'
      - '{{.GO}} tool go-echo "Sieve3 built at {{.SIEVE3_ELF}}"'

  sieve5:
    desc: Build sieve5 (single-threaded prime sieve, worker 5)
    deps: [check-env, userspace-overlay]
    sources:
      - 'flock/cmd/sieve5/**/*.go'
      - 'mazarin/**/*.go'
      - '{{.USERSPACE_OVERLAY_JSON}}'
    generates:
      - '{{.SIEVE5_ELF}}'
    cmds:
      - '{{.GO}} tool go-echo "Building sieve5..."'
      - 'CGO_ENABLED=0 GOARCH={{.TARGET_GOARCH}} GOOS={{.TARGET_GOOS}} {{.GO}} build -overlay={{.ROOT_DIR}}/{{.USERSPACE_OVERLAY_JSON}} {{.GCFLAGS}} -o {{.SIEVE5_ELF}} ./flock/cmd/sieve5'
      - '{{.GO}} tool go-echo "Sieve5 built at {{.SIEVE5_ELF}}"'

  sieve6:
    desc: Build sieve6 (single-threaded prime sieve, worker 6)
    deps: [check-env, userspace-overlay]
    sources:
      - 'flock/cmd/sieve6/**/*.go'
      - 'mazarin/**/*.go'
      - '{{.USERSPACE_OVERLAY_JSON}}'
    generates:
      - '{{.SIEVE6_ELF}}'
    cmds:
      - '{{.GO}} tool go-echo "Building sieve6..."'
      - 'CGO_ENABLED=0 GOARCH={{.TARGET_GOARCH}} GOOS={{.TARGET_GOOS}} {{.GO}} build -overlay={{.ROOT_DIR}}/{{.USERSPACE_OVERLAY_JSON}} {{.GCFLAGS}} -o {{.SIEVE6_ELF}} ./flock/cmd/sieve6'
      - '{{.GO}} tool go-echo "Sieve6 built at {{.SIEVE6_ELF}}"'

  sieve7:
    desc: Build sieve7 (single-threaded prime sieve, worker 7)
    deps: [check-env, userspace-overlay]
    sources:
      - 'flock/cmd/sieve7/**/*.go'
      - 'mazarin/**/*.go'
      - '{{.USERSPACE_OVERLAY_JSON}}'
    generates:
      - '{{.SIEVE7_ELF}}'
    cmds:
      - '{{.GO}} tool go-echo "Building sieve7..."'
      - 'CGO_ENABLED=0 GOARCH={{.TARGET_GOARCH}} GOOS={{.TARGET_GOOS}} {{.GO}} build -overlay={{.ROOT_DIR}}/{{.USERSPACE_OVERLAY_JSON}} {{.GCFLAGS}} -o {{.SIEVE7_ELF}} ./flock/cmd/sieve7'
      - '{{.GO}} tool go-echo "Sieve7 built at {{.SIEVE7_ELF}}"'

  sieve8:
    desc: Build sieve8 (single-threaded prime sieve, worker 8)
    deps: [check-env, userspace-overlay]
    sources:
      - 'flock/cmd/sieve8/**/*.go'
      - 'mazarin/**/*.go'
      - '{{.USERSPACE_OVERLAY_JSON}}'
    generates:
      - '{{.SIEVE8_ELF}}'
    cmds:
      - '{{.GO}} tool go-echo "Building sieve8..."'
      - 'CGO_ENABLED=0 GOARCH={{.TARGET_GOARCH}} GOOS={{.TARGET_GOOS}} {{.GO}} build -overlay={{.ROOT_DIR}}/{{.USERSPACE_OVERLAY_JSON}} {{.GCFLAGS}} -o {{.SIEVE8_ELF}} ./flock/cmd/sieve8'
      - '{{.GO}} tool go-echo "Sieve8 built at {{.SIEVE8_ELF}}"'

  sieve9:
    desc: Build sieve9 (single-threaded prime sieve, worker 9)
    deps: [check-env, userspace-overlay]
    sources:
      - 'flock/cmd/sieve9/**/*.go'
      - 'mazarin/**/*.go'
      - '{{.USERSPACE_OVERLAY_JSON}}'
    generates:
      - '{{.SIEVE9_ELF}}'
    cmds:
      - '{{.GO}} tool go-echo "Building sieve9..."'
      - 'CGO_ENABLED=0 GOARCH={{.TARGET_GOARCH}} GOOS={{.TARGET_GOOS}} {{.GO}} build -overlay={{.ROOT_DIR}}/{{.USERSPACE_OVERLAY_JSON}} {{.GCFLAGS}} -o {{.SIEVE9_ELF}} ./flock/cmd/sieve9'
      - '{{.GO}} tool go-echo "Sieve9 built at {{.SIEVE9_ELF}}"'

  helloworld:
    desc: Build helloworld test program
    deps: [check-env, userspace-overlay]
    sources:
      - 'flock/**/*.go'
      - 'flock/**/*.s'
      - 'mazarin/**/*.go'
      - '{{.USERSPACE_OVERLAY_JSON}}'
    generates:
      - '{{.HELLOWORLD_ELF}}'
    cmds:
      - '{{.GO}} tool go-echo "Building helloworld (userspace program)..."'
      - 'CGO_ENABLED=0 GOARCH={{.TARGET_GOARCH}} GOOS={{.TARGET_GOOS}} {{.GO}} build -overlay={{.ROOT_DIR}}/{{.USERSPACE_OVERLAY_JSON}} {{.GCFLAGS}} -o {{.HELLOWORLD_ELF}} ./flock/cmd/helloworld'
      - '{{.GO}} tool go-echo "Helloworld built at {{.HELLOWORLD_ELF}}"'

  helloworld-thin:
    desc: Build helloworld with thin client overlay (minimal runtime)
    deps: [check-env, thin-overlay]
    sources:
      - 'flock/**/*.go'
      - 'flock/**/*.s'
      - '{{.THIN_OVERLAY_JSON}}'
    generates:
      - '{{.HELLOWORLD_THIN_ELF}}'
    cmds:
      - '{{.GO}} tool go-echo "Building helloworld-thin (minimal runtime stubs)..."'
      - 'CGO_ENABLED=0 GOARCH={{.TARGET_GOARCH}} GOOS={{.TARGET_GOOS}} {{.GO}} build -overlay={{.ROOT_DIR}}/{{.THIN_OVERLAY_JSON}} {{.GCFLAGS}} -o {{.HELLOWORLD_THIN_ELF}} ./flock/cmd/helloworld'
      - '{{.GO}} tool go-echo "Helloworld-thin built at {{.HELLOWORLD_THIN_ELF}}"'

  helloworld-maz:
    desc: Build helloworld.maz (direct SVC, no overlay)
    deps: [check-env, build-dir]
    sources:
      - 'flock/**/*.go'
      - 'flock/**/*.s'
    generates:
      - '{{.HELLOWORLD_MAZ}}'
    cmds:
      - '{{.GO}} tool go-echo "Building helloworld.maz (direct SVC, no overlay)..."'
      - 'CGO_ENABLED=0 GOARCH={{.TARGET_GOARCH}} GOOS={{.TARGET_GOOS}} {{.GO}} build {{.GCFLAGS}} -o {{.HELLOWORLD_MAZ}} ./flock/cmd/helloworld'
      - '{{.GO}} tool go-echo "Helloworld.maz built at {{.HELLOWORLD_MAZ}}"'

  # ===========================================================================
  # Disk Image
  # ===========================================================================

  disk:
    desc: Create FAT32 disk image with flock binaries and kmazarin kernel
    deps: [priestsieve, dapope, stdio, priest2, priest3, sievetest, sieve3, sieve5, sieve6, sieve7, sieve8, sieve9, helloworld-maz, kmazarin, convert-boot-image]
    sources:
      - '{{.PRIESTSIEVE_ELF}}'
      - '{{.DAPOPE_ELF}}'
      - '{{.STDIO_ELF}}'
      - '{{.PRIEST2_ELF}}'
      - '{{.PRIEST3_ELF}}'
      - '{{.SIEVETEST_ELF}}'
      - '{{.SIEVE3_ELF}}'
      - '{{.SIEVE5_ELF}}'
      - '{{.SIEVE6_ELF}}'
      - '{{.SIEVE7_ELF}}'
      - '{{.SIEVE8_ELF}}'
      - '{{.SIEVE9_ELF}}'
      - '{{.HELLOWORLD_MAZ}}'
      - '{{.KMAZARIN_ELF}}'
      - '{{.BUILD_DIR}}/boot-image.bin'
    generates:
      - '{{.DISK_IMAGE}}'
    cmds:
      - '{{.GO}} tool go-echo "Creating FAT32 disk image..."'
      - '{{.GO}} tool mkfat32 -o {{.DISK_IMAGE}} {{.PRIESTSIEVE_ELF}} {{.DAPOPE_ELF}} {{.STDIO_ELF}} {{.PRIEST2_ELF}} {{.PRIEST3_ELF}} {{.SIEVETEST_ELF}} {{.SIEVE3_ELF}} {{.SIEVE5_ELF}} {{.SIEVE6_ELF}} {{.SIEVE7_ELF}} {{.SIEVE8_ELF}} {{.SIEVE9_ELF}} {{.HELLOWORLD_MAZ}} {{.KMAZARIN_ELF}} {{.BUILD_DIR}}/boot-image.bin'
      - '{{.GO}} tool go-echo "Disk image created at {{.DISK_IMAGE}}"'

  # ===========================================================================
  # Diplomat - x86_64 UEFI Bootloader
  # ===========================================================================

  gen-overlay:
    run: once
    desc: Build the overlay JSON generator tool
    deps: [build-dir]
    sources:
      - 'cmd/gen-overlay/*.go'
    generates:
      - '{{.BUILD_DIR}}/gen-overlay'
    cmds:
      - '{{.GO}} build -o {{.BUILD_DIR}}/gen-overlay ./cmd/gen-overlay'

  elf2pe:
    desc: Build the ELF to PE converter
    deps: [build-dir]
    sources:
      - 'cmd/elf2pe/*.go'
    generates:
      - '{{.BUILD_DIR}}/elf2pe'
    cmds:
      - '{{.GO}} build -o {{.BUILD_DIR}}/elf2pe ./cmd/elf2pe'

  cardinal-linux-overlay:
    run: once
    desc: Generate overlay JSON for cardinal runtime patches (Linux ARM64→bare metal)
    deps: [gen-overlay]
    sources:
      - 'runtime-patches/cardinal-linux/**/*'
    generates:
      - '{{.BUILD_DIR}}/cardinal-linux-overlay.json'
    cmds:
      - '{{.BUILD_DIR}}/gen-overlay -type cardinal-linux -patches runtime-patches/cardinal-linux -o {{.BUILD_DIR}}/cardinal-linux-overlay.json'

  diplomat-linux-overlay:
    desc: Generate overlay JSON for diplomat runtime patches (Linux→UEFI)
    deps: [gen-overlay]
    sources:
      - 'runtime-patches/diplomat-linux/**/*'
    generates:
      - '{{.BUILD_DIR}}/diplomat-linux-overlay.json'
    cmds:
      - '{{.BUILD_DIR}}/gen-overlay -type diplomat-linux -patches runtime-patches/diplomat-linux -o {{.BUILD_DIR}}/diplomat-linux-overlay.json'

  diplomat:
    desc: Build diplomat UEFI bootloader for x86_64
    deps: [check-env, build-dir, elf2pe, diplomat-linux-overlay]
    sources:
      - 'diplomat/**/*.go'
      - 'diplomat/**/*.s'
      - 'shared/**/*.go'
      - '{{.BUILD_DIR}}/diplomat-linux-overlay.json'
    generates:
      - '{{.DIPLOMAT_EFI}}'
    cmds:
      - '{{.GO}} tool go-echo "Building diplomat for x86_64 UEFI (via Linux/amd64)..."'
      # Step 1: Build as Linux ELF with runtime patches
      - 'CGO_ENABLED=0 GOOS=linux GOARCH=amd64 {{.GO}} build -ldflags="-checklinkname=0" -overlay={{.BUILD_DIR}}/diplomat-linux-overlay.json -o {{.BUILD_DIR}}/diplomat.elf ./diplomat/main'
      # Step 2: Convert ELF to PE format for UEFI
      - '{{.BUILD_DIR}}/elf2pe {{.BUILD_DIR}}/diplomat.elf {{.DIPLOMAT_EFI}}'
      - '{{.GO}} tool go-echo "Diplomat EFI ready at {{.DIPLOMAT_EFI}}"'

  diplomat-arm64:
    desc: Build diplomat UEFI bootloader for ARM64
    deps: [check-env, build-dir, elf2pe, diplomat-linux-overlay]
    sources:
      - 'diplomat/**/*.go'
      - 'diplomat/**/*.s'
      - 'shared/**/*.go'
      - '{{.BUILD_DIR}}/diplomat-linux-overlay.json'
    generates:
      - '{{.BUILD_DIR}}/diplomat-arm64.efi'
    cmds:
      - '{{.GO}} tool go-echo "Building diplomat for ARM64 UEFI (via Linux/arm64)..."'
      # Step 1: Build as Linux ELF with runtime patches
      - 'CGO_ENABLED=0 GOOS=linux GOARCH=arm64 {{.GO}} build -ldflags="-checklinkname=0" -overlay={{.BUILD_DIR}}/diplomat-linux-overlay.json -o {{.BUILD_DIR}}/diplomat-arm64.elf ./diplomat/main'
      # Step 2: Convert ELF to PE format for UEFI
      - '{{.BUILD_DIR}}/elf2pe {{.BUILD_DIR}}/diplomat-arm64.elf {{.BUILD_DIR}}/diplomat-arm64.efi'
      - '{{.GO}} tool go-echo "Diplomat ARM64 EFI ready at {{.BUILD_DIR}}/diplomat-arm64.efi"'

  mkesp:
    desc: Build the ESP image creator
    deps: [build-dir]
    sources:
      - 'cmd/mkesp/*.go'
    generates:
      - '{{.BUILD_DIR}}/mkesp'
    cmds:
      - '{{.GO}} build -o {{.BUILD_DIR}}/mkesp ./cmd/mkesp'

  mktestkernel:
    desc: Build the test kernel generator tool
    deps: [build-dir]
    sources:
      - 'cmd/mktestkernel/**/*.go'
    generates:
      - '{{.BUILD_DIR}}/mktestkernel'
    cmds:
      - '{{.GO}} build -o {{.BUILD_DIR}}/mktestkernel ./cmd/mktestkernel'

  testkernel:
    desc: Build minimal test kernel for diplomat ELF loader testing
    deps: [build-dir, mktestkernel]
    cmds:
      - '{{.BUILD_DIR}}/mktestkernel -o {{.BUILD_DIR}}/testkernel.elf -addr 0xFFFFFFFF00200000 -m "hello, mazarin\r\n"'

  esp:
    desc: Create EFI System Partition image for diplomat testing
    deps: [diplomat, mkesp, testkernel]
    sources:
      - '{{.DIPLOMAT_EFI}}'
      - '{{.BUILD_DIR}}/testkernel.elf'
    generates:
      - '{{.ESP_IMAGE}}'
    cmds:
      - '{{.GO}} tool go-echo "Creating ESP image..."'
      - '{{.BUILD_DIR}}/mkesp -bootloader {{.DIPLOMAT_EFI}} -kernel {{.BUILD_DIR}}/testkernel.elf -o {{.ESP_IMAGE}} -size 260'
      - '{{.GO}} tool go-echo "ESP created at {{.ESP_IMAGE}}"'

  esp-kmazarin:
    desc: Create EFI System Partition image for x86_64 diplomat with real kmazarin
    deps: [diplomat, mkesp, kmazarin-amd64]
    sources:
      - '{{.DIPLOMAT_EFI}}'
      - '{{.KMAZARIN_AMD64_ELF}}'
      - kmazarin.toml
    generates:
      - '{{.BUILD_DIR}}/esp-kmazarin.img'
    cmds:
      - '{{.GO}} tool go-echo "Creating x86_64 ESP image with kmazarin..."'
      - '{{.BUILD_DIR}}/mkesp -bootloader {{.DIPLOMAT_EFI}} -kernel {{.KMAZARIN_AMD64_ELF}} -config kmazarin.toml -o {{.BUILD_DIR}}/esp-kmazarin.img -size 260'
      - '{{.GO}} tool go-echo "ESP (x86_64 + kmazarin) created at {{.BUILD_DIR}}/esp-kmazarin.img"'

  run-diplomat-kmazarin:
    desc: "Run x86_64 diplomat with real kmazarin in QEMU (TIMEOUT=N for timeout, default=5s)"
    deps: [esp-kmazarin]
    vars:
      TIMEOUT: '{{.TIMEOUT | default "5"}}'
      LOG_FILE: /tmp/diplomat-serial.log
    cmds:
      - task: stop-diplomat
      - '{{.GO}} tool go-rm {{.LOG_FILE}}'
      - '{{.GO}} tool go-echo "Starting diplomat x86_64 + kmazarin in QEMU (timeout {{.TIMEOUT}}s)..."'
      - task: run-diplomat-kmazarin-background
      - '{{.GO}} tool go-sleep {{.TIMEOUT}}s'
      - task: stop-diplomat
      - '{{.GO}} tool go-sleep 0.3'
      - '{{.GO}} tool go-echo'
      - '{{.GO}} tool go-echo "=== Diplomat x86_64 + Kmazarin Serial Output ==="'
      - '{{.GO}} tool safe-serial-read {{.LOG_FILE}}'
      - '{{.GO}} tool go-echo'
      - '{{.GO}} tool go-echo "Log file: {{.LOG_FILE}}"'

  run-diplomat-kmazarin-background:
    desc: Start QEMU with diplomat + kmazarin in background (internal task)
    internal: true
    vars:
      LOG_FILE: /tmp/diplomat-serial.log
      FW_CODE: '{{if ne .OVMF ""}}{{.OVMF}}{{else}}{{dir .QEMU_AMD64}}/../share/qemu/edk2-x86_64-code.fd{{end}}'
    cmds:
      - '{{.GO}} tool go-start {{.QEMU_AMD64}} -machine q35,accel=tcg -cpu max -m 8G -drive if=pflash,format=raw,readonly=on,file={{.FW_CODE}} -drive file={{.BUILD_DIR}}/esp-kmazarin.img,format=raw,if=ide -boot c -serial file:{{.LOG_FILE}} -debugcon file:/tmp/diplomat-debug.log -monitor tcp:127.0.0.1:4445,server,nowait -device virtio-vga -display cocoa'
      - '{{.GO}} tool go-echo "QEMU (x86_64 + kmazarin) started in background"'
      - '{{.GO}} tool go-echo "Monitor: tcp:127.0.0.1:4445"'
      - '{{.GO}} tool go-echo "Log file: {{.LOG_FILE}}"'

  run-diplomat:
    desc: "Run diplomat in QEMU with OVMF (TIMEOUT=N for timeout, default=5s)"
    deps: [esp]
    vars:
      TIMEOUT: '{{.TIMEOUT | default "5"}}'
      LOG_FILE: /tmp/diplomat-serial.log
    cmds:
      - task: stop-diplomat
      - '{{.GO}} tool go-rm {{.LOG_FILE}}'
      - '{{.GO}} tool go-echo "Starting diplomat in QEMU (timeout {{.TIMEOUT}}s)..."'
      - task: run-diplomat-background
      - '{{.GO}} tool go-sleep {{.TIMEOUT}}s'
      - task: stop-diplomat
      - '{{.GO}} tool go-sleep 0.3'
      - '{{.GO}} tool go-echo'
      - '{{.GO}} tool go-echo "=== Diplomat Serial Output ==="'
      - '{{.GO}} tool safe-serial-read {{.LOG_FILE}}'
      - '{{.GO}} tool go-echo'
      - '{{.GO}} tool go-echo "Log file: {{.LOG_FILE}}"'

  run-diplomat-background:
    desc: Start QEMU with diplomat in background (internal task)
    internal: true
    vars:
      LOG_FILE: /tmp/diplomat-serial.log
      FW_CODE: '{{if ne .OVMF ""}}{{.OVMF}}{{else}}{{dir .QEMU_AMD64}}/../share/qemu/edk2-x86_64-code.fd{{end}}'
    cmds:
      - '{{.GO}} tool go-start {{.QEMU_AMD64}} -machine q35,accel=tcg -cpu max -m 8G -drive if=pflash,format=raw,readonly=on,file={{.FW_CODE}} -drive file={{.ESP_IMAGE}},format=raw,if=ide -boot c -serial file:{{.LOG_FILE}} -debugcon file:/tmp/diplomat-debug.log -monitor tcp:127.0.0.1:4445,server,nowait -display none -no-reboot'
      - '{{.GO}} tool go-echo "QEMU (x86_64) started in background"'
      - '{{.GO}} tool go-echo "Monitor: tcp:127.0.0.1:4445"'
      - '{{.GO}} tool go-echo "Log file: {{.LOG_FILE}}"'

  stop-diplomat:
    desc: Stop diplomat QEMU instance
    cmds:
      - cmd: '{{.GO}} tool go-nc -w 1s -c quit 127.0.0.1 4445'
        ignore_error: true
      - '{{.GO}} tool go-sleep 0.5'

  esp-arm64:
    desc: Create EFI System Partition image for ARM64 diplomat
    deps: [diplomat-arm64, mkesp, kmazarin]
    sources:
      - '{{.DIPLOMAT_ARM64_EFI}}'
      - '{{.KMAZARIN_ELF}}'
      - kmazarin.toml
    generates:
      - '{{.ESP_ARM64_IMAGE}}'
    cmds:
      - '{{.GO}} tool go-echo "Creating ARM64 ESP image..."'
      - '{{.BUILD_DIR}}/mkesp -arch aa64 -bootloader {{.DIPLOMAT_ARM64_EFI}} -kernel {{.KMAZARIN_ELF}} -config kmazarin.toml -o {{.ESP_ARM64_IMAGE}} -size 260'
      - '{{.GO}} tool go-echo "ESP (ARM64) created at {{.ESP_ARM64_IMAGE}}"'

  run-diplomat-arm64:
    desc: "Run diplomat ARM64 in QEMU with UEFI firmware (TIMEOUT=N for timeout, default=5s)"
    deps: [esp-arm64, disk]
    vars:
      TIMEOUT: '{{.TIMEOUT | default "5"}}'
      LOG_FILE: /tmp/diplomat-arm64-serial.log
    cmds:
      - task: stop-diplomat-arm64
      - '{{.GO}} tool go-rm {{.LOG_FILE}}'
      - '{{.GO}} tool go-echo "Starting diplomat ARM64 in QEMU (timeout {{.TIMEOUT}}s)..."'
      - task: run-diplomat-arm64-background
      - '{{.GO}} tool go-sleep {{.TIMEOUT}}s'
      - task: stop-diplomat-arm64
      - '{{.GO}} tool go-sleep 0.3'
      - '{{.GO}} tool go-echo'
      - '{{.GO}} tool go-echo "=== Diplomat ARM64 Serial Output ==="'
      - '{{.GO}} tool safe-serial-read {{.LOG_FILE}}'
      - '{{.GO}} tool go-echo'
      - '{{.GO}} tool go-echo "Log file: {{.LOG_FILE}}"'

  run-diplomat-arm64-background:
    desc: Start QEMU with ARM64 diplomat in background (internal task)
    internal: true
    vars:
      LOG_FILE: /tmp/diplomat-arm64-serial.log
      FW_CODE: '{{if ne .OVMF_ARM64 ""}}{{.OVMF_ARM64}}{{else}}{{dir .QEMU}}/../share/qemu/edk2-aarch64-code.fd{{end}}'
      FW_VARS_TEMPLATE: '{{if ne .OVMF_ARM64 ""}}{{dir .OVMF_ARM64}}/edk2-arm-vars.fd{{else}}{{dir .QEMU}}/../share/qemu/edk2-arm-vars.fd{{end}}'
    cmds:
      - '{{.GO}} tool go-cp {{.FW_VARS_TEMPLATE}} {{.BUILD_DIR}}/edk2-arm-vars.fd'
      - '{{.GO}} tool go-start {{.QEMU}} -M virt -cpu cortex-a72 -m 2G -drive if=pflash,format=raw,readonly=on,file={{.FW_CODE}} -drive if=pflash,format=raw,file={{.BUILD_DIR}}/edk2-arm-vars.fd -drive file={{.ESP_ARM64_IMAGE}},format=raw,if=virtio -drive if=none,format=raw,readonly=on,file={{.DISK_IMAGE}},id=flock0 -device virtio-blk-device,drive=flock0 -device virtio-gpu-pci -device virtio-keyboard-pci -device virtio-mouse-pci -serial file:{{.LOG_FILE}} -monitor tcp:127.0.0.1:4446,server,nowait -display {{.DISPLAY}} -no-reboot'
      - '{{.GO}} tool go-echo "QEMU (ARM64 UEFI) started in background"'
      - '{{.GO}} tool go-echo "Monitor: tcp:127.0.0.1:4446"'
      - '{{.GO}} tool go-echo "Log file: {{.LOG_FILE}}"'

  stop-diplomat-arm64:
    desc: Stop ARM64 diplomat QEMU instance
    cmds:
      - cmd: '{{.GO}} tool go-nc -w 1s -c quit 127.0.0.1 4446'
        ignore_error: true
      - '{{.GO}} tool go-sleep 0.5'

  # ===========================================================================
  # Run and Stop
  # ===========================================================================

  run:
    desc: "Run QEMU with cardinal/kmazarin (TIMEOUT=N for timeout, SMP=N for CPU count)"
    deps: [disk, cardinal]
    vars:
      TIMEOUT: '{{.TIMEOUT | default "5"}}'
      SMP: '{{.SMP | default "4"}}'
      LOG_FILE: /tmp/cardinal-serial.log
    cmds:
      - task: stop
      - '{{.GO}} tool go-rm {{.LOG_FILE}}'
      - task: run-qemu-background
        vars:
          SMP: '{{.SMP}}'
          LOG_FILE: '{{.LOG_FILE}}'
      - task: '{{if eq .TIMEOUT "0"}}run-indefinite{{else}}run-timed{{end}}'
        vars:
          TIMEOUT: '{{.TIMEOUT}}'
          LOG_FILE: '{{.LOG_FILE}}'

  run-timed:
    desc: "Run QEMU with a timeout (internal)"
    internal: true
    cmds:
      - '{{.GO}} tool go-echo "Starting QEMU (timeout {{.TIMEOUT}}s)..."'
      - '{{.GO}} tool go-sleep {{.TIMEOUT}}s'
      - task: stop
      - '{{.GO}} tool go-sleep 0.3'
      - '{{.GO}} tool go-echo'
      - '{{.GO}} tool go-echo "=== Serial Output (last 50 lines) ==="'
      - '{{.GO}} tool safe-serial-read'
      - '{{.GO}} tool go-echo'
      - '{{.GO}} tool go-echo "Log file: {{.LOG_FILE}}"'

  run-indefinite:
    desc: "Run QEMU indefinitely (internal)"
    internal: true
    cmds:
      - '{{.GO}} tool go-echo "QEMU running indefinitely. Use $GO tool task stop to stop."'
      - '{{.GO}} tool go-echo "Log file: {{.LOG_FILE}}"'

  run-qemu-background:
    desc: Start QEMU in background (internal task)
    internal: true
    vars:
      LOG_FILE: /tmp/cardinal-serial.log
      SMP: '{{.SMP | default "4"}}'
    cmds:
      - '{{.GO}} tool go-start {{.QEMU}} -M virt,virtualization=off -cpu cortex-a72 -smp {{.SMP}} -m 8G -kernel {{.CARDINAL_ELF}} -nodefaults -device virtio-gpu-pci -device virtio-keyboard-pci -device virtio-mouse-pci -object rng-random,id=rng0,filename=/dev/urandom -device virtio-rng-device,rng=rng0 -display {{.DISPLAY}} -serial file:{{.LOG_FILE}} -monitor tcp:127.0.0.1:4444,server,nowait -semihosting -drive file={{.DISK_IMAGE}},if=none,format=raw,readonly=on,id=disk0 -device virtio-blk-device,drive=disk0'
      - '{{.GO}} tool go-echo "QEMU started in background ({{.SMP}} CPUs)"'
      - '{{.GO}} tool go-echo "Monitor: tcp:127.0.0.1:4444"'
      - '{{.GO}} tool go-echo "Log file: {{.LOG_FILE}}"'

  qemu-console:
    desc: "Send command to QEMU monitor (CMD='info registers' or other QEMU command)"
    vars:
      CMD: '{{.CMD | default "info registers"}}'
    cmds:
      - '{{.GO}} tool go-nc -c "{{.CMD}}" 127.0.0.1 4444'

  show:
    desc: "Show serial output using safe-serial-read with pagination"
    cmds:
      - '{{.GO}} tool safe-serial-read -p'

  stop:
    desc: Stop all running QEMU instances
    cmds:
      # Send quit command to QEMU monitor if it's listening
      - cmd: '{{.GO}} tool go-nc -w 1s -c quit 127.0.0.1 4444'
        ignore_error: true
      - '{{.GO}} tool go-sleep 0.5'

  # ===========================================================================
  # Debug Run Tasks
  # ===========================================================================

  run-debug:
    desc: "Run QEMU with instruction/CPU tracing (DEBUG_OPTS for extra -d flags, SMP=N for CPUs)"
    deps: [disk, cardinal]
    vars:
      TIMEOUT: '{{.TIMEOUT | default "5"}}'
      SMP: '{{.SMP | default "4"}}'
      LOG_FILE: /tmp/cardinal-serial.log
      DEBUG_LOG: /tmp/qemu-debug.log
      DEBUG_OPTS: '{{.DEBUG_OPTS | default "exec,cpu,int,nochain"}}'
    cmds:
      - task: stop
      - '{{.GO}} tool go-rm {{.LOG_FILE}}'
      - '{{.GO}} tool go-rm {{.DEBUG_LOG}}'
      - '{{.GO}} tool go-echo "Starting QEMU with debug tracing ({{.SMP}} CPUs)..."'
      - '{{.GO}} tool go-echo "Debug options: {{.DEBUG_OPTS}}"'
      - '{{.GO}} tool go-echo "Debug log: {{.DEBUG_LOG}}"'
      - '{{.GO}} tool go-start {{.QEMU}} -M virt,virtualization=off -cpu cortex-a72 -smp {{.SMP}} -m 8G -kernel {{.CARDINAL_ELF}} -nodefaults -device virtio-gpu-pci -device virtio-keyboard-pci -device virtio-mouse-pci -object rng-random,id=rng0,filename=/dev/urandom -device virtio-rng-device,rng=rng0 -display {{.DISPLAY}} -serial file:{{.LOG_FILE}} -monitor tcp:127.0.0.1:4444,server,nowait -semihosting -drive file={{.DISK_IMAGE}},if=none,format=raw,readonly=on,id=disk0 -device virtio-blk-device,drive=disk0 -d {{.DEBUG_OPTS}} -D {{.DEBUG_LOG}}'
      - '{{.GO}} tool go-sleep {{.TIMEOUT}}s'
      - task: stop
      - '{{.GO}} tool go-sleep 0.3'
      - '{{.GO}} tool go-echo'
      - '{{.GO}} tool go-echo "=== Serial Output (last 50 lines) ==="'
      - '{{.GO}} tool safe-serial-read'
      - '{{.GO}} tool go-echo'
      - '{{.GO}} tool go-echo "Serial log: {{.LOG_FILE}}"'
      - '{{.GO}} tool go-echo "Debug log:  {{.DEBUG_LOG}}"'
      - '{{.GO}} tool go-echo'
      - '{{.GO}} tool go-echo "View debug log tail: task show-debug"'

  run-debug-int:
    desc: "Run QEMU with interrupt/exception tracing only (lightweight, SMP=N for CPUs)"
    deps: [disk, cardinal]
    vars:
      TIMEOUT: '{{.TIMEOUT | default "10"}}'
      SMP: '{{.SMP | default "4"}}'
      LOG_FILE: /tmp/cardinal-serial.log
      DEBUG_LOG: /tmp/qemu-debug.log
      DEBUG_OPTS: 'int,guest_errors'
    cmds:
      - task: stop
      - '{{.GO}} tool go-rm {{.LOG_FILE}}'
      - '{{.GO}} tool go-rm {{.DEBUG_LOG}}'
      - '{{.GO}} tool go-echo "Starting QEMU with interrupt/exception tracing ({{.SMP}} CPUs)..."'
      - '{{.GO}} tool go-echo "Debug options: {{.DEBUG_OPTS}}"'
      - '{{.GO}} tool go-start {{.QEMU}} -M virt,virtualization=off -cpu cortex-a72 -smp {{.SMP}} -m 8G -kernel {{.CARDINAL_ELF}} -nodefaults -device virtio-gpu-pci -device virtio-keyboard-pci -device virtio-mouse-pci -object rng-random,id=rng0,filename=/dev/urandom -device virtio-rng-device,rng=rng0 -display {{.DISPLAY}} -serial file:{{.LOG_FILE}} -monitor tcp:127.0.0.1:4444,server,nowait -semihosting -drive file={{.DISK_IMAGE}},if=none,format=raw,readonly=on,id=disk0 -device virtio-blk-device,drive=disk0 -d {{.DEBUG_OPTS}} -D {{.DEBUG_LOG}}'
      - '{{.GO}} tool go-sleep {{.TIMEOUT}}s'
      - task: stop
      - '{{.GO}} tool go-sleep 0.3'
      - '{{.GO}} tool safe-serial-read'
      - '{{.GO}} tool go-echo'
      - '{{.GO}} tool go-echo "Serial log: {{.LOG_FILE}}"'
      - '{{.GO}} tool go-echo "Debug log:  {{.DEBUG_LOG}}"'

  run-debug-mmu:
    desc: "Run QEMU with MMU/paging tracing (SMP=N for CPUs)"
    deps: [disk, cardinal]
    vars:
      TIMEOUT: '{{.TIMEOUT | default "5"}}'
      SMP: '{{.SMP | default "4"}}'
      LOG_FILE: /tmp/cardinal-serial.log
      DEBUG_LOG: /tmp/qemu-debug.log
      DEBUG_OPTS: 'mmu,int,guest_errors'
    cmds:
      - task: stop
      - '{{.GO}} tool go-rm {{.LOG_FILE}}'
      - '{{.GO}} tool go-rm {{.DEBUG_LOG}}'
      - '{{.GO}} tool go-echo "Starting QEMU with MMU tracing ({{.SMP}} CPUs)..."'
      - '{{.GO}} tool go-echo "Debug options: {{.DEBUG_OPTS}}"'
      - '{{.GO}} tool go-start {{.QEMU}} -M virt,virtualization=off -cpu cortex-a72 -smp {{.SMP}} -m 8G -kernel {{.CARDINAL_ELF}} -nodefaults -device virtio-gpu-pci -device virtio-keyboard-pci -device virtio-mouse-pci -object rng-random,id=rng0,filename=/dev/urandom -device virtio-rng-device,rng=rng0 -display {{.DISPLAY}} -serial file:{{.LOG_FILE}} -monitor tcp:127.0.0.1:4444,server,nowait -semihosting -drive file={{.DISK_IMAGE}},if=none,format=raw,readonly=on,id=disk0 -device virtio-blk-device,drive=disk0 -d {{.DEBUG_OPTS}} -D {{.DEBUG_LOG}}'
      - '{{.GO}} tool go-sleep {{.TIMEOUT}}s'
      - task: stop
      - '{{.GO}} tool go-sleep 0.3'
      - '{{.GO}} tool go-echo "Serial log: {{.LOG_FILE}}"'
      - '{{.GO}} tool go-echo "Debug log:  {{.DEBUG_LOG}}"'

  run-debug-full:
    desc: "Run QEMU with full tracing (very verbose, SMP=N for CPUs)"
    deps: [disk, cardinal]
    vars:
      TIMEOUT: '{{.TIMEOUT | default "5"}}'
      SMP: '{{.SMP | default "4"}}'
      LOG_FILE: /tmp/cardinal-serial.log
      DEBUG_LOG: /tmp/qemu-debug.log
      DEBUG_OPTS: 'exec,cpu,int,mmu,guest_errors,nochain'
    cmds:
      - task: stop
      - '{{.GO}} tool go-rm {{.LOG_FILE}}'
      - '{{.GO}} tool go-rm {{.DEBUG_LOG}}'
      - '{{.GO}} tool go-echo "Starting QEMU with FULL tracing ({{.SMP}} CPUs, very verbose)..."'
      - '{{.GO}} tool go-echo "Debug options: {{.DEBUG_OPTS}}"'
      - '{{.GO}} tool go-start {{.QEMU}} -M virt,virtualization=off -cpu cortex-a72 -smp {{.SMP}} -m 8G -kernel {{.CARDINAL_ELF}} -nodefaults -device virtio-gpu-pci -device virtio-keyboard-pci -device virtio-mouse-pci -object rng-random,id=rng0,filename=/dev/urandom -device virtio-rng-device,rng=rng0 -display {{.DISPLAY}} -serial file:{{.LOG_FILE}} -monitor tcp:127.0.0.1:4444,server,nowait -semihosting -drive file={{.DISK_IMAGE}},if=none,format=raw,readonly=on,id=disk0 -device virtio-blk-device,drive=disk0 -d {{.DEBUG_OPTS}} -D {{.DEBUG_LOG}}'
      - '{{.GO}} tool go-sleep {{.TIMEOUT}}s'
      - task: stop
      - '{{.GO}} tool go-sleep 0.3'
      - '{{.GO}} tool go-echo "Serial log: {{.LOG_FILE}}"'
      - '{{.GO}} tool go-echo "Debug log:  {{.DEBUG_LOG}}"'

  show-debug:
    desc: "Show last N lines of debug log (N=100 default)"
    vars:
      N: '{{.N | default "100"}}'
    cmds:
      - '{{.GO}} tool go-tail -n {{.N}} /tmp/qemu-debug.log'

  # ===========================================================================
  # Utility Tasks
  # ===========================================================================

  test:
    desc: Run Go tests
    deps: [check-env]
    cmds:
      - '{{.GO}} tool go-echo "Running tests..."'
      - '{{.GO}} test -v ./cardinal/bitfield'

  clean:
    desc: Remove build artifacts
    cmds:
      - '{{.GO}} tool go-echo "Cleaning build artifacts..."'
      - '{{.GO}} tool go-rm -r {{.BUILD_DIR}}'
      - '{{.GO}} tool go-echo "Cleaned."'

  # ===========================================================================
  # Default Target
  # ===========================================================================

  all:
    desc: Build cardinal, kmazarin, and disk image (default)
    deps: [cardinal, disk]

  default:
    deps: [all]
