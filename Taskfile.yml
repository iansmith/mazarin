      - '{{.GO}} tool go-echo "Helloworld.maz built at {{.HELLOWORLD_MAZ}}"'

  # ===========================================================================
  # Disk Image
  # ===========================================================================

  disk:
    desc: Create FAT32 disk image with flock binaries and kmazarin kernel
    deps: [priestsieve, dapope, stdio, priest2, priest3, sievetest, sieve3, sieve5, sieve6, sieve7, sieve8, sieve9, helloworld-maz, kmazarin, convert-boot-image]
    sources:
      - '{{.PRIESTSIEVE_ELF}}'
      - '{{.DAPOPE_ELF}}'
      - '{{.STDIO_ELF}}'
      - '{{.PRIEST2_ELF}}'
      - '{{.PRIEST3_ELF}}'
      - '{{.SIEVETEST_ELF}}'
      - '{{.SIEVE3_ELF}}'
      - '{{.SIEVE5_ELF}}'
      - '{{.SIEVE6_ELF}}'
      - '{{.SIEVE7_ELF}}'
      - '{{.SIEVE8_ELF}}'
      - '{{.SIEVE9_ELF}}'
      - '{{.HELLOWORLD_MAZ}}'
      - '{{.KMAZARIN_ELF}}'
      - '{{.BUILD_DIR}}/boot-image.bin'
    generates:
      - '{{.DISK_IMAGE}}'
    cmds:
      - '{{.GO}} tool go-echo "Creating FAT32 disk image..."'
      - '{{.GO}} tool mkfat32 -o {{.DISK_IMAGE}} {{.PRIESTSIEVE_ELF}} {{.DAPOPE_ELF}} {{.STDIO_ELF}} {{.PRIEST2_ELF}} {{.PRIEST3_ELF}} {{.SIEVETEST_ELF}} {{.SIEVE3_ELF}} {{.SIEVE5_ELF}} {{.SIEVE6_ELF}} {{.SIEVE7_ELF}} {{.SIEVE8_ELF}} {{.SIEVE9_ELF}} {{.HELLOWORLD_MAZ}} {{.KMAZARIN_ELF}} {{.BUILD_DIR}}/boot-image.bin'
      - '{{.GO}} tool go-echo "Disk image created at {{.DISK_IMAGE}}"'

  disk-amd64:
    desc: Create FAT32 disk image with AMD64 flock binaries and kmazarin kernel
    deps: [dapope-amd64, stdio-amd64, kmazarin-amd64, convert-boot-image]
    sources:
      - '{{.DAPOPE_AMD64_ELF}}'
      - '{{.STDIO_AMD64_ELF}}'
      - '{{.KMAZARIN_AMD64_ELF}}'
      - '{{.BUILD_DIR}}/boot-image.bin'
    generates:
      - '{{.DISK_AMD64_IMAGE}}'
    cmds:
      - '{{.GO}} tool go-echo "Creating FAT32 disk image for AMD64..."'
      # Stage amd64 ELFs in a subdirectory so we don't overwrite ARM64 build/dapope.elf
      - '{{.GO}} tool go-mkdir {{.BUILD_DIR}}/disk-staging-amd64'
      - '{{.GO}} tool go-cp {{.DAPOPE_AMD64_ELF}} {{.BUILD_DIR}}/disk-staging-amd64/dapope.elf'
      - '{{.GO}} tool go-cp {{.STDIO_AMD64_ELF}} {{.BUILD_DIR}}/disk-staging-amd64/stdio.elf'
      - '{{.GO}} tool mkfat32 -o {{.DISK_AMD64_IMAGE}} {{.BUILD_DIR}}/disk-staging-amd64/dapope.elf {{.BUILD_DIR}}/disk-staging-amd64/stdio.elf {{.KMAZARIN_AMD64_ELF}} {{.BUILD_DIR}}/boot-image.bin'
      - '{{.GO}} tool go-echo "AMD64 disk image created at {{.DISK_AMD64_IMAGE}}"'

  disk-riscv64:
    desc: Create FAT32 disk image with RISC-V 64-bit flock binaries and kmazarin kernel
    deps: [dapope-riscv64, stdio-riscv64, kmazarin-riscv64, convert-boot-image]
    sources:
      - '{{.DAPOPE_RISCV64_ELF}}'
      - '{{.STDIO_RISCV64_ELF}}'
      - '{{.KMAZARIN_RISCV64_ELF}}'
      - '{{.BUILD_DIR}}/boot-image.bin'
    generates:
      - '{{.DISK_RISCV64_IMAGE}}'
    cmds:
      - '{{.GO}} tool go-echo "Creating FAT32 disk image for RISC-V 64-bit..."'
      - '{{.GO}} tool go-mkdir {{.BUILD_DIR}}/disk-staging-riscv64'
      - '{{.GO}} tool go-cp {{.DAPOPE_RISCV64_ELF}} {{.BUILD_DIR}}/disk-staging-riscv64/dapope.elf'
      - '{{.GO}} tool go-cp {{.STDIO_RISCV64_ELF}} {{.BUILD_DIR}}/disk-staging-riscv64/stdio.elf'
      - '{{.GO}} tool mkfat32 -o {{.DISK_RISCV64_IMAGE}} {{.BUILD_DIR}}/disk-staging-riscv64/dapope.elf {{.BUILD_DIR}}/disk-staging-riscv64/stdio.elf {{.KMAZARIN_RISCV64_ELF}} {{.BUILD_DIR}}/boot-image.bin'
      - '{{.GO}} tool go-echo "RISC-V 64-bit disk image created at {{.DISK_RISCV64_IMAGE}}"'

  disk-riscv64-minimal:
    desc: Create minimal FAT32 disk image for RISC-V 64-bit (kmazarin only, no userspace programs)
    deps: [kmazarin-riscv64, convert-boot-image]
    sources:
      - '{{.KMAZARIN_RISCV64_ELF}}'
      - '{{.BUILD_DIR}}/boot-image.bin'
    generates:
      - '{{.DISK_RISCV64_IMAGE}}'
    cmds:
      - '{{.GO}} tool go-echo "Creating minimal FAT32 disk image for RISC-V 64-bit (kmazarin only)..."'
      - '{{.GO}} tool mkfat32 -o {{.DISK_RISCV64_IMAGE}} {{.KMAZARIN_RISCV64_ELF}} {{.BUILD_DIR}}/boot-image.bin'
      - '{{.GO}} tool go-echo "RISC-V 64-bit minimal disk image created at {{.DISK_RISCV64_IMAGE}}"'

  # ===========================================================================
  # Diplomat - x86_64 UEFI Bootloader
  # ===========================================================================

  gen-overlay:
    run: once
    desc: Build the overlay JSON generator tool
    deps: [build-dir]
    sources:
      - 'cmd/gen-overlay/*.go'
    generates:
      - '{{.BUILD_DIR}}/gen-overlay'
    cmds:
      - '{{.GO}} build -o {{.BUILD_DIR}}/gen-overlay ./cmd/gen-overlay'

  elf2pe:
    desc: Build the ELF to PE converter
    deps: [build-dir]
    sources:
      - 'cmd/elf2pe/*.go'
    generates:
      - '{{.BUILD_DIR}}/elf2pe'
    cmds:
      - '{{.GO}} build -o {{.BUILD_DIR}}/elf2pe ./cmd/elf2pe'

  diplomat-linux-overlay:
    desc: Generate overlay JSON for diplomat runtime patches (Linux→UEFI)
    deps: [gen-overlay]
    sources:
      - 'runtime-patches/diplomat-linux/**/*'
    generates:
      - '{{.BUILD_DIR}}/diplomat-linux-overlay.json'
    cmds:
      - '{{.BUILD_DIR}}/gen-overlay -type diplomat-linux -patches runtime-patches/diplomat-linux -o {{.BUILD_DIR}}/diplomat-linux-overlay.json'

  diplomat:
    desc: Build diplomat UEFI bootloader for x86_64
    deps: [check-env, build-dir, elf2pe, diplomat-linux-overlay]
    sources:
      - 'diplomat/**/*.go'
      - 'diplomat/**/*.s'
      - 'shared/**/*.go'
      - '{{.BUILD_DIR}}/diplomat-linux-overlay.json'
    generates:
      - '{{.DIPLOMAT_EFI}}'
    cmds:
      - '{{.GO}} tool go-echo "Building diplomat for x86_64 UEFI (via Linux/amd64)..."'
      # Step 1: Build as Linux ELF with runtime patches
      - 'CGO_ENABLED=0 GOOS=linux GOARCH=amd64 {{.GO}} build -ldflags="-checklinkname=0" -overlay={{.BUILD_DIR}}/diplomat-linux-overlay.json -o {{.BUILD_DIR}}/diplomat.elf ./diplomat/main'
      # Step 2: Convert ELF to PE format for UEFI
      - '{{.BUILD_DIR}}/elf2pe {{.BUILD_DIR}}/diplomat.elf {{.DIPLOMAT_EFI}}'
      - '{{.GO}} tool go-echo "Diplomat EFI ready at {{.DIPLOMAT_EFI}}"'

  diplomat-arm64:
    desc: Build diplomat UEFI bootloader for ARM64
    deps: [check-env, build-dir, elf2pe, diplomat-linux-overlay]
    sources:
      - 'diplomat/**/*.go'
      - 'diplomat/**/*.s'
      - 'shared/**/*.go'
      - '{{.BUILD_DIR}}/diplomat-linux-overlay.json'
    generates:
      - '{{.BUILD_DIR}}/diplomat-arm64.efi'
    cmds:
      - '{{.GO}} tool go-echo "Building diplomat for ARM64 UEFI (via Linux/arm64)..."'
      # Step 1: Build as Linux ELF with runtime patches
      - 'CGO_ENABLED=0 GOOS=linux GOARCH=arm64 {{.GO}} build -ldflags="-checklinkname=0" -overlay={{.BUILD_DIR}}/diplomat-linux-overlay.json -o {{.BUILD_DIR}}/diplomat-arm64.elf ./diplomat/main'
      # Step 2: Convert ELF to PE format for UEFI
      - '{{.BUILD_DIR}}/elf2pe {{.BUILD_DIR}}/diplomat-arm64.elf {{.BUILD_DIR}}/diplomat-arm64.efi'
      - '{{.GO}} tool go-echo "Diplomat ARM64 EFI ready at {{.BUILD_DIR}}/diplomat-arm64.efi"'

  diplomat-riscv64:
    desc: Build diplomat for RISC-V 64-bit (ELF, loaded via QEMU -kernel)
    deps: [check-env, build-dir, diplomat-linux-overlay]
    sources:
      - 'diplomat/**/*.go'
      - 'diplomat/**/*.s'
      - 'shared/**/*.go'
      - '{{.BUILD_DIR}}/diplomat-linux-overlay.json'
    generates:
      - '{{.DIPLOMAT_RISCV64_ELF}}'
    cmds:
      - '{{.GO}} tool go-echo "Building diplomat for RISC-V 64-bit (ELF for -kernel loading)..."'
      # Build as Linux ELF with runtime patches — no elf2pe conversion needed.
      # UEFI firmware is broken on RISC-V, so we load via QEMU -kernel + OpenSBI.
      # Link at 0x80200000 (standard RISC-V kernel load address, after OpenSBI)
      - 'CGO_ENABLED=0 GOOS=linux GOARCH=riscv64 {{.GO}} build -ldflags="-checklinkname=0 -T 0x80200000" -overlay={{.BUILD_DIR}}/diplomat-linux-overlay.json -o {{.DIPLOMAT_RISCV64_ELF}} ./diplomat/main'
      - '{{.GO}} tool go-echo "Patching entry point to _rt0_riscv64_linux..."'
      - '{{.GO}} tool patch-entry {{.DIPLOMAT_RISCV64_ELF}} _rt0_riscv64_linux'
      - '{{.GO}} tool go-echo "Fixing ELF for QEMU compatibility..."'
      - '{{.GO}} tool fix-go-elf {{.DIPLOMAT_RISCV64_ELF}}'
      - '{{.GO}} tool go-echo "Diplomat RISC-V 64-bit ELF ready at {{.DIPLOMAT_RISCV64_ELF}}"'

  mkesp:
    desc: Build the ESP image creator
    deps: [build-dir]
    sources:
      - 'cmd/mkesp/*.go'
    generates:
      - '{{.BUILD_DIR}}/mkesp'
    cmds:
      - '{{.GO}} build -o {{.BUILD_DIR}}/mkesp ./cmd/mkesp'

  mktestkernel:
    desc: Build the test kernel generator tool
    deps: [build-dir]
    sources:
      - 'cmd/mktestkernel/**/*.go'
    generates:
      - '{{.BUILD_DIR}}/mktestkernel'
    cmds:
      - '{{.GO}} build -o {{.BUILD_DIR}}/mktestkernel ./cmd/mktestkernel'

  testkernel:
    desc: Build minimal test kernel for diplomat ELF loader testing
    deps: [build-dir, mktestkernel]
    cmds:
      - '{{.BUILD_DIR}}/mktestkernel -o {{.BUILD_DIR}}/testkernel.elf -addr 0xFFFFFFFF00200000 -m "hello, mazarin\r\n"'

  esp:
    desc: Create EFI System Partition image for diplomat testing
    deps: [diplomat, mkesp, testkernel]
    sources:
      - '{{.DIPLOMAT_EFI}}'
      - '{{.BUILD_DIR}}/testkernel.elf'
    generates:
      - '{{.ESP_IMAGE}}'
    cmds:
      - '{{.GO}} tool go-echo "Creating ESP image..."'
      - '{{.BUILD_DIR}}/mkesp -bootloader {{.DIPLOMAT_EFI}} -kernel {{.BUILD_DIR}}/testkernel.elf -o {{.ESP_IMAGE}} -size 260'
      - '{{.GO}} tool go-echo "ESP created at {{.ESP_IMAGE}}"'

  esp-kmazarin:
    desc: Create EFI System Partition image for x86_64 diplomat with real kmazarin
    deps: [diplomat, mkesp, kmazarin-amd64]
    sources:
      - '{{.DIPLOMAT_EFI}}'
      - '{{.KMAZARIN_AMD64_ELF}}'
      - kmazarin.toml
    generates:
      - '{{.BUILD_DIR}}/esp-kmazarin.img'
    cmds:
      - '{{.GO}} tool go-echo "Creating x86_64 ESP image with kmazarin..."'
      - '{{.BUILD_DIR}}/mkesp -bootloader {{.DIPLOMAT_EFI}} -kernel {{.KMAZARIN_AMD64_ELF}} -config kmazarin.toml -o {{.BUILD_DIR}}/esp-kmazarin.img -size 260'
      - '{{.GO}} tool go-echo "ESP (x86_64 + kmazarin) created at {{.BUILD_DIR}}/esp-kmazarin.img"'

  run-diplomat-kmazarin:
    desc: "Run x86_64 diplomat with real kmazarin in QEMU (TIMEOUT=N for timeout, default=5s)"
    deps: [esp-kmazarin, disk-amd64]
    vars:
      TIMEOUT: '{{.TIMEOUT | default "5"}}'
      LOG_FILE: /tmp/diplomat-serial.log
      CPU_LOG_FILE: /tmp/qemu-cpu.log
    cmds:
      - task: stop-diplomat
      - '{{.GO}} tool go-rm {{.LOG_FILE}}'
      - '{{.GO}} tool go-echo "Starting diplomat x86_64 + kmazarin in QEMU (timeout {{.TIMEOUT}}s)..."'
      - task: run-diplomat-kmazarin-background
      - '{{.GO}} tool go-sleep {{.TIMEOUT}}s'
      - task: stop-diplomat
      - '{{.GO}} tool go-sleep 0.3'
      - '{{.GO}} tool go-echo'
      - '{{.GO}} tool go-echo "=== Diplomat x86_64 + Kmazarin Serial Output ==="'
      - '{{.GO}} tool safe-serial-read {{.LOG_FILE}}'
      - '{{.GO}} tool go-echo'
      - '{{.GO}} tool go-echo "Log files:"'
      - '{{.GO}} tool go-echo "  Serial:   {{.LOG_FILE}}"'
      - '{{.GO}} tool go-echo "  CPU log:  {{.CPU_LOG_FILE}}"'
      - '{{.GO}} tool go-echo'
      - '{{.GO}} tool go-echo "To view CPU log: tail -100 {{.CPU_LOG_FILE}}"'

  run-diplomat-kmazarin-background:
    desc: Start QEMU with diplomat + kmazarin in background (internal task)
    internal: true
    vars:
      LOG_FILE: /tmp/diplomat-serial.log
      CPU_LOG_FILE: /tmp/qemu-cpu.log
      FW_CODE: '{{if ne .OVMF ""}}{{.OVMF}}{{else}}{{dir .QEMU_AMD64}}/../share/qemu/edk2-x86_64-code.fd{{end}}'
    cmds:
      - '{{.GO}} tool go-rm {{.CPU_LOG_FILE}}'
      - '{{.GO}} tool go-start {{.QEMU_AMD64}} -machine q35,accel=tcg -cpu max -m 8G -drive if=pflash,format=raw,readonly=on,file={{.FW_CODE}} -drive file={{.BUILD_DIR}}/esp-kmazarin.img,format=raw,if=ide -drive file={{.BUILD_DIR}}/disk-amd64.img,format=raw,if=none,id=drive-virtio-disk0 -device virtio-blk-pci,drive=drive-virtio-disk0,bus=pcie.0,addr=0x10 -boot c -serial file:{{.LOG_FILE}} -debugcon file:/tmp/diplomat-debug.log -monitor tcp:127.0.0.1:4445,server,nowait -device virtio-vga -device virtio-keyboard-pci -device virtio-mouse-pci -display cocoa -d int,guest_errors -D {{.CPU_LOG_FILE}}'
      - '{{.GO}} tool go-echo "QEMU (x86_64 + kmazarin) started in background with CPU logging"'
      - '{{.GO}} tool go-echo "Monitor: tcp:127.0.0.1:4445"'
      - '{{.GO}} tool go-echo "Log file: {{.LOG_FILE}}"'
      - '{{.GO}} tool go-echo "CPU log: {{.CPU_LOG_FILE}}"'

  run-diplomat:
    desc: "Run diplomat in QEMU with OVMF (TIMEOUT=N for timeout, default=5s)"
    deps: [esp]
    vars:
      TIMEOUT: '{{.TIMEOUT | default "5"}}'
      LOG_FILE: /tmp/diplomat-serial.log
    cmds:
      - task: stop-diplomat
      - '{{.GO}} tool go-rm {{.LOG_FILE}}'
      - '{{.GO}} tool go-echo "Starting diplomat in QEMU (timeout {{.TIMEOUT}}s)..."'
      - task: run-diplomat-background
      - '{{.GO}} tool go-sleep {{.TIMEOUT}}s'
      - task: stop-diplomat
      - '{{.GO}} tool go-sleep 0.3'
      - '{{.GO}} tool go-echo'
      - '{{.GO}} tool go-echo "=== Diplomat Serial Output ==="'
      - '{{.GO}} tool safe-serial-read {{.LOG_FILE}}'
      - '{{.GO}} tool go-echo'
      - '{{.GO}} tool go-echo "Log file: {{.LOG_FILE}}"'

  run-diplomat-background:
    desc: Start QEMU with diplomat in background (internal task)
    internal: true
    vars:
      LOG_FILE: /tmp/diplomat-serial.log
      FW_CODE: '{{if ne .OVMF ""}}{{.OVMF}}{{else}}{{dir .QEMU_AMD64}}/../share/qemu/edk2-x86_64-code.fd{{end}}'
    cmds:
      - '{{.GO}} tool go-start {{.QEMU_AMD64}} -machine q35,accel=tcg -cpu max -m 8G -drive if=pflash,format=raw,readonly=on,file={{.FW_CODE}} -drive file={{.ESP_IMAGE}},format=raw,if=ide -boot c -serial file:{{.LOG_FILE}} -debugcon file:/tmp/diplomat-debug.log -monitor tcp:127.0.0.1:4445,server,nowait -display none -no-reboot'
      - '{{.GO}} tool go-echo "QEMU (x86_64) started in background"'
      - '{{.GO}} tool go-echo "Monitor: tcp:127.0.0.1:4445"'
      - '{{.GO}} tool go-echo "Log file: {{.LOG_FILE}}"'

  stop-diplomat:
    desc: Stop diplomat QEMU instance
    cmds:
      - cmd: '{{.GO}} tool go-nc -w 1s -c quit 127.0.0.1 4445'
        ignore_error: true
      - '{{.GO}} tool go-sleep 0.5'

  esp-arm64:
    desc: Create EFI System Partition image for ARM64 diplomat
    deps: [diplomat-arm64, mkesp, kmazarin]
    sources:
      - '{{.DIPLOMAT_ARM64_EFI}}'
      - '{{.KMAZARIN_ELF}}'
      - kmazarin.toml
    generates:
      - '{{.ESP_ARM64_IMAGE}}'
    cmds:
      - '{{.GO}} tool go-echo "Creating ARM64 ESP image..."'
      - '{{.BUILD_DIR}}/mkesp -arch aa64 -bootloader {{.DIPLOMAT_ARM64_EFI}} -kernel {{.KMAZARIN_ELF}} -config kmazarin.toml -o {{.ESP_ARM64_IMAGE}} -size 260'
      - '{{.GO}} tool go-echo "ESP (ARM64) created at {{.ESP_ARM64_IMAGE}}"'

  run-diplomat-arm64:
    desc: "Run diplomat ARM64 in QEMU with UEFI firmware (TIMEOUT=N for timeout, default=5s)"
    deps: [esp-arm64, disk]
    vars:
      TIMEOUT: '{{.TIMEOUT | default "5"}}'
      LOG_FILE: /tmp/diplomat-arm64-serial.log
    cmds:
      - task: stop-diplomat-arm64
      - '{{.GO}} tool go-rm {{.LOG_FILE}}'
      - '{{.GO}} tool go-echo "Starting diplomat ARM64 in QEMU (timeout {{.TIMEOUT}}s)..."'
      - task: run-diplomat-arm64-background
      - '{{.GO}} tool go-sleep {{.TIMEOUT}}s'
      - task: stop-diplomat-arm64
      - '{{.GO}} tool go-sleep 0.3'
      - '{{.GO}} tool go-echo'
      - '{{.GO}} tool go-echo "=== Diplomat ARM64 Serial Output ==="'
      - '{{.GO}} tool safe-serial-read {{.LOG_FILE}}'
      - '{{.GO}} tool go-echo'
      - '{{.GO}} tool go-echo "Log file: {{.LOG_FILE}}"'

  run-diplomat-arm64-background:
    desc: Start QEMU with ARM64 diplomat in background (internal task)
    internal: true
    vars:
      LOG_FILE: /tmp/diplomat-arm64-serial.log
      FW_CODE: '{{if ne .OVMF_ARM64 ""}}{{.OVMF_ARM64}}{{else}}{{dir .QEMU}}/../share/qemu/edk2-aarch64-code.fd{{end}}'
      FW_VARS_TEMPLATE: '{{if ne .OVMF_ARM64 ""}}{{dir .OVMF_ARM64}}/edk2-arm-vars.fd{{else}}{{dir .QEMU}}/../share/qemu/edk2-arm-vars.fd{{end}}'
    cmds:
      - '{{.GO}} tool go-cp {{.FW_VARS_TEMPLATE}} {{.BUILD_DIR}}/edk2-arm-vars.fd'
      - '{{.GO}} tool go-start {{.QEMU}} -M virt -cpu cortex-a72 -m 2G -rtc base=utc,clock=host -drive if=pflash,format=raw,readonly=on,file={{.FW_CODE}} -drive if=pflash,format=raw,file={{.BUILD_DIR}}/edk2-arm-vars.fd -drive file={{.ESP_ARM64_IMAGE}},format=raw,if=virtio -drive if=none,format=raw,readonly=on,file={{.DISK_IMAGE}},id=flock0 -device virtio-blk-pci,drive=flock0,bus=pcie.0 -device virtio-gpu-pci -device virtio-keyboard-pci -device virtio-mouse-pci -serial file:{{.LOG_FILE}} -monitor tcp:127.0.0.1:4446,server,nowait -display {{.DISPLAY}} -no-reboot'
      - '{{.GO}} tool go-echo "QEMU (ARM64 UEFI) started in background"'
      - '{{.GO}} tool go-echo "Monitor: tcp:127.0.0.1:4446"'
      - '{{.GO}} tool go-echo "Log file: {{.LOG_FILE}}"'

  stop-diplomat-arm64:
    desc: Stop ARM64 diplomat QEMU instance
    cmds:
      - cmd: '{{.GO}} tool go-nc -w 1s -c quit 127.0.0.1 4446'
        ignore_error: true
      - '{{.GO}} tool go-sleep 0.5'

  run-riscv:
    desc: "Run RISC-V diplomat+kmazarin (alias for run-diplomat-riscv64)"
    cmds:
      - task: run-diplomat-riscv64

  run-diplomat-riscv64:
    desc: "Run RISC-V diplomat+kmazarin in QEMU via OpenSBI -kernel (TIMEOUT=N for timeout, default=5s)"
    deps: [diplomat-riscv64, disk-riscv64]
    vars:
      TIMEOUT: '{{.TIMEOUT | default "5"}}'
      LOG_FILE: /tmp/diplomat-riscv64-serial.log
    cmds:
      - task: stop-diplomat-riscv64
      - '{{.GO}} tool go-rm {{.LOG_FILE}}'
      - '{{.GO}} tool go-echo "Starting RISC-V diplomat+kmazarin in QEMU (timeout {{.TIMEOUT}}s)..."'
      - task: run-diplomat-riscv64-background
      - '{{.GO}} tool go-sleep {{.TIMEOUT}}s'
      - task: stop-diplomat-riscv64
      - '{{.GO}} tool go-sleep 0.3'
      - '{{.GO}} tool go-echo'
      - '{{.GO}} tool go-echo "=== Diplomat RISC-V 64-bit Serial Output ==="'
      - '{{.GO}} tool safe-serial-read {{.LOG_FILE}}'
      - '{{.GO}} tool go-echo'
      - '{{.GO}} tool go-echo "Log file: {{.LOG_FILE}}"'

  run-diplomat-riscv64-background:
    desc: Start QEMU with RISC-V diplomat via OpenSBI -kernel in background (internal task)
    internal: true
    vars:
      LOG_FILE: /tmp/diplomat-riscv64-serial.log
      TRACE_FILE: /tmp/diplomat-riscv64-trace.log
      DEBUG_LOG: /tmp/diplomat-riscv64-debug.log
      # VIRTIO_TRANSPORT options: "mmio" (default for RISC-V diplomat boot) or "pci"
      VIRTIO_TRANSPORT: '{{.VIRTIO_TRANSPORT | default "mmio"}}'
      # Set SEPARATE_OUTPUT=true for verbose QEMU debug logging (-d int,guest_errors)
      SEPARATE_OUTPUT: '{{.SEPARATE_OUTPUT | default "false"}}'
      QEMU_DEBUG_FLAGS: '{{if eq .SEPARATE_OUTPUT "true"}}-d int,guest_errors -D {{.DEBUG_LOG}}{{end}}'
    cmds:
      # Use -bios default to load OpenSBI, which then loads diplomat as kernel
      # OpenSBI jumps to the ELF entry point after initialization
      #
      # PRIORITY 1: Switch to virtio-blk-pci (PCI transport) like ARM64/x86_64
      # - ARM64/x86_64 use virtio-blk-pci and work correctly
      # - RISC-V was using virtio-blk-device (MMIO) which fails
      # - QEMU RISC-V may have better PCI support than MMIO v1
      #
      # PRIORITY 2: Enable VirtIO tracing to see device behavior
      # - Trace output goes to stderr (captured in trace file)
      # - Shows if device receives notifications, processes descriptors
      - '{{.GO}} tool go-rm {{.TRACE_FILE}}'
      - |
        {{if eq .VIRTIO_TRANSPORT "mmio"}}
        {{.GO}} tool go-start {{.QEMU_RISCV64}} -M virt -m 2G -rtc base=utc,clock=host -bios default -kernel {{.DIPLOMAT_RISCV64_ELF}} -drive file={{.DISK_RISCV64_IMAGE}},format=raw,if=none,id=drive-virtio-disk0 -device virtio-blk-device,drive=drive-virtio-disk0 -device virtio-gpu-pci -device virtio-keyboard-pci -device virtio-mouse-pci -serial file:{{.LOG_FILE}} -monitor tcp:127.0.0.1:4447,server,nowait -display {{.DISPLAY}} -no-reboot -global virtio-mmio.force-legacy=false -trace 'virtio_*' -trace 'virtqueue_*' {{.QEMU_DEBUG_FLAGS}} 2>{{.TRACE_FILE}}
        {{else}}
        {{.GO}} tool go-start {{.QEMU_RISCV64}} -M virt -m 2G -rtc base=utc,clock=host -bios default -kernel {{.DIPLOMAT_RISCV64_ELF}} -drive file={{.DISK_RISCV64_IMAGE}},format=raw,if=none,id=drive-virtio-disk0 -device virtio-blk-pci,drive=drive-virtio-disk0 -device virtio-gpu-pci -device virtio-keyboard-pci -device virtio-mouse-pci -serial file:{{.LOG_FILE}} -monitor tcp:127.0.0.1:4447,server,nowait -display {{.DISPLAY}} -no-reboot -trace 'virtio_*' -trace 'virtqueue_*' {{.QEMU_DEBUG_FLAGS}} 2>{{.TRACE_FILE}}
        {{end}}
      - '{{.GO}} tool go-echo "QEMU (RISC-V diplomat via OpenSBI, VirtIO {{.VIRTIO_TRANSPORT}}) started in background"'
      - '{{.GO}} tool go-echo "Monitor: tcp:127.0.0.1:4447"'
      - '{{.GO}} tool go-echo "Log file: {{.LOG_FILE}}"'
      - '{{if eq .SEPARATE_OUTPUT "true"}}{{.GO}} tool go-echo "Debug log: {{.DEBUG_LOG}}"{{end}}'
      - '{{.GO}} tool go-echo "Trace file: {{.TRACE_FILE}}"'

  stop-diplomat-riscv64:
    desc: Stop RISC-V diplomat QEMU instance
    cmds:
      - cmd: '{{.GO}} tool go-nc -w 1s -c quit 127.0.0.1 4447'
        ignore_error: true
      - '{{.GO}} tool go-sleep 0.5'

  # ===========================================================================
  # Direct Kernel Boot (RISC-V) - Bypass UEFI
  # ===========================================================================

  run-direct-riscv64:
    desc: "Run RISC-V kmazarin directly with OpenSBI (no UEFI, TIMEOUT=N for timeout, default=5s)"
    deps: [kmazarin-riscv64, disk]
    vars:
      TIMEOUT: '{{.TIMEOUT | default "5"}}'
      LOG_FILE: /tmp/kmazarin-riscv64-serial.log
    cmds:
      - task: stop-direct-riscv64
      - '{{.GO}} tool go-rm {{.LOG_FILE}}'
      - '{{.GO}} tool go-echo "Starting RISC-V kmazarin with direct kernel boot (timeout {{.TIMEOUT}}s)..."'
      - task: run-direct-riscv64-background
      - '{{.GO}} tool go-sleep {{.TIMEOUT}}s'
      - task: stop-direct-riscv64
      - '{{.GO}} tool go-sleep 0.3'
      - '{{.GO}} tool go-echo'
      - '{{.GO}} tool go-echo "=== RISC-V Kmazarin Serial Output ==="'
      - '{{.GO}} tool safe-serial-read {{.LOG_FILE}}'
      - '{{.GO}} tool go-echo'
      - '{{.GO}} tool go-echo "Log file: {{.LOG_FILE}}"'

  run-direct-riscv64-background:
    desc: Start QEMU with direct RISC-V kernel boot in background (internal task)
    internal: true
    vars:
      LOG_FILE: /tmp/kmazarin-riscv64-serial.log
      OPENSBI: '{{dir .QEMU_RISCV64}}/../share/qemu/opensbi-riscv64-generic-fw_dynamic.bin'
    cmds:
      - '{{.GO}} tool go-start {{.QEMU_RISCV64}} -M virt -cpu rv64 -m 2G -bios {{.OPENSBI}} -kernel {{.KMAZARIN_RISCV64_ELF}} -drive if=none,format=raw,readonly=on,file={{.DISK_IMAGE}},id=flock0 -device virtio-blk-pci,drive=flock0,bus=pcie.0 -device virtio-gpu-pci -device virtio-keyboard-pci -device virtio-mouse-pci -serial file:{{.LOG_FILE}} -monitor tcp:127.0.0.1:4448,server,nowait -display {{.DISPLAY}} -no-reboot'
      - '{{.GO}} tool go-echo "QEMU (RISC-V direct kernel boot) started in background"'
      - '{{.GO}} tool go-echo "Monitor: tcp:127.0.0.1:4448"'
      - '{{.GO}} tool go-echo "Log file: {{.LOG_FILE}}"'

  stop-direct-riscv64:
    desc: Stop RISC-V direct kernel boot QEMU instance
    cmds:
      - cmd: '{{.GO}} tool go-nc -w 1s -c quit 127.0.0.1 4448'
        ignore_error: true
      - '{{.GO}} tool go-sleep 0.5'

  # ===========================================================================
  # Run and Stop (diplomat-based)
  # ===========================================================================

  run:
    desc: "Run ARM64 diplomat+kmazarin in QEMU (shorthand for run-diplomat-arm64)"
    cmds:
      - task: run-diplomat-arm64
        vars:
          TIMEOUT: '{{.TIMEOUT | default "5"}}'

  run-amd64:
    desc: "Run x86_64 diplomat+kmazarin in QEMU (shorthand for run-diplomat-kmazarin)"
    cmds:
      - task: run-diplomat-kmazarin
        vars:
          TIMEOUT: '{{.TIMEOUT | default "5"}}'

  run-x86_64:
    desc: "Run x86_64 diplomat+kmazarin in QEMU (alias for run-amd64)"
    cmds:
      - task: run-diplomat-kmazarin
        vars:
          TIMEOUT: '{{.TIMEOUT | default "5"}}'

  run-riscv64:
    desc: "Run RISC-V diplomat+kmazarin in QEMU (shorthand for run-diplomat-riscv64)"
    cmds:
      - task: run-diplomat-riscv64
        vars:
          TIMEOUT: '{{.TIMEOUT | default "5"}}'

  qemu-console:
    desc: "Send command to QEMU monitor (CMD='info registers' or other QEMU command)"
    vars:
      CMD: '{{.CMD | default "info registers"}}'
    cmds:
      - '{{.GO}} tool go-nc -c "{{.CMD}}" 127.0.0.1 4444'

  show:
    desc: "Show serial output using safe-serial-read with pagination"
    cmds:
      - '{{.GO}} tool safe-serial-read -p'

  stop:
    desc: Stop all running QEMU instances
    cmds:
      # Send quit command to QEMU monitor if it's listening
      - cmd: '{{.GO}} tool go-nc -w 1s -c quit 127.0.0.1 4444'
        ignore_error: true
      - '{{.GO}} tool go-sleep 0.5'

  show-debug:
    desc: "Show last N lines of debug log (N=100 default)"
    vars:
      N: '{{.N | default "100"}}'
    cmds:
      - '{{.GO}} tool go-tail -n {{.N}} /tmp/qemu-debug.log'

  # ===========================================================================
  # Utility Tasks
  # ===========================================================================

  test:
    desc: Run Go tests
    deps: [check-env]
    cmds:
      - '{{.GO}} tool go-echo "Running tests..."'
      - '{{.GO}} test -v ./shared/...'

  clean:
    desc: Remove build artifacts
    cmds:
      - '{{.GO}} tool go-echo "Cleaning build artifacts..."'
      - '{{.GO}} tool go-rm -r {{.BUILD_DIR}}'
      - '{{.GO}} tool go-echo "Cleaned."'

  # ===========================================================================
  # Default Target
  # ===========================================================================

  all:
    desc: Build diplomat + kmazarin for x86_64 and ARM64
    deps: [esp-kmazarin, esp-arm64]

  default:
    desc: Build diplomat + kmazarin for ARM64 (default target)
    deps: [esp-arm64, disk]
