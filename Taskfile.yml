      - '{{.GO}} tool go-cp {{.DAPOPE_RISCV64_ELF}} {{.BUILD_DIR}}/disk-staging-riscv64/dapope.elf'
      - '{{.GO}} tool go-cp {{.STDIO_RISCV64_ELF}} {{.BUILD_DIR}}/disk-staging-riscv64/stdio.elf'
      - '{{.GO}} tool go-cp {{.DISKPRIEST_RISCV64_ELF}} {{.BUILD_DIR}}/disk-staging-riscv64/disk.elf'
      - '{{.GO}} tool go-cp {{.FS_MZR_RISCV64}} {{.BUILD_DIR}}/disk-staging-riscv64/fs.maz'
      - '{{.GO}} tool go-cp config/kmazarin-riscv64.toml {{.BUILD_DIR}}/disk-staging-riscv64/kmazarin.toml'
      - '{{.GO}} tool mkfat32 -o {{.DISK_RISCV64_IMAGE}} {{.BUILD_DIR}}/disk-staging-riscv64/dapope.elf {{.BUILD_DIR}}/disk-staging-riscv64/stdio.elf {{.BUILD_DIR}}/disk-staging-riscv64/disk.elf {{.BUILD_DIR}}/disk-staging-riscv64/fs.maz {{.BUILD_DIR}}/disk-staging-riscv64/kmazarin.toml {{.KMAZARIN_RISCV64_ELF}} {{.BUILD_DIR}}/boot-image.bin'
      - '{{.GO}} tool go-echo "RISC-V 64-bit disk image created at {{.DISK_RISCV64_IMAGE}}"'

  # ===========================================================================
  # Diplomat - UEFI Bootloader
  # ===========================================================================

  gen-overlay:
    run: once
    desc: Build the overlay JSON generator tool
    deps: [build-dir]
    sources:
      - 'cmd/gen-overlay/*.go'
    generates:
      - '{{.BUILD_DIR}}/gen-overlay'
    cmds:
      - '{{.GO}} build -o {{.BUILD_DIR}}/gen-overlay ./cmd/gen-overlay'

  elf2pe:
    desc: Build the ELF to PE converter
    deps: [build-dir]
    sources:
      - 'cmd/elf2pe/*.go'
    generates:
      - '{{.BUILD_DIR}}/elf2pe'
    cmds:
      - '{{.GO}} build -o {{.BUILD_DIR}}/elf2pe ./cmd/elf2pe'

  diplomat-linux-overlay:
    method: checksum
    desc: Generate overlay JSON for diplomat runtime patches (Linux->UEFI)
    deps: [gen-overlay]
    sources:
      - 'runtime-patches/diplomat-linux/**/*'
    generates:
      - '{{.BUILD_DIR}}/diplomat-linux-overlay.json'
    cmds:
      - '{{.BUILD_DIR}}/gen-overlay -type diplomat-linux -patches runtime-patches/diplomat-linux -o {{.BUILD_DIR}}/diplomat-linux-overlay.json'

  diplomat-x86_64:
    desc: Build diplomat UEFI bootloader for x86_64
    deps: [check-env, build-dir, elf2pe, diplomat-linux-overlay]
    sources:
      - 'diplomat/**/*.go'
      - 'diplomat/**/*.s'
      - 'shared/**/*.go'
      - '{{.BUILD_DIR}}/diplomat-linux-overlay.json'
      # Overlay source files — Go's build cache doesn't track overlay content
      - 'runtime-patches/diplomat-linux/**/*'
    generates:
      - '{{.DIPLOMAT_EFI}}'
    cmds:
      - '{{.GO}} tool go-echo "Building diplomat for x86_64 UEFI (via Linux/amd64)..."'
      # Step 1: Build as Linux ELF with runtime patches
      - 'CGO_ENABLED=0 GOOS=linux GOARCH=amd64 {{.GO}} build -ldflags="-checklinkname=0" -overlay={{.BUILD_DIR}}/diplomat-linux-overlay.json -o {{.BUILD_DIR}}/diplomat.elf ./diplomat/main'
      # Step 2: Convert ELF to PE format for UEFI
      - '{{.BUILD_DIR}}/elf2pe {{.BUILD_DIR}}/diplomat.elf {{.DIPLOMAT_EFI}}'
      - '{{.GO}} tool go-echo "Diplomat EFI ready at {{.DIPLOMAT_EFI}}"'

  diplomat-arm64:
    desc: Build diplomat UEFI bootloader for ARM64
    deps: [check-env, build-dir, elf2pe, diplomat-linux-overlay]
    sources:
      - 'diplomat/**/*.go'
      - 'diplomat/**/*.s'
      - 'shared/**/*.go'
      - '{{.BUILD_DIR}}/diplomat-linux-overlay.json'
      # Overlay source files — Go's build cache doesn't track overlay content
      - 'runtime-patches/diplomat-linux/**/*'
    generates:
      - '{{.BUILD_DIR}}/diplomat-arm64.efi'
    cmds:
      - '{{.GO}} tool go-echo "Building diplomat for ARM64 UEFI (via Linux/arm64)..."'
      # Step 1: Build as Linux ELF with runtime patches
      - 'CGO_ENABLED=0 GOOS=linux GOARCH=arm64 {{.GO}} build -ldflags="-checklinkname=0" -overlay={{.BUILD_DIR}}/diplomat-linux-overlay.json -o {{.BUILD_DIR}}/diplomat-arm64.elf ./diplomat/main'
      # Step 2: Convert ELF to PE format for UEFI
      - '{{.BUILD_DIR}}/elf2pe {{.BUILD_DIR}}/diplomat-arm64.elf {{.BUILD_DIR}}/diplomat-arm64.efi'
      - '{{.GO}} tool go-echo "Diplomat ARM64 EFI ready at {{.BUILD_DIR}}/diplomat-arm64.efi"'

  diplomat-riscv64:
    desc: Build diplomat for RISC-V 64-bit (ELF, loaded via QEMU -kernel)
    deps: [check-env, build-dir, diplomat-linux-overlay]
    sources:
      - 'diplomat/**/*.go'
      - 'diplomat/**/*.s'
      - 'shared/**/*.go'
      - '{{.BUILD_DIR}}/diplomat-linux-overlay.json'
      # Overlay source files — Go's build cache doesn't track overlay content
      - 'runtime-patches/diplomat-linux/**/*'
    generates:
      - '{{.DIPLOMAT_RISCV64_ELF}}'
    cmds:
      - '{{.GO}} tool go-echo "Building diplomat for RISC-V 64-bit (ELF for -kernel loading)..."'
      # Build as Linux ELF with runtime patches — no elf2pe conversion needed.
      # UEFI firmware is broken on RISC-V, so we load via QEMU -kernel + OpenSBI.
      # Link at 0x80200000 (standard RISC-V kernel load address, after OpenSBI)
      - 'CGO_ENABLED=0 GOOS=linux GOARCH=riscv64 {{.GO}} build -ldflags="-checklinkname=0 -T 0x80200000" -overlay={{.BUILD_DIR}}/diplomat-linux-overlay.json -o {{.DIPLOMAT_RISCV64_ELF}} ./diplomat/main'
      - '{{.GO}} tool go-echo "Patching entry point to _rt0_riscv64_linux..."'
      - '{{.GO}} tool patch-entry {{.DIPLOMAT_RISCV64_ELF}} _rt0_riscv64_linux'
      - '{{.GO}} tool go-echo "Fixing ELF for QEMU compatibility..."'
      - '{{.GO}} tool fix-go-elf {{.DIPLOMAT_RISCV64_ELF}}'
      - '{{.GO}} tool go-echo "Diplomat RISC-V 64-bit ELF ready at {{.DIPLOMAT_RISCV64_ELF}}"'

  mkesp:
    desc: Build the ESP image creator
    deps: [build-dir]
    sources:
      - 'cmd/mkesp/*.go'
    generates:
      - '{{.BUILD_DIR}}/mkesp'
    cmds:
      - '{{.GO}} build -o {{.BUILD_DIR}}/mkesp ./cmd/mkesp'

  mktestkernel:
    desc: Build the test kernel generator tool
    deps: [build-dir]
    sources:
      - 'cmd/mktestkernel/**/*.go'
    generates:
      - '{{.BUILD_DIR}}/mktestkernel'
    cmds:
      - '{{.GO}} build -o {{.BUILD_DIR}}/mktestkernel ./cmd/mktestkernel'

  testkernel:
    desc: Build minimal test kernel for diplomat ELF loader testing
    deps: [build-dir, mktestkernel]
    cmds:
      - '{{.BUILD_DIR}}/mktestkernel -o {{.BUILD_DIR}}/testkernel.elf -addr 0xFFFFFFFF00200000 -m "hello, mazarin\r\n"'

  esp-x86_64:
    desc: Create EFI System Partition image for x86_64 diplomat testing
    deps: [diplomat-x86_64, mkesp, testkernel]
    sources:
      - '{{.DIPLOMAT_EFI}}'
      - '{{.BUILD_DIR}}/testkernel.elf'
    generates:
      - '{{.ESP_IMAGE}}'
    cmds:
      - '{{.GO}} tool go-echo "Creating ESP image..."'
      - '{{.BUILD_DIR}}/mkesp -bootloader {{.DIPLOMAT_EFI}} -kernel {{.BUILD_DIR}}/testkernel.elf -o {{.ESP_IMAGE}} -size 260'
      - '{{.GO}} tool go-echo "ESP created at {{.ESP_IMAGE}}"'

  esp-x86_64-kmazarin:
    desc: Create EFI System Partition image for x86_64 diplomat with real kmazarin
    deps: [diplomat-x86_64, mkesp, kmazarin-x86_64]
    sources:
      - '{{.DIPLOMAT_EFI}}'
      - '{{.KMAZARIN_AMD64_ELF}}'
      - kmazarin.toml
    generates:
      - '{{.BUILD_DIR}}/esp-kmazarin.img'
    cmds:
      - '{{.GO}} tool go-echo "Creating x86_64 ESP image with kmazarin..."'
      - '{{.BUILD_DIR}}/mkesp -bootloader {{.DIPLOMAT_EFI}} -kernel {{.KMAZARIN_AMD64_ELF}} -config kmazarin.toml -o {{.BUILD_DIR}}/esp-kmazarin.img -size 260'
      - '{{.GO}} tool go-echo "ESP (x86_64 + kmazarin) created at {{.BUILD_DIR}}/esp-kmazarin.img"'

  esp-arm64:
    desc: Create EFI System Partition image for ARM64 diplomat
    deps: [diplomat-arm64, mkesp, kmazarin-arm64]
    sources:
      - '{{.DIPLOMAT_ARM64_EFI}}'
      - '{{.KMAZARIN_ELF}}'
      - kmazarin.toml
    generates:
      - '{{.ESP_ARM64_IMAGE}}'
    cmds:
      - '{{.GO}} tool go-echo "Creating ARM64 ESP image..."'
      - '{{.BUILD_DIR}}/mkesp -arch aa64 -bootloader {{.DIPLOMAT_ARM64_EFI}} -kernel {{.KMAZARIN_ELF}} -config kmazarin.toml -o {{.ESP_ARM64_IMAGE}} -size 260'
      - '{{.GO}} tool go-echo "ESP (ARM64) created at {{.ESP_ARM64_IMAGE}}"'

  # ===========================================================================
  # Run Tasks
  # ===========================================================================

  run:
    desc: "Run ARM64 diplomat+kmazarin in QEMU (shorthand for run-arm64)"
    cmds:
      - task: run-arm64
        vars:
          TIMEOUT: '{{.TIMEOUT | default "5"}}'

  run-arm64:
    desc: "Run ARM64 diplomat+kmazarin in QEMU (TIMEOUT=N for timeout, default=5s)"
    deps: [esp-arm64, disk-arm64]
    vars:
      TIMEOUT: '{{.TIMEOUT | default "5"}}'
      LOG_FILE: /tmp/diplomat-arm64-serial.log
      CPU_LOG_FILE: /tmp/qemu-arm64-cpu.log
    cmds:
      - task: stop-arm64
      - '{{.GO}} tool go-rm {{.LOG_FILE}}'
      - '{{.GO}} tool go-echo "Starting diplomat ARM64 in QEMU (timeout {{.TIMEOUT}}s)..."'
      - task: run-arm64-background
      - '{{.GO}} tool go-sleep {{.TIMEOUT}}s'
      - task: stop-arm64
      - '{{.GO}} tool go-sleep 0.3'
      - '{{.GO}} tool go-echo'
      - '{{.GO}} tool go-echo "=== Diplomat ARM64 Serial Output ==="'
      - '{{.GO}} tool safe-serial-read {{.LOG_FILE}}'
      - '{{.GO}} tool go-echo'
      - '{{.GO}} tool go-echo "Log files:"'
      - '{{.GO}} tool go-echo "  Serial:   {{.LOG_FILE}}"'
      - '{{.GO}} tool go-echo "  CPU log:  {{.CPU_LOG_FILE}}"'
      - '{{.GO}} tool go-echo'
      - '{{.GO}} tool go-echo "To view CPU log: tail -100 {{.CPU_LOG_FILE}}"'

  run-arm64-background:
    desc: Start QEMU with ARM64 diplomat in background (internal task)
    internal: true
    vars:
      LOG_FILE: /tmp/diplomat-arm64-serial.log
      CPU_LOG_FILE: /tmp/qemu-arm64-cpu.log
      FW_CODE: '{{if ne .OVMF_ARM64 ""}}{{.OVMF_ARM64}}{{else}}{{dir .QEMU}}/../share/qemu/edk2-aarch64-code.fd{{end}}'
      FW_VARS_TEMPLATE: '{{if ne .OVMF_ARM64 ""}}{{dir .OVMF_ARM64}}/edk2-arm-vars.fd{{else}}{{dir .QEMU}}/../share/qemu/edk2-arm-vars.fd{{end}}'
    cmds:
      - '{{.GO}} tool go-rm {{.CPU_LOG_FILE}}'
      - '{{.GO}} tool go-cp {{.FW_VARS_TEMPLATE}} {{.BUILD_DIR}}/edk2-arm-vars.fd'
      - '{{.GO}} tool go-start {{.QEMU}} -M virt -cpu cortex-a72 -m {{.QEMU_RAM}} -rtc base=utc,clock=host -drive if=pflash,format=raw,readonly=on,file={{.FW_CODE}} -drive if=pflash,format=raw,file={{.BUILD_DIR}}/edk2-arm-vars.fd -drive file={{.ESP_ARM64_IMAGE}},format=raw,if=virtio -drive if=none,format=raw,readonly=on,file={{.DISK_IMAGE}},id=flock0 -device virtio-blk-pci,drive=flock0,bus=pcie.0 -device virtio-gpu-pci -device virtio-keyboard-pci -device virtio-mouse-pci -device virtio-rng-pci -serial file:{{.LOG_FILE}} -monitor tcp:127.0.0.1:4446,server,nowait -display {{.DISPLAY}} -no-reboot'
      - '{{.GO}} tool go-echo "QEMU (ARM64 UEFI) started in background"'
      - '{{.GO}} tool go-echo "Monitor: tcp:127.0.0.1:4446"'
      - '{{.GO}} tool go-echo "Log file: {{.LOG_FILE}}"'
      - '{{.GO}} tool go-echo "CPU log: {{.CPU_LOG_FILE}}"'

  # ── ARM64 HVF (macOS only) ──────────────────────────────────────────
  # Uses Apple Hypervisor.framework for near-native speed on Apple Silicon Macs.
  # Requires macOS with an Apple Silicon (M-series) CPU.
  # Not available on Linux or Intel Macs — use run-arm64 (TCG) instead.
  run-arm64-hvf:
    desc: "Run ARM64 diplomat+kmazarin in QEMU with HVF acceleration (macOS Apple Silicon only)"
    deps: [esp-arm64, disk-arm64]
    vars:
      TIMEOUT: '{{.TIMEOUT | default "5"}}'
      LOG_FILE: /tmp/diplomat-arm64-serial.log
      CPU_LOG_FILE: /tmp/qemu-arm64-cpu.log
    cmds:
      - task: stop-arm64
      - '{{.GO}} tool go-rm {{.LOG_FILE}}'
      - '{{.GO}} tool go-echo "Starting diplomat ARM64 in QEMU+HVF (timeout {{.TIMEOUT}}s)..."'
      - task: run-arm64-hvf-background
      - '{{.GO}} tool go-sleep {{.TIMEOUT}}s'
      - task: stop-arm64
      - '{{.GO}} tool go-sleep 0.3'
      - '{{.GO}} tool go-echo'
      - '{{.GO}} tool go-echo "=== Diplomat ARM64 (HVF) Serial Output ==="'
      - '{{.GO}} tool safe-serial-read {{.LOG_FILE}}'
      - '{{.GO}} tool go-echo'
      - '{{.GO}} tool go-echo "Log files:"'
      - '{{.GO}} tool go-echo "  Serial:   {{.LOG_FILE}}"'
      - '{{.GO}} tool go-echo "  CPU log:  {{.CPU_LOG_FILE}}"'
      - '{{.GO}} tool go-echo'
      - '{{.GO}} tool go-echo "To view CPU log: tail -100 {{.CPU_LOG_FILE}}"'

  run-arm64-hvf-background:
    desc: Start QEMU with ARM64 diplomat + HVF in background (macOS Apple Silicon only)
    internal: true
    vars:
      LOG_FILE: /tmp/diplomat-arm64-serial.log
      CPU_LOG_FILE: /tmp/qemu-arm64-cpu.log
      FW_CODE: '{{if ne .OVMF_ARM64 ""}}{{.OVMF_ARM64}}{{else}}{{dir .QEMU}}/../share/qemu/edk2-aarch64-code.fd{{end}}'
      FW_VARS_TEMPLATE: '{{if ne .OVMF_ARM64 ""}}{{dir .OVMF_ARM64}}/edk2-arm-vars.fd{{else}}{{dir .QEMU}}/../share/qemu/edk2-arm-vars.fd{{end}}'
    cmds:
      - '{{.GO}} tool go-rm {{.CPU_LOG_FILE}}'
      - '{{.GO}} tool go-cp {{.FW_VARS_TEMPLATE}} {{.BUILD_DIR}}/edk2-arm-vars.fd'
      - '{{.GO}} tool go-start {{.QEMU}} -M virt -accel hvf -cpu host -m {{.QEMU_RAM}} -rtc base=utc,clock=host -drive if=pflash,format=raw,readonly=on,file={{.FW_CODE}} -drive if=pflash,format=raw,file={{.BUILD_DIR}}/edk2-arm-vars.fd -drive file={{.ESP_ARM64_IMAGE}},format=raw,if=virtio -drive if=none,format=raw,readonly=on,file={{.DISK_IMAGE}},id=flock0 -device virtio-blk-pci,drive=flock0,bus=pcie.0 -device virtio-gpu-pci -device virtio-keyboard-pci -device virtio-mouse-pci -device virtio-rng-pci -serial file:{{.LOG_FILE}} -monitor tcp:127.0.0.1:4446,server,nowait -display {{.DISPLAY}} -no-reboot'
      - '{{.GO}} tool go-echo "QEMU (ARM64 UEFI + HVF) started in background"'
      - '{{.GO}} tool go-echo "Monitor: tcp:127.0.0.1:4446"'
      - '{{.GO}} tool go-echo "Log file: {{.LOG_FILE}}"'
      - '{{.GO}} tool go-echo "CPU log: {{.CPU_LOG_FILE}}"'

  run-x86_64:
    desc: "Run x86_64 diplomat+kmazarin in QEMU (TIMEOUT=N for timeout, default=5s)"
    deps: [esp-x86_64-kmazarin, disk-x86_64]
    vars:
      TIMEOUT: '{{.TIMEOUT | default "5"}}'
      LOG_FILE: /tmp/diplomat-serial.log
    cmds:
      - task: stop-x86_64
      - '{{.GO}} tool go-rm {{.LOG_FILE}}'
      - '{{.GO}} tool go-echo "Starting diplomat x86_64 + kmazarin in QEMU (timeout {{.TIMEOUT}}s)..."'
      - task: run-x86_64-background
      - '{{.GO}} tool go-sleep {{.TIMEOUT}}s'
      - task: stop-x86_64
      - '{{.GO}} tool go-sleep 0.3'
      - '{{.GO}} tool go-echo'
      - '{{.GO}} tool go-echo "=== Diplomat x86_64 + Kmazarin Serial Output ==="'
      - '{{.GO}} tool safe-serial-read {{.LOG_FILE}}'
      - '{{.GO}} tool go-echo'
      - '{{.GO}} tool go-echo "Log file: {{.LOG_FILE}}"'

  run-x86_64-background:
    desc: Start QEMU with diplomat + kmazarin in background (internal task)
    internal: true
    vars:
      LOG_FILE: /tmp/diplomat-serial.log
      FW_CODE: '{{if ne .OVMF ""}}{{.OVMF}}{{else}}{{dir .QEMU_X86_64}}/../share/qemu/edk2-x86_64-code.fd{{end}}'
    cmds:
      - '{{.GO}} tool go-start {{.QEMU_X86_64}} -machine q35,accel=tcg -cpu max -m 8G -drive if=pflash,format=raw,readonly=on,file={{.FW_CODE}} -drive file={{.BUILD_DIR}}/esp-kmazarin.img,format=raw,if=ide -drive file={{.BUILD_DIR}}/disk-amd64.img,format=raw,if=none,id=drive-virtio-disk0 -device virtio-blk-pci,drive=drive-virtio-disk0,bus=pcie.0,addr=0x10 -boot c -serial file:{{.LOG_FILE}} -monitor tcp:127.0.0.1:4445,server,nowait -device virtio-vga -device virtio-keyboard-pci -device virtio-mouse-pci -device virtio-rng-pci -display cocoa -no-reboot'
      - '{{.GO}} tool go-echo "QEMU (x86_64 + kmazarin) started in background"'
      - '{{.GO}} tool go-echo "Monitor: tcp:127.0.0.1:4445"'
      - '{{.GO}} tool go-echo "Log file: {{.LOG_FILE}}"'

  run-x86_64-diplomat-only:
    desc: "Run x86_64 diplomat (no kmazarin) in QEMU with OVMF (TIMEOUT=N for timeout, default=5s)"
    deps: [esp-x86_64]
    vars:
      TIMEOUT: '{{.TIMEOUT | default "5"}}'
      LOG_FILE: /tmp/diplomat-serial.log
    cmds:
      - task: stop-x86_64
      - '{{.GO}} tool go-rm {{.LOG_FILE}}'
      - '{{.GO}} tool go-echo "Starting diplomat in QEMU (timeout {{.TIMEOUT}}s)..."'
      - task: run-x86_64-diplomat-only-background
      - '{{.GO}} tool go-sleep {{.TIMEOUT}}s'
      - task: stop-x86_64
      - '{{.GO}} tool go-sleep 0.3'
      - '{{.GO}} tool go-echo'
      - '{{.GO}} tool go-echo "=== Diplomat Serial Output ==="'
      - '{{.GO}} tool safe-serial-read {{.LOG_FILE}}'
      - '{{.GO}} tool go-echo'
      - '{{.GO}} tool go-echo "Log file: {{.LOG_FILE}}"'

  run-x86_64-diplomat-only-background:
    desc: Start QEMU with diplomat in background (internal task)
    internal: true
    vars:
      LOG_FILE: /tmp/diplomat-serial.log
      FW_CODE: '{{if ne .OVMF ""}}{{.OVMF}}{{else}}{{dir .QEMU_X86_64}}/../share/qemu/edk2-x86_64-code.fd{{end}}'
    cmds:
      - '{{.GO}} tool go-start {{.QEMU_X86_64}} -machine q35,accel=tcg -cpu max -m 8G -drive if=pflash,format=raw,readonly=on,file={{.FW_CODE}} -drive file={{.ESP_IMAGE}},format=raw,if=ide -boot c -serial file:{{.LOG_FILE}} -monitor tcp:127.0.0.1:4445,server,nowait -display none -no-reboot'
      - '{{.GO}} tool go-echo "QEMU (x86_64) started in background"'
      - '{{.GO}} tool go-echo "Monitor: tcp:127.0.0.1:4445"'
      - '{{.GO}} tool go-echo "Log file: {{.LOG_FILE}}"'

  run-riscv64:
    desc: "Run RISC-V diplomat+kmazarin in QEMU via OpenSBI -kernel (TIMEOUT=N for timeout, default=5s)"
    deps: [diplomat-riscv64, disk-riscv64]
    vars:
      TIMEOUT: '{{.TIMEOUT | default "5"}}'
      LOG_FILE: /tmp/diplomat-riscv64-serial.log
    cmds:
      - task: stop-riscv64
      - '{{.GO}} tool go-rm {{.LOG_FILE}}'
      - '{{.GO}} tool go-echo "Starting RISC-V diplomat+kmazarin in QEMU (timeout {{.TIMEOUT}}s)..."'
      - task: run-riscv64-background
      - '{{.GO}} tool go-sleep {{.TIMEOUT}}s'
      - task: stop-riscv64
      - '{{.GO}} tool go-sleep 0.3'
      - '{{.GO}} tool go-echo'
      - '{{.GO}} tool go-echo "=== Diplomat RISC-V 64-bit Serial Output ==="'
      - '{{.GO}} tool safe-serial-read {{.LOG_FILE}}'
      - '{{.GO}} tool go-echo'
      - '{{.GO}} tool go-echo "Log file: {{.LOG_FILE}}"'

  run-riscv64-background:
    desc: Start QEMU with RISC-V diplomat via OpenSBI -kernel in background (internal task)
    internal: true
    vars:
      LOG_FILE: /tmp/diplomat-riscv64-serial.log
      # VIRTIO_TRANSPORT options: "pci" (default) or "mmio" (legacy RISC-V fallback)
      VIRTIO_TRANSPORT: '{{.VIRTIO_TRANSPORT | default "pci"}}'
    cmds:
      - |
        {{if eq .VIRTIO_TRANSPORT "mmio"}}
        {{.GO}} tool go-start {{.QEMU_RISCV64}} -M virt -m {{.QEMU_RAM}} -rtc base=utc,clock=host -bios default -kernel {{.DIPLOMAT_RISCV64_ELF}} -drive file={{.DISK_RISCV64_IMAGE}},format=raw,if=none,id=drive-virtio-disk0 -device virtio-blk-device,drive=drive-virtio-disk0 -device virtio-gpu-pci -device virtio-keyboard-pci -device virtio-mouse-pci -device virtio-rng-pci -serial file:{{.LOG_FILE}} -monitor tcp:127.0.0.1:4447,server,nowait -display {{.DISPLAY}} -no-reboot -global virtio-mmio.force-legacy=false
        {{else}}
        {{.GO}} tool go-start {{.QEMU_RISCV64}} -M virt -m {{.QEMU_RAM}} -rtc base=utc,clock=host -bios default -kernel {{.DIPLOMAT_RISCV64_ELF}} -drive file={{.DISK_RISCV64_IMAGE}},format=raw,if=none,id=boot-mmio,readonly=on -device virtio-blk-device,drive=boot-mmio -drive file={{.DISK_RISCV64_IMAGE}},format=raw,if=none,id=drive-virtio-disk0,file.locking=off -device virtio-blk-pci,drive=drive-virtio-disk0 -device virtio-gpu-pci -device virtio-keyboard-pci -device virtio-mouse-pci -device virtio-rng-pci -serial file:{{.LOG_FILE}} -monitor tcp:127.0.0.1:4447,server,nowait -display {{.DISPLAY}} -no-reboot -global virtio-mmio.force-legacy=false
        {{end}}
      - '{{.GO}} tool go-echo "QEMU (RISC-V diplomat via OpenSBI, VirtIO {{.VIRTIO_TRANSPORT}}) started in background"'
      - '{{.GO}} tool go-echo "Monitor: tcp:127.0.0.1:4447"'
      - '{{.GO}} tool go-echo "Log file: {{.LOG_FILE}}"'

  # ===========================================================================
  # Direct Kernel Boot (RISC-V) - Bypass UEFI
  # ===========================================================================

  run-riscv64-direct:
    desc: "Run RISC-V kmazarin directly with OpenSBI (no UEFI, TIMEOUT=N for timeout, default=5s)"
    deps: [kmazarin-riscv64, disk-arm64]
    vars:
      TIMEOUT: '{{.TIMEOUT | default "5"}}'
      LOG_FILE: /tmp/kmazarin-riscv64-serial.log
    cmds:
      - task: stop-riscv64-direct
      - '{{.GO}} tool go-rm {{.LOG_FILE}}'
      - '{{.GO}} tool go-echo "Starting RISC-V kmazarin with direct kernel boot (timeout {{.TIMEOUT}}s)..."'
      - task: run-riscv64-direct-background
      - '{{.GO}} tool go-sleep {{.TIMEOUT}}s'
      - task: stop-riscv64-direct
      - '{{.GO}} tool go-sleep 0.3'
      - '{{.GO}} tool go-echo'
      - '{{.GO}} tool go-echo "=== RISC-V Kmazarin Serial Output ==="'
      - '{{.GO}} tool safe-serial-read {{.LOG_FILE}}'
      - '{{.GO}} tool go-echo'
      - '{{.GO}} tool go-echo "Log file: {{.LOG_FILE}}"'

  run-riscv64-direct-background:
    desc: Start QEMU with direct RISC-V kernel boot in background (internal task)
    internal: true
    vars:
      LOG_FILE: /tmp/kmazarin-riscv64-serial.log
      OPENSBI: '{{dir .QEMU_RISCV64}}/../share/qemu/opensbi-riscv64-generic-fw_dynamic.bin'
    cmds:
      - '{{.GO}} tool go-start {{.QEMU_RISCV64}} -M virt -cpu rv64 -m 2G -bios {{.OPENSBI}} -kernel {{.KMAZARIN_RISCV64_ELF}} -drive if=none,format=raw,readonly=on,file={{.DISK_IMAGE}},id=flock0 -device virtio-blk-pci,drive=flock0,bus=pcie.0 -device virtio-gpu-pci -device virtio-keyboard-pci -device virtio-mouse-pci -device virtio-rng-pci -serial file:{{.LOG_FILE}} -monitor tcp:127.0.0.1:4448,server,nowait -display {{.DISPLAY}} -no-reboot'
      - '{{.GO}} tool go-echo "QEMU (RISC-V direct kernel boot) started in background"'
      - '{{.GO}} tool go-echo "Monitor: tcp:127.0.0.1:4448"'
      - '{{.GO}} tool go-echo "Log file: {{.LOG_FILE}}"'

  # ===========================================================================
  # Stop Tasks
  # ===========================================================================

  stop-x86_64:
    desc: Stop x86_64 QEMU instance
    cmds:
      - cmd: '{{.GO}} tool go-nc -w 1s -c quit 127.0.0.1 4445'
        ignore_error: true
      - '{{.GO}} tool go-sleep 0.5'

  stop-arm64:
    desc: Stop ARM64 QEMU instance
    cmds:
      - cmd: '{{.GO}} tool go-nc -w 1s -c quit 127.0.0.1 4446'
        ignore_error: true
      - '{{.GO}} tool go-sleep 0.5'

  stop-riscv64:
    desc: Stop RISC-V diplomat QEMU instance
    cmds:
      - cmd: '{{.GO}} tool go-nc -w 1s -c quit 127.0.0.1 4447'
        ignore_error: true
      - '{{.GO}} tool go-sleep 0.5'

  stop-riscv64-direct:
    desc: Stop RISC-V direct kernel boot QEMU instance
    cmds:
      - cmd: '{{.GO}} tool go-nc -w 1s -c quit 127.0.0.1 4448'
        ignore_error: true
      - '{{.GO}} tool go-sleep 0.5'

  stop:
    desc: Stop all running QEMU instances
    cmds:
      # Send quit command to QEMU monitor if it's listening
      - cmd: '{{.GO}} tool go-nc -w 1s -c quit 127.0.0.1 4444'
        ignore_error: true
      - '{{.GO}} tool go-sleep 0.5'

  # ===========================================================================
  # Utility Tasks
  # ===========================================================================

  qemu-console:
    desc: "Send command to QEMU monitor (CMD='info registers' or other QEMU command)"
    vars:
      CMD: '{{.CMD | default "info registers"}}'
    cmds:
      - '{{.GO}} tool go-nc -c "{{.CMD}}" 127.0.0.1 4444'

  show:
    desc: "Show serial output using safe-serial-read with pagination"
    cmds:
      - '{{.GO}} tool safe-serial-read -p'

  show-debug:
    desc: "Show last N lines of debug log (N=100 default)"
    vars:
      N: '{{.N | default "100"}}'
    cmds:
      - '{{.GO}} tool go-tail -n {{.N}} /tmp/qemu-debug.log'

  test:
    desc: Run Go tests
    deps: [check-env]
    cmds:
      - '{{.GO}} tool go-echo "Running tests..."'
      - '{{.GO}} test -v ./shared/...'

  clean:
    desc: Remove build artifacts
    cmds:
      - '{{.GO}} tool go-echo "Cleaning build artifacts..."'
      - '{{.GO}} tool go-rm -r {{.BUILD_DIR}}'
      - '{{.GO}} tool go-echo "Cleaned."'

  # ===========================================================================
  # Default Target
  # ===========================================================================

  all:
    desc: Build diplomat + kmazarin for all architectures (x86_64, ARM64, RISC-V)
    deps: [esp-x86_64-kmazarin, esp-arm64, diplomat-riscv64, disk-riscv64]

  default:
    desc: Build diplomat + kmazarin for ARM64 (default target)
    deps: [esp-arm64, disk-arm64]
