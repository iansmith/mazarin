# Taskfile for mazzy - Go Native Toolchain Build (Shell-Free)
# Builds diplomat UEFI bootloader + kmazarin kernel for ARM64, x86_64, and RISC-V
#
# Usage:
#   task                          # Build diplomat + kmazarin for ARM64 (default)
#   task run                      # Build and run ARM64 diplomat+kmazarin in QEMU
#   task run-x86_64               # Build and run x86_64 diplomat+kmazarin in QEMU
#   task run-riscv64              # Build and run RISC-V diplomat+kmazarin in QEMU
#   task kmazarin-arm64           # Build kmazarin kernel (ARM64)
#   task kmazarin-x86_64          # Build kmazarin kernel (x86_64)
#   task kmazarin-riscv64         # Build kmazarin kernel (RISC-V)
#   task disk-arm64               # Create FAT32 disk image (ARM64 userspace)
#   task disk-x86_64              # Create FAT32 disk image (x86_64 userspace)
#   task disk-riscv64             # Create FAT32 disk image (RISC-V userspace)
#   task clean                    # Remove build artifacts
#
# Environment:
#   GO=/path/to/go                        # Go compiler (>= 1.24)
#   QEMU=/path/to/qemu-system-aarch64     # QEMU ARM64 (>= 10.2)
#   QEMU_X86_64=/path/to/qemu-system-x86_64  # QEMU x86_64 for diplomat
#   QEMU_RISCV64=/path/to/qemu-system-riscv64  # QEMU RISC-V for diplomat
#   OVMF=/path/to/edk2-x86_64-code.fd     # OVMF firmware for diplomat
#   GOTOOLCHAIN=auto                      # Required
#   DEBUG=1                               # Optional: disable optimizations

version: '3'

vars:
  # Environment variables (shell-free using Go templates)
  GO: '{{env "GO" | default "go"}}'
  QEMU: '{{env "QEMU" | default "qemu-system-aarch64"}}'
  QEMU_X86_64: '{{env "QEMU_X86_64" | default "qemu-system-x86_64"}}'
  QEMU_RISCV64: '{{env "QEMU_RISCV64" | default "qemu-system-riscv64"}}'
  OVMF: '{{env "OVMF" | default ""}}'
  DEBUG: '{{env "DEBUG" | default ""}}'

  # Build configuration (prefixed to avoid conflicts with Go env vars)
  TARGET_GOARCH: arm64
  TARGET_GOOS: linux
  BUILD_DIR: build

  # QEMU display: cocoa on macOS, sdl everywhere else
  DISPLAY: '{{if eq OS "darwin"}}cocoa{{else}}sdl{{end}}'

  # QEMU RAM size — override with QEMU_RAM=512M or QEMU_RAM=4G to test different sizes
  QEMU_RAM: '{{env "QEMU_RAM" | default "2G"}}'

  # Kmazarin load address - must match shared/constants.KmazarinLoadAddr
  # If the constant changes, check-env will fail with a clear error message.
  KMAZARIN_LOAD_ADDR: "0x43800000"

  # Debug build: disable optimizations and inlining
  # Usage: DEBUG=1 task kmazarin-arm64
  GCFLAGS: '{{if eq .DEBUG "1"}}-gcflags=all=-N -l{{end}}'

  # Output files
  KMAZARIN_ELF: '{{.BUILD_DIR}}/kmazarin.elf'
  KMAZARIN_OVERLAY_JSON: '{{.BUILD_DIR}}/kmazarin-overlay.json'
  USERSPACE_OVERLAY_JSON: '{{.BUILD_DIR}}/userspace-overlay.json'
  SIEVETEST_ELF: '{{.BUILD_DIR}}/sievetest.elf'

  # .maz program build artifacts (per-architecture: thin overlay, maz overlay, manifest)
  THIN_OVERLAY_DIR: '{{.BUILD_DIR}}/thin-overlay'
  THIN_OVERLAY_JSON: '{{.BUILD_DIR}}/thin-overlay.json'
  THIN_MANIFEST: '{{.BUILD_DIR}}/thin-stubs.manifest'
  MAZ_OVERLAY_JSON: '{{.BUILD_DIR}}/maz-overlay.json'
  HELLOWORLD_MAZ: '{{.BUILD_DIR}}/helloworld.maz'
  FS_MAZ: '{{.BUILD_DIR}}/fs.maz'
  THIN_OVERLAY_AMD64_DIR: '{{.BUILD_DIR}}/thin-overlay-amd64'
  THIN_OVERLAY_AMD64_JSON: '{{.BUILD_DIR}}/thin-overlay-amd64.json'
  THIN_MANIFEST_AMD64: '{{.BUILD_DIR}}/thin-stubs-amd64.manifest'
  MAZ_OVERLAY_AMD64_JSON: '{{.BUILD_DIR}}/maz-overlay-amd64.json'
  FS_MAZ_AMD64: '{{.BUILD_DIR}}/fs-amd64.maz'
  DAPOPE_ELF: '{{.BUILD_DIR}}/dapope.elf'
  STDIO_ELF: '{{.BUILD_DIR}}/stdio.elf'
  DISKPRIEST_ELF: '{{.BUILD_DIR}}/disk.elf'
  DISK_IMAGE: '{{.BUILD_DIR}}/disk.img'

  # x86_64 userspace programs
  DAPOPE_AMD64_ELF: '{{.BUILD_DIR}}/dapope-amd64.elf'
  STDIO_AMD64_ELF: '{{.BUILD_DIR}}/stdio-amd64.elf'
  DISKPRIEST_AMD64_ELF: '{{.BUILD_DIR}}/disk-amd64.elf'
  DISK_AMD64_IMAGE: '{{.BUILD_DIR}}/disk-amd64.img'

  # RISC-V 64-bit userspace programs
  DAPOPE_RISCV64_ELF: '{{.BUILD_DIR}}/dapope-riscv64.elf'
  STDIO_RISCV64_ELF: '{{.BUILD_DIR}}/stdio-riscv64.elf'
  DISKPRIEST_RISCV64_ELF: '{{.BUILD_DIR}}/disk-riscv64.elf'
  FS_MZR_RISCV64: '{{.BUILD_DIR}}/fs-riscv64.mzr'
  DISK_RISCV64_IMAGE: '{{.BUILD_DIR}}/disk-riscv64.img'

  # Diplomat (x86_64 UEFI bootloader) output files
  DIPLOMAT_EXE: '{{.BUILD_DIR}}/diplomat.exe'
  DIPLOMAT_EFI: '{{.BUILD_DIR}}/diplomat.efi'
  ESP_IMAGE: '{{.BUILD_DIR}}/esp.img'

  # Diplomat ARM64 UEFI
  DIPLOMAT_ARM64_EFI: '{{.BUILD_DIR}}/diplomat-arm64.efi'
  ESP_ARM64_IMAGE: '{{.BUILD_DIR}}/esp-arm64.img'
  OVMF_ARM64: '{{env "OVMF_ARM64" | default ""}}'

  # Diplomat RISC-V 64-bit (ELF, loaded via -kernel — UEFI firmware broken on RISC-V)
  DIPLOMAT_RISCV64_ELF: '{{.BUILD_DIR}}/diplomat-riscv64.elf'

  # Kmazarin AMD64 (for diplomat x86_64 boot)
  KMAZARIN_AMD64_ELF: '{{.BUILD_DIR}}/kmazarin-amd64.elf'
  KMAZARIN_AMD64_OVERLAY_JSON: '{{.BUILD_DIR}}/kmazarin-amd64-overlay.json'

  # Kmazarin RISC-V 64-bit (for diplomat riscv64 boot)
  KMAZARIN_RISCV64_ELF: '{{.BUILD_DIR}}/kmazarin-riscv64.elf'
  KMAZARIN_RISCV64_OVERLAY_JSON: '{{.BUILD_DIR}}/kmazarin-riscv64-overlay.json'

  # Runtime patches directory
  RUNTIME_PATCHES_DIR: runtime-patches
  USERSPACE_OVERLAY_DIR: mazarin/overlay/userspace
  MAZ_EXIT_OVERLAY_DIR: mazarin/overlay/maz
  MAZ_EXIT_OVERLAY_JSON: '{{.BUILD_DIR}}/maz-exit-overlay.json'

  # Priest overlay — adds //go:noinline + keep-alive to prevent DCE of runtime functions
  # Per-architecture because sigctxt methods differ (ARM64: r0-r29, x86_64: rax/rbx, RISC-V: different)
  PRIEST_OVERLAY_DIR: '{{.BUILD_DIR}}/priest-overlay'
  PRIEST_OVERLAY_JSON: '{{.BUILD_DIR}}/priest-overlay.json'
  MERGED_PRIEST_OVERLAY_JSON: '{{.BUILD_DIR}}/merged-priest-overlay.json'
  PRIEST_OVERLAY_AMD64_DIR: '{{.BUILD_DIR}}/priest-overlay-amd64'
  PRIEST_OVERLAY_AMD64_JSON: '{{.BUILD_DIR}}/priest-overlay-amd64.json'
  MERGED_PRIEST_OVERLAY_AMD64_JSON: '{{.BUILD_DIR}}/merged-priest-overlay-amd64.json'
  PRIEST_OVERLAY_RISCV64_DIR: '{{.BUILD_DIR}}/priest-overlay-riscv64'
  PRIEST_OVERLAY_RISCV64_JSON: '{{.BUILD_DIR}}/priest-overlay-riscv64.json'
  MERGED_PRIEST_OVERLAY_RISCV64_JSON: '{{.BUILD_DIR}}/merged-priest-overlay-riscv64.json'

tasks:
  # ===========================================================================
  # Environment and Version Checks
  # ===========================================================================

  check-env:
    run: once
    desc: Verify GO, QEMU, GOTOOLCHAIN, and tool versions
    cmds:
      # Check GOTOOLCHAIN
      - '{{.GO}} tool go-env -check GOTOOLCHAIN=auto -msg "GOTOOLCHAIN must be ''auto''. Run: export GOTOOLCHAIN=auto"'
      # Check Go version >= 1.24
      - '{{.GO}} tool check-version -go {{.GO}} -min 1.24'
      # Check QEMU version >= 10.2
      - '{{.GO}} tool check-version -qemu {{.QEMU}} -min 10.2'
      # Verify KMAZARIN_LOAD_ADDR matches the constant
      - '{{.GO}} tool print-kmazarin-addr -check {{.KMAZARIN_LOAD_ADDR}}'
      - '{{.GO}} tool go-echo "Environment check passed"'
    silent: true

  # ===========================================================================
  # Build Directory
  # ===========================================================================

  build-dir:
    run: once
    desc: Create build directory
    cmds:
      - '{{.GO}} tool go-mkdir {{.BUILD_DIR}}'
    status:
      - '{{.GO}} tool go-test -d {{.BUILD_DIR}}'

  # ===========================================================================
  # Overlay Generation
  # ===========================================================================

  kmazarin-arm64-overlay:
    run: once
    method: checksum
    desc: Generate runtime overlay JSON for kmazarin (ARM64)
    deps: [build-dir]
    sources:
      - '{{.RUNTIME_PATCHES_DIR}}/cgo_mmap.go'
      - '{{.RUNTIME_PATCHES_DIR}}/malloc.go'
      - '{{.RUNTIME_PATCHES_DIR}}/mcache.go'
      - '{{.RUNTIME_PATCHES_DIR}}/os_linux_arm64.go'
      - '{{.RUNTIME_PATCHES_DIR}}/preempt.go'
      - '{{.RUNTIME_PATCHES_DIR}}/sys_linux_arm64.s'
      - '{{.RUNTIME_PATCHES_DIR}}/tagptr_64bit.go'
      - '{{.RUNTIME_PATCHES_DIR}}/traceback.go'
      - '{{.RUNTIME_PATCHES_DIR}}/panic.go'
      - '{{.RUNTIME_PATCHES_DIR}}/syscall/syscall_linux.go'
    generates:
      - '{{.KMAZARIN_OVERLAY_JSON}}'
    cmds:
      - '{{.GO}} tool gen-overlay -type kmazarin -patches {{.RUNTIME_PATCHES_DIR}} -o {{.KMAZARIN_OVERLAY_JSON}}'

  kmazarin-x86_64-overlay:
    run: once
    method: checksum
    desc: Generate runtime overlay JSON for kmazarin (x86_64)
    deps: [build-dir]
    sources:
      - '{{.RUNTIME_PATCHES_DIR}}/asm_linux_amd64.s'
      - '{{.RUNTIME_PATCHES_DIR}}/cgo_mmap.go'
      - '{{.RUNTIME_PATCHES_DIR}}/fds_unix.go'
      - '{{.RUNTIME_PATCHES_DIR}}/malloc.go'
      - '{{.RUNTIME_PATCHES_DIR}}/mcache.go'
      - '{{.RUNTIME_PATCHES_DIR}}/os_linux_noauxv.go'
      - '{{.RUNTIME_PATCHES_DIR}}/panic.go'
      - '{{.RUNTIME_PATCHES_DIR}}/preempt.go'
      - '{{.RUNTIME_PATCHES_DIR}}/sys_linux_amd64.s'
      - '{{.RUNTIME_PATCHES_DIR}}/tagptr_64bit.go'
      - '{{.RUNTIME_PATCHES_DIR}}/traceback.go'
      - '{{.RUNTIME_PATCHES_DIR}}/syscall/syscall_linux.go'
    generates:
      - '{{.KMAZARIN_AMD64_OVERLAY_JSON}}'
    cmds:
      - '{{.GO}} tool gen-overlay -type kmazarin-amd64 -patches {{.RUNTIME_PATCHES_DIR}} -o {{.KMAZARIN_AMD64_OVERLAY_JSON}}'

  kmazarin-riscv64-overlay:
    run: once
    method: checksum
    desc: Generate runtime overlay JSON for kmazarin (RISC-V 64-bit)
    deps: [build-dir]
    sources:
      - '{{.RUNTIME_PATCHES_DIR}}/cgo_mmap.go'
      - '{{.RUNTIME_PATCHES_DIR}}/malloc.go'
      - '{{.RUNTIME_PATCHES_DIR}}/mcache.go'
      - '{{.RUNTIME_PATCHES_DIR}}/os_linux_noauxv.go'
      - '{{.RUNTIME_PATCHES_DIR}}/preempt.go'
      - '{{.RUNTIME_PATCHES_DIR}}/sys_linux_riscv64.s'
      - '{{.RUNTIME_PATCHES_DIR}}/tagptr_64bit.go'
      - '{{.RUNTIME_PATCHES_DIR}}/syscall/syscall_linux.go'
    generates:
      - '{{.KMAZARIN_RISCV64_OVERLAY_JSON}}'
    cmds:
      - '{{.GO}} tool gen-overlay -type kmazarin-riscv64 -patches {{.RUNTIME_PATCHES_DIR}} -o {{.KMAZARIN_RISCV64_OVERLAY_JSON}}'

  userspace-overlay:
    run: once
    method: checksum
    desc: Generate runtime overlay JSON for userspace programs
    deps: [build-dir]
    sources:
      - '{{.USERSPACE_OVERLAY_DIR}}/syscall_linux.go'
      - '{{.USERSPACE_OVERLAY_DIR}}/asm_linux_amd64.s'
      - '{{.USERSPACE_OVERLAY_DIR}}/asm_linux_arm64.s'
      - '{{.USERSPACE_OVERLAY_DIR}}/asm_linux_riscv64.s'
      - '{{.USERSPACE_OVERLAY_DIR}}/runtime/cgo_mmap.go'
      - '{{.USERSPACE_OVERLAY_DIR}}/runtime/lock_spinbit.go'
      - '{{.USERSPACE_OVERLAY_DIR}}/runtime/maz_moduledata.go'
    generates:
      - '{{.USERSPACE_OVERLAY_JSON}}'
    cmds:
      - '{{.GO}} tool gen-overlay -type userspace -patches {{.USERSPACE_OVERLAY_DIR}} -o {{.USERSPACE_OVERLAY_JSON}}'

  priest-overlay:
    run: once
    method: checksum
    desc: Generate priest overlay for ARM64 (//go:noinline + keep-alive for all stubbable runtime functions)
    deps: [build-dir]
    sources:
      - 'cmd/gen-ast-stubs/**/*.go'
    generates:
      - '{{.PRIEST_OVERLAY_JSON}}'
    cmds:
      - '{{.GO}} tool go-echo "Generating priest overlay for ARM64 (//go:noinline + keep-alive)..."'
      - 'TARGET_GOARCH=arm64 TARGET_GOOS=linux {{.GO}} tool gen-ast-stubs -go={{.GO}} -runtime-from-go -packages=runtime,syscall -output={{.PRIEST_OVERLAY_DIR}} -overlay={{.PRIEST_OVERLAY_JSON}} -mode=priest'

  priest-overlay-amd64:
    run: once
    method: checksum
    desc: Generate priest overlay for x86_64 (//go:noinline + keep-alive for all stubbable runtime functions)
    deps: [build-dir]
    sources:
      - 'cmd/gen-ast-stubs/**/*.go'
    generates:
      - '{{.PRIEST_OVERLAY_AMD64_JSON}}'
    cmds:
      - '{{.GO}} tool go-echo "Generating priest overlay for x86_64 (//go:noinline + keep-alive)..."'
      - 'TARGET_GOARCH=amd64 TARGET_GOOS=linux {{.GO}} tool gen-ast-stubs -go={{.GO}} -runtime-from-go -packages=runtime,syscall -output={{.PRIEST_OVERLAY_AMD64_DIR}} -overlay={{.PRIEST_OVERLAY_AMD64_JSON}} -mode=priest'

  priest-overlay-riscv64:
    run: once
    method: checksum
    desc: Generate priest overlay for RISC-V (//go:noinline + keep-alive for all stubbable runtime functions)
    deps: [build-dir]
    sources:
      - 'cmd/gen-ast-stubs/**/*.go'
    generates:
      - '{{.PRIEST_OVERLAY_RISCV64_JSON}}'
    cmds:
      - '{{.GO}} tool go-echo "Generating priest overlay for RISC-V (//go:noinline + keep-alive)..."'
      - 'TARGET_GOARCH=riscv64 TARGET_GOOS=linux {{.GO}} tool gen-ast-stubs -go={{.GO}} -runtime-from-go -packages=runtime,syscall -output={{.PRIEST_OVERLAY_RISCV64_DIR}} -overlay={{.PRIEST_OVERLAY_RISCV64_JSON}} -mode=priest'

  merged-priest-overlay:
    run: once
    method: checksum
    desc: Merge priest + userspace overlays for ARM64 disk priest builds
    deps: [priest-overlay, userspace-overlay]
    sources:
      - '{{.PRIEST_OVERLAY_JSON}}'
      - '{{.USERSPACE_OVERLAY_JSON}}'
    generates:
      - '{{.MERGED_PRIEST_OVERLAY_JSON}}'
    cmds:
      - '{{.GO}} tool go-echo "Merging priest + userspace overlays (ARM64)..."'
      - '{{.GO}} tool gen-overlay -type merge -base {{.PRIEST_OVERLAY_JSON}} -extra {{.USERSPACE_OVERLAY_JSON}} -o {{.MERGED_PRIEST_OVERLAY_JSON}}'

  merged-priest-overlay-amd64:
    run: once
    method: checksum
    desc: Merge priest + userspace overlays for x86_64 disk priest builds
    deps: [priest-overlay-amd64, userspace-overlay]
    sources:
      - '{{.PRIEST_OVERLAY_AMD64_JSON}}'
      - '{{.USERSPACE_OVERLAY_JSON}}'
    generates:
      - '{{.MERGED_PRIEST_OVERLAY_AMD64_JSON}}'
    cmds:
      - '{{.GO}} tool go-echo "Merging priest + userspace overlays (x86_64)..."'
      - '{{.GO}} tool gen-overlay -type merge -base {{.PRIEST_OVERLAY_AMD64_JSON}} -extra {{.USERSPACE_OVERLAY_JSON}} -o {{.MERGED_PRIEST_OVERLAY_AMD64_JSON}}'

  merged-priest-overlay-riscv64:
    run: once
    method: checksum
    desc: Merge priest + userspace overlays for RISC-V disk priest builds
    deps: [priest-overlay-riscv64, userspace-overlay]
    sources:
      - '{{.PRIEST_OVERLAY_RISCV64_JSON}}'
      - '{{.USERSPACE_OVERLAY_JSON}}'
    generates:
      - '{{.MERGED_PRIEST_OVERLAY_RISCV64_JSON}}'
    cmds:
      - '{{.GO}} tool go-echo "Merging priest + userspace overlays (RISC-V)..."'
      - '{{.GO}} tool gen-overlay -type merge -base {{.PRIEST_OVERLAY_RISCV64_JSON}} -extra {{.USERSPACE_OVERLAY_JSON}} -o {{.MERGED_PRIEST_OVERLAY_RISCV64_JSON}}'

  # ===========================================================================
  # Boot Image Conversion
  # ===========================================================================

  convert-boot-image:
    run: once
    desc: Copy boot image binary for disk
    deps: [build-dir]
    sources:
      - assets/boot-mazarin.bin
    generates:
      - '{{.BUILD_DIR}}/boot-image.bin'
    cmds:
      - '{{.GO}} tool go-cat -o {{.BUILD_DIR}}/boot-image.bin assets/boot-mazarin.bin'

  # ===========================================================================
  # Kmazarin Kernel Build
  # ===========================================================================

  kmazarin-arm64:
    desc: Build kmazarin kernel (ARM64)
    run: once
    deps: [check-env, kmazarin-arm64-overlay]
    sources:
      - 'kmazarin/**/*.go'
      - 'kmazarin/**/*.s'
      - 'shared/**/*.go'
      - '{{.KMAZARIN_OVERLAY_JSON}}'
      # Overlay source files — Go's build cache doesn't track overlay content,
      # so we list them here to ensure Taskfile detects changes.
      - '{{.RUNTIME_PATCHES_DIR}}/*.go'
      - '{{.RUNTIME_PATCHES_DIR}}/*.s'
      - '{{.RUNTIME_PATCHES_DIR}}/syscall/*.go'
    generates:
      - '{{.KMAZARIN_ELF}}'
    cmds:
      - '{{.GO}} tool go-echo "Building kmazarin kernel (static Go binary at {{.KMAZARIN_LOAD_ADDR}})..."'
      - 'CGO_ENABLED=0 GOARCH={{.TARGET_GOARCH}} GOOS={{.TARGET_GOOS}} {{.GO}} build -overlay={{.ROOT_DIR}}/{{.KMAZARIN_OVERLAY_JSON}} {{.GCFLAGS}} -ldflags="-checklinkname=0 -T {{.KMAZARIN_LOAD_ADDR}}" -o {{.KMAZARIN_ELF}} ./kmazarin/kmazarin'
      - '{{.GO}} tool go-echo "Fixing kmazarin ELF for QEMU compatibility..."'
      - '{{.GO}} tool fix-go-elf {{.KMAZARIN_ELF}}'
      - '{{.GO}} tool go-echo "Relocating kmazarin to high memory (0xFFFFFFFF41800000)..."'
      - 'cp {{.KMAZARIN_ELF}} {{.KMAZARIN_ELF}}.prereloc'
      - '{{.GO}} tool relocate-kmazarin {{.KMAZARIN_ELF}} {{.KMAZARIN_ELF}}.tmp'
      - '{{.GO}} tool go-mv {{.KMAZARIN_ELF}}.tmp {{.KMAZARIN_ELF}}'
      - '{{.GO}} tool go-echo "Kmazarin kernel built at {{.KMAZARIN_ELF}}"'

  kmazarin-x86_64:
    desc: Build kmazarin kernel (x86_64)
    run: once
    deps: [check-env, kmazarin-x86_64-overlay]
    sources:
      - 'kmazarin/**/*.go'
      - 'kmazarin/**/*.s'
      - 'shared/**/*.go'
      - '{{.KMAZARIN_AMD64_OVERLAY_JSON}}'
      # Overlay source files — Go's build cache doesn't track overlay content
      - '{{.RUNTIME_PATCHES_DIR}}/*.go'
      - '{{.RUNTIME_PATCHES_DIR}}/*.s'
      - '{{.RUNTIME_PATCHES_DIR}}/syscall/*.go'
    generates:
      - '{{.KMAZARIN_AMD64_ELF}}'
    cmds:
      - '{{.GO}} tool go-echo "Building kmazarin kernel for x86_64 (static Go binary at {{.KMAZARIN_LOAD_ADDR}})..."'
      - 'CGO_ENABLED=0 GOARCH=amd64 GOOS=linux {{.GO}} build -overlay={{.ROOT_DIR}}/{{.KMAZARIN_AMD64_OVERLAY_JSON}} {{.GCFLAGS}} -ldflags="-checklinkname=0 -T {{.KMAZARIN_LOAD_ADDR}}" -o {{.KMAZARIN_AMD64_ELF}} ./kmazarin/kmazarin'
      - '{{.GO}} tool go-echo "Fixing kmazarin-amd64 ELF headers..."'
      - '{{.GO}} tool fix-go-elf {{.KMAZARIN_AMD64_ELF}}'
      - '{{.GO}} tool go-echo "Kmazarin x86_64 kernel built at {{.KMAZARIN_AMD64_ELF}} (NOTE: not relocated to high memory yet)"'

  kmazarin-riscv64:
    desc: Build kmazarin kernel (RISC-V 64-bit)
    run: once
    deps: [check-env, kmazarin-riscv64-overlay]
    sources:
      - 'kmazarin/**/*.go'
      - 'kmazarin/**/*.s'
      - 'shared/**/*.go'
      - '{{.KMAZARIN_RISCV64_OVERLAY_JSON}}'
      # Overlay source files — Go's build cache doesn't track overlay content
      - '{{.RUNTIME_PATCHES_DIR}}/*.go'
      - '{{.RUNTIME_PATCHES_DIR}}/*.s'
      - '{{.RUNTIME_PATCHES_DIR}}/syscall/*.go'
    generates:
      - '{{.KMAZARIN_RISCV64_ELF}}'
    cmds:
      - '{{.GO}} tool go-echo "Building kmazarin kernel for RISC-V 64-bit (static Go binary at {{.KMAZARIN_LOAD_ADDR}})..."'
      - 'CGO_ENABLED=0 GOARCH=riscv64 GOOS=linux {{.GO}} build -overlay={{.ROOT_DIR}}/{{.KMAZARIN_RISCV64_OVERLAY_JSON}} {{.GCFLAGS}} -ldflags="-checklinkname=0 -T {{.KMAZARIN_LOAD_ADDR}}" -o {{.KMAZARIN_RISCV64_ELF}} ./kmazarin/kmazarin'
      - '{{.GO}} tool go-echo "Kmazarin RISC-V 64-bit kernel built at {{.KMAZARIN_RISCV64_ELF}}"'

  # ===========================================================================
  # Flock Userspace Programs
  # ===========================================================================

  dapope-arm64:
    desc: Build dapope input event handler priest (ARM64)
    deps: [check-env, merged-priest-overlay]
    sources:
      - 'flock/**/*.go'
      - 'flock/**/*.s'
      - 'mazarin/**/*.go'
      - '{{.MERGED_PRIEST_OVERLAY_JSON}}'
      - '{{.USERSPACE_OVERLAY_DIR}}/**/*'
      - '{{.PRIEST_OVERLAY_DIR}}/**/*'
    generates:
      - '{{.DAPOPE_ELF}}'
    cmds:
      - '{{.GO}} tool go-echo "Building dapope for ARM64..."'
      - 'CGO_ENABLED=0 GOARCH={{.TARGET_GOARCH}} GOOS={{.TARGET_GOOS}} {{.GO}} build -overlay={{.ROOT_DIR}}/{{.MERGED_PRIEST_OVERLAY_JSON}} {{.GCFLAGS}} -o {{.DAPOPE_ELF}} ./flock/cmd/dapope'
      - '{{.GO}} tool go-echo "Dapope ARM64 built at {{.DAPOPE_ELF}}"'

  stdio-arm64:
    desc: Build stdio console priest (ARM64)
    deps: [check-env, userspace-overlay]
    sources:
      - 'flock/**/*.go'
      - 'flock/**/*.s'
      - 'mazarin/**/*.go'
      - '{{.USERSPACE_OVERLAY_JSON}}'
      # Overlay source files — Go's build cache doesn't track overlay content
      - '{{.USERSPACE_OVERLAY_DIR}}/**/*'
    generates:
      - '{{.STDIO_ELF}}'
    cmds:
      - '{{.GO}} tool go-echo "Building stdio for ARM64..."'
