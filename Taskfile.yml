  helloworld-maz:
    desc: Build helloworld.maz (direct SVC, no overlay)
    deps: [check-env, build-dir]
    sources:
      - 'flock/**/*.go'
      - 'flock/**/*.s'
    generates:
      - '{{.HELLOWORLD_MAZ}}'
    cmds:
      - '{{.GO}} tool go-echo "Building helloworld.maz (direct SVC, no overlay)..."'
