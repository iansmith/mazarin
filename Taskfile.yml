      - '{{.GO}} tool go-echo "Running maz-reloc to generate .maz_imports..."'
      - '{{.GO}} tool maz-reloc {{.FS_MAZ_AMD64}} {{.THIN_MANIFEST_AMD64}}'
      - '{{.GO}} tool go-echo "fs.maz (x86_64) ready at {{.FS_MAZ_AMD64}}"'

  fs-mzr-riscv64:
    desc: Build fs.mzr for RISC-V 64-bit — FAT32 filesystem module (fixed-address slot 0)
    deps: [check-env, maz-overlay]
    sources:
      - 'flock/cmd/fat32/**/*.go'
      - 'mazarin/**/*.go'
      - 'shared/fs/fat32/**/*.go'
      - 'shared/ipc/**/*.go'
      - 'shared/blockdev/**/*.go'
      - '{{.MAZ_OVERLAY_JSON}}'
    generates:
      - '{{.FS_MZR_RISCV64}}'
    cmds:
      - '{{.GO}} tool go-echo "Building fs.mzr for RISC-V 64-bit (fixed-address slot 0)..."'
      - 'CGO_ENABLED=0 GOARCH=riscv64 GOOS=linux {{.GO}} build -overlay={{.ROOT_DIR}}/{{.MAZ_OVERLAY_JSON}} -ldflags="-T 0x30000000" {{.GCFLAGS}} -o {{.FS_MZR_RISCV64}} ./flock/cmd/fat32'
      - '{{.GO}} tool go-echo "Fixing negative ELF offsets from -T flag..."'
      - '{{.GO}} tool fix-go-elf -no-bootstrap {{.FS_MZR_RISCV64}}'
      - '{{.GO}} tool go-echo "Running maz-reloc to generate .maz_imports..."'
      - '{{.GO}} tool maz-reloc {{.FS_MZR_RISCV64}} {{.THIN_MANIFEST}}'
      - '{{.GO}} tool go-echo "fs.mzr (RISC-V 64-bit) ready at {{.FS_MZR_RISCV64}}"'

  # ===========================================================================
  # Disk Image
  # ===========================================================================

  disk-arm64:
    desc: Create FAT32 disk image with ARM64 flock binaries and kmazarin kernel
    deps: [dapope-arm64, stdio-arm64, diskpriest-arm64, sievetest, helloworld-maz, fs-maz, kmazarin-arm64, convert-boot-image]
    sources:
      - '{{.DAPOPE_ELF}}'
      - '{{.STDIO_ELF}}'
      - '{{.DISKPRIEST_ELF}}'
      - '{{.SIEVETEST_ELF}}'
      - '{{.HELLOWORLD_MAZ}}'
      - '{{.FS_MAZ}}'
      - '{{.KMAZARIN_ELF}}'
      - '{{.BUILD_DIR}}/boot-image.bin'
      - 'config/kmazarin-arm64.toml'
    generates:
      - '{{.DISK_IMAGE}}'
    cmds:
      - '{{.GO}} tool go-echo "Creating FAT32 disk image (ARM64)..."'
      - '{{.GO}} tool go-mkdir {{.BUILD_DIR}}/disk-staging-arm64'
      - '{{.GO}} tool go-cp config/kmazarin-arm64.toml {{.BUILD_DIR}}/disk-staging-arm64/kmazarin.toml'
      - '{{.GO}} tool mkfat32 -o {{.DISK_IMAGE}} {{.DAPOPE_ELF}} {{.STDIO_ELF}} {{.DISKPRIEST_ELF}} {{.SIEVETEST_ELF}} {{.HELLOWORLD_MAZ}} {{.FS_MAZ}} {{.KMAZARIN_ELF}} {{.BUILD_DIR}}/boot-image.bin {{.BUILD_DIR}}/disk-staging-arm64/kmazarin.toml'
      - '{{.GO}} tool go-echo "Disk image created at {{.DISK_IMAGE}}"'

  disk-x86_64:
    desc: Create FAT32 disk image with x86_64 flock binaries and kmazarin kernel
    deps: [dapope-x86_64, stdio-x86_64, diskpriest-x86_64, fs-maz-amd64, kmazarin-x86_64, convert-boot-image]
    sources:
      - '{{.DAPOPE_AMD64_ELF}}'
      - '{{.STDIO_AMD64_ELF}}'
      - '{{.DISKPRIEST_AMD64_ELF}}'
      - '{{.FS_MAZ_AMD64}}'
      - '{{.KMAZARIN_AMD64_ELF}}'
      - '{{.BUILD_DIR}}/boot-image.bin'
    generates:
      - '{{.DISK_AMD64_IMAGE}}'
    cmds:
      - '{{.GO}} tool go-echo "Creating FAT32 disk image for x86_64..."'
      # Stage amd64 ELFs in a subdirectory so we don't overwrite ARM64 build/dapope.elf
      - '{{.GO}} tool go-mkdir {{.BUILD_DIR}}/disk-staging-amd64'
      - '{{.GO}} tool go-cp {{.DAPOPE_AMD64_ELF}} {{.BUILD_DIR}}/disk-staging-amd64/dapope.elf'
      - '{{.GO}} tool go-cp {{.STDIO_AMD64_ELF}} {{.BUILD_DIR}}/disk-staging-amd64/stdio.elf'
      - '{{.GO}} tool go-cp {{.DISKPRIEST_AMD64_ELF}} {{.BUILD_DIR}}/disk-staging-amd64/disk.elf'
      - '{{.GO}} tool go-cp {{.FS_MAZ_AMD64}} {{.BUILD_DIR}}/disk-staging-amd64/fs.maz'
      - '{{.GO}} tool go-cp config/kmazarin-x86_64.toml {{.BUILD_DIR}}/disk-staging-amd64/kmazarin.toml'
      - '{{.GO}} tool mkfat32 -o {{.DISK_AMD64_IMAGE}} {{.BUILD_DIR}}/disk-staging-amd64/dapope.elf {{.BUILD_DIR}}/disk-staging-amd64/stdio.elf {{.BUILD_DIR}}/disk-staging-amd64/disk.elf {{.BUILD_DIR}}/disk-staging-amd64/fs.maz {{.BUILD_DIR}}/disk-staging-amd64/kmazarin.toml {{.KMAZARIN_AMD64_ELF}} {{.BUILD_DIR}}/boot-image.bin'
      - '{{.GO}} tool go-echo "x86_64 disk image created at {{.DISK_AMD64_IMAGE}}"'

  disk-riscv64:
    desc: Create FAT32 disk image with RISC-V 64-bit flock binaries and kmazarin kernel
    deps: [dapope-riscv64, stdio-riscv64, diskpriest-riscv64, fs-mzr-riscv64, kmazarin-riscv64, convert-boot-image]
    sources:
