    sources:
      - '{{.THIN_OVERLAY_JSON}}'
      - '{{.USERSPACE_OVERLAY_JSON}}'
      - '{{.MAZ_EXIT_OVERLAY_JSON}}'
    generates:
      - '{{.MAZ_OVERLAY_JSON}}'
    cmds:
      - '{{.GO}} tool go-echo "Merging thin + userspace + maz-exit overlays for ARM64 .maz build..."'
      - '{{.GO}} tool gen-overlay -type merge -base {{.THIN_OVERLAY_JSON}} -extra {{.USERSPACE_OVERLAY_JSON}} -o {{.MAZ_OVERLAY_JSON}}'
      - '{{.GO}} tool gen-overlay -type merge -base {{.MAZ_OVERLAY_JSON}} -extra {{.MAZ_EXIT_OVERLAY_JSON}} -o {{.MAZ_OVERLAY_JSON}}'

