  # ===========================================================================
  # .maz Programs (PIE + thin stubs, dynamically linked at load time)
  # ===========================================================================
  # .maz programs are loaded INTO a shepherd's address space, sharing its Go
  # runtime. They are built as PIE with thin runtime stubs (for {} loops)
  # that get patched at load time by the kernel to target the shepherd's real
  # functions. The build pipeline:
  #   1. gen-ast-stubs generates thin overlay (runtime+syscall → for{})
  #   2. Merge thin overlay with userspace overlay (syscall ShepherdSyscallEntry routing)
  #   3. Build as PIE with merged overlay
  #   4. maz-reloc scans binary, generates .maz_imports section

  thin-overlay:
    run: once
    method: checksum
    desc: Generate thin client overlay for ARM64 (runtime + syscall stubs)
    deps: [build-dir]
    sources:
      - cmd/gen-ast-stubs/main.go
    generates:
      - '{{.THIN_OVERLAY_JSON}}'
      - '{{.THIN_MANIFEST}}'
    cmds:
      - '{{.GO}} tool go-echo "Generating thin client overlay for ARM64 (runtime + syscall)..."'
      - 'TARGET_GOARCH=arm64 TARGET_GOOS=linux {{.GO}} tool gen-ast-stubs -go={{.GO}} -runtime-from-go -packages=runtime,syscall -output={{.THIN_OVERLAY_DIR}} -overlay={{.THIN_OVERLAY_JSON}} -manifest={{.THIN_MANIFEST}}'

  thin-overlay-amd64:
    run: once
    method: checksum
    desc: Generate thin client overlay for x86_64 (runtime + syscall stubs)
    deps: [build-dir]
    sources:
      - cmd/gen-ast-stubs/main.go
    generates:
      - '{{.THIN_OVERLAY_AMD64_JSON}}'
      - '{{.THIN_MANIFEST_AMD64}}'
    cmds:
      - '{{.GO}} tool go-echo "Generating thin client overlay for x86_64 (runtime + syscall)..."'
      - 'TARGET_GOARCH=amd64 TARGET_GOOS=linux {{.GO}} tool gen-ast-stubs -go={{.GO}} -runtime-from-go -packages=runtime,syscall -output={{.THIN_OVERLAY_AMD64_DIR}} -overlay={{.THIN_OVERLAY_AMD64_JSON}} -manifest={{.THIN_MANIFEST_AMD64}}'

  maz-exit-overlay:
    run: once
    method: checksum
    desc: Generate maz-specific overlay (os.Exit → panic)
    deps: [build-dir]
    sources:
      - '{{.MAZ_EXIT_OVERLAY_DIR}}/os_proc.go'
    generates:
      - '{{.MAZ_EXIT_OVERLAY_JSON}}'
    cmds:
      - '{{.GO}} tool go-echo "Generating maz-exit overlay (os.Exit → panic)..."'
      - '{{.GO}} tool gen-overlay -type maz-exit -patches {{.MAZ_EXIT_OVERLAY_DIR}} -o {{.MAZ_EXIT_OVERLAY_JSON}}'

