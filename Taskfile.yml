      - '{{.GO}} tool maz-reloc {{.FS_MAZ}} {{.THIN_MANIFEST}}'
      - '{{.GO}} tool go-echo "fs.maz ready at {{.FS_MAZ}}"'

  fs-maz-amd64:
    desc: Build fs.maz — FAT32 filesystem module for x86_64 (PIE + thin stubs)
    deps: [check-env, maz-overlay-amd64]
    sources:
      - 'flock/cmd/fat32/**/*.go'
