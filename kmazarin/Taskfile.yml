version: '3'

tasks:
  # The overlay tasks are deliberately always-run (no sources/generates):
  # the generated JSON embeds absolute GOROOT paths, and a toolchain upgrade
  # changes GOROOT without touching runtime-patches/ — fingerprinting on the
  # patch files alone reused a stale JSON and silently linked the STOCK
  # runtime (MAZ-154). gen-overlay is <1s; downstream kernel targets
  # fingerprint the JSON content, so an unchanged regeneration triggers no
  # rebuild.
  arm64-overlay:
    run: once
    desc: Generate runtime overlay JSON for kmazarin (ARM64)
    deps: [':build-dir']
    cmds:
      - '{{.GO}} tool gen-overlay -type kmazarin -patches {{.RUNTIME_PATCHES_DIR}} -o {{.KMAZARIN_OVERLAY_JSON}}'

  x86_64-overlay:
    run: once
    desc: Generate runtime overlay JSON for kmazarin (x86_64)
    deps: [':build-dir']
    cmds:
      - '{{.GO}} tool gen-overlay -type kmazarin-amd64 -patches {{.RUNTIME_PATCHES_DIR}} -o {{.KMAZARIN_AMD64_OVERLAY_JSON}}'

  arm64:
    desc: Build kmazarin kernel (ARM64)
    run: once
    deps: [':check-env', 'arm64-overlay', ':stage-embedded-fs-arm64', ':stage-kernel-config-arm64']
    sources:
      - '**/*.go'
      - '**/*.s'
      - '**/*.h'
      - '{{.FS_ELF}}'
      - 'config/kernel.arm64.toml'
      - '../shared/**/*.go'
      - '../mazarin/**/*.go'
      - '{{.KMAZARIN_OVERLAY_JSON}}'
      - '{{.RUNTIME_PATCHES_DIR}}/*.go'
      - '{{.RUNTIME_PATCHES_DIR}}/*.s'
      - '{{.RUNTIME_PATCHES_DIR}}/syscall/*.go'
    generates:
      - '{{.KMAZARIN_ELF}}'
    cmds:
      # MAZ-135 guard: every ThreadContext field must be handled by every arm64
      # save/restore site (parity with the amd64 gate). See cmd/frameaudit.
      - '{{.GO}} tool go-echo "Auditing arm64 ThreadContext save/restore consistency (frameaudit)..."'
      - '{{.GO}} tool frameaudit -struct {{.ROOT_DIR}}/kmazarin/kmazarin/thread_context_arm64.go -prefix ThreadContext -go {{.ROOT_DIR}}/kmazarin/kmazarin/save_context_arm64.go -asm {{.ROOT_DIR}}/kmazarin/kmazarin/exceptions_arm64.s -dsl {{.ROOT_DIR}}/kmazarin/kmazarin/frame_dsl_arm64.h -list CTX_RESTORE_TO_FRAME'
      - '{{.GO}} tool go-echo "Building kmazarin kernel (static Go binary at {{.KMAZARIN_LOAD_ADDR}})..."'
      - 'CGO_ENABLED=0 GOARCH={{.TARGET_GOARCH}} GOOS={{.TARGET_GOOS}} {{.GO}} build -tags mazhost -overlay={{.ROOT_DIR}}/{{.KMAZARIN_OVERLAY_JSON}} {{.GCFLAGS}} -ldflags="-checklinkname=0 -T {{.KMAZARIN_LOAD_ADDR}}" -o {{.KMAZARIN_ELF}} ./kmazarin/kmazarin'
      - '{{.GO}} tool go-echo "Fixing kmazarin ELF for QEMU compatibility..."'
      - '{{.GO}} tool fix-go-elf {{.KMAZARIN_ELF}}'
      - '{{.GO}} tool go-echo "Relocating kmazarin to high memory (0xFFFFFFFF41800000)..."'
      - 'cp {{.KMAZARIN_ELF}} {{.KMAZARIN_ELF}}.prereloc'
      - '{{.GO}} tool relocate-kmazarin {{.KMAZARIN_ELF}} {{.KMAZARIN_ELF}}.tmp'
      - '{{.GO}} tool go-mv {{.KMAZARIN_ELF}}.tmp {{.KMAZARIN_ELF}}'
      - '{{.GO}} tool go-echo "Kmazarin kernel built at {{.KMAZARIN_ELF}}"'

  x86_64:
    desc: Build kmazarin kernel (x86_64)
    run: once
    deps: [':check-env', 'x86_64-overlay', ':stage-embedded-fs-x86_64', ':stage-kernel-config-x86_64']
    sources:
      - '**/*.go'
      - '**/*.s'
      - '**/*.h'
      - '{{.FS_AMD64_ELF}}'
      - 'config/kernel.amd64.toml'
      - '../shared/**/*.go'
      - '../mazarin/**/*.go'
      - '{{.KMAZARIN_AMD64_OVERLAY_JSON}}'
      - '{{.RUNTIME_PATCHES_DIR}}/*.go'
      - '{{.RUNTIME_PATCHES_DIR}}/*.s'
      - '{{.RUNTIME_PATCHES_DIR}}/syscall/*.go'
    generates:
      - '{{.KMAZARIN_AMD64_ELF}}'
    cmds:
      # MAZ-135 guard: every ThreadContext field must be handled by every amd64
      # save/restore site. Fails the build if a field is added to the struct but
      # missed by a save func or a FRAME-SAVE/RESTORE asm region. See cmd/frameaudit.
      - '{{.GO}} tool go-echo "Auditing amd64 ThreadContext save/restore consistency (frameaudit)..."'
      - '{{.GO}} tool frameaudit -struct {{.ROOT_DIR}}/kmazarin/kmazarin/thread_context_amd64.go -prefix ThreadContext -go {{.ROOT_DIR}}/kmazarin/kmazarin/save_context_amd64.go -asm {{.ROOT_DIR}}/kmazarin/kmazarin/abi_stubs_amd64.s,{{.ROOT_DIR}}/kmazarin/kmazarin/exceptions_amd64.s -dsl {{.ROOT_DIR}}/kmazarin/kmazarin/frame_dsl_amd64.h -list CTX_GPRS'
      - '{{.GO}} tool go-echo "Building kmazarin kernel for x86_64 (static Go binary at {{.KMAZARIN_LOAD_ADDR}})..."'
      - 'CGO_ENABLED=0 GOARCH=amd64 GOOS=linux {{.GO}} build -tags mazhost -overlay={{.ROOT_DIR}}/{{.KMAZARIN_AMD64_OVERLAY_JSON}} {{.GCFLAGS}} -ldflags="-checklinkname=0 -T {{.KMAZARIN_LOAD_ADDR}}" -o {{.KMAZARIN_AMD64_ELF}} ./kmazarin/kmazarin'
      - '{{.GO}} tool go-echo "Fixing kmazarin-amd64 ELF headers..."'
      - '{{.GO}} tool fix-go-elf {{.KMAZARIN_AMD64_ELF}}'
      - '{{.GO}} tool go-echo "Kmazarin x86_64 kernel built at {{.KMAZARIN_AMD64_ELF}} (NOTE: not relocated to high memory yet)"'

