version: '3'

tasks:
  # Deliberately always-run (no sources/generates): the JSON embeds absolute
  # GOROOT paths, and a toolchain upgrade changes GOROOT without touching the
  # patch dir — fingerprinting on patches alone reuses a stale JSON and the
  # build silently proceeds with STOCK sources (MAZ-154). gen-overlay writes
  # only on content change, so downstream fingerprints stay stable.
  userspace-overlay:
    run: once
    desc: Generate runtime overlay JSON for userspace programs
    deps: [':build-dir']
    cmds:
      - '{{.GO}} tool gen-overlay -type userspace -patches {{.USERSPACE_OVERLAY_DIR}} -o {{.USERSPACE_OVERLAY_JSON}}'
