version: '3'

tasks:
  arm64:
    desc: Build mail.maz via mazgo (ET_DYN plugin, UNDEF runtime loaded by generic shepherd)
    run: once
    deps: [':check-env', ':mazgo-build', ':mazlink-build', ':mazgo-toolexec-build', ':mancini:compile-constraints']
    sources:
      - 'mazarin/apps/mail/**/*'
      - 'mazarin/**/*.go'
      - 'shared/**/*.go'
      - '{{.MAZLINK_BIN}}'
      - '{{.MAZGO_BIN}}'
      - '{{.MAZGO_TOOLEXEC_BIN}}'
      - '{{.DLOPEN_HOST_POLICY}}'
    generates:
      - '{{.MAIL_MAZ}}'
    cmds:
      - '{{.GO}} tool go-echo "Building mail.maz (mazgo + mazlink, -buildmode=plugin)..."'
      - |
        CGO_ENABLED=0 GOARCH={{.TARGET_GOARCH}} GOOS={{.TARGET_GOOS}} \
        {{.ROOT_DIR}}/{{.MAZGO_BIN}} build \
          -buildmode=plugin \
          -toolexec="{{.ROOT_DIR}}/{{.MAZGO_TOOLEXEC_BIN}} {{.ROOT_DIR}}/{{.MAZLINK_BIN}}" \
          "-ldflags=-linkmode=internal -dlopen-host-packages={{.ROOT_DIR}}/{{.DLOPEN_HOST_POLICY}}" \
          {{.GCFLAGS}} -o {{.MAIL_MAZ}} ./mazarin/apps/mail
      - '{{.GO}} tool go-echo "mail.maz ready at {{.MAIL_MAZ}}"'

  x86_64:
    desc: Build mail.maz for x86_64 via mazgo
    run: once
    deps: [':check-env', ':mazgo-build', ':mazlink-build', ':mazgo-toolexec-build', ':mancini:compile-constraints']
    sources:
      - 'mazarin/apps/mail/**/*'
      - 'mazarin/**/*.go'
      - 'shared/**/*.go'
      - '{{.MAZLINK_BIN}}'
      - '{{.MAZGO_BIN}}'
      - '{{.MAZGO_TOOLEXEC_BIN}}'
      - '{{.DLOPEN_HOST_POLICY}}'
    generates:
      - '{{.MAIL_MAZ_AMD64}}'
    cmds:
      - '{{.GO}} tool go-echo "Building mail.maz for x86_64 (mazgo + mazlink)..."'
      - |
        CGO_ENABLED=0 GOARCH=amd64 GOOS=linux \
        {{.ROOT_DIR}}/{{.MAZGO_BIN}} build \
          -buildmode=plugin \
          -toolexec="{{.ROOT_DIR}}/{{.MAZGO_TOOLEXEC_BIN}} {{.ROOT_DIR}}/{{.MAZLINK_BIN}}" \
          "-ldflags=-linkmode=internal -dlopen-host-packages={{.ROOT_DIR}}/{{.DLOPEN_HOST_POLICY}}" \
          {{.GCFLAGS}} -o {{.MAIL_MAZ_AMD64}} ./mazarin/apps/mail
      - '{{.GO}} tool go-echo "mail.maz (x86_64) ready at {{.MAIL_MAZ_AMD64}}"'
