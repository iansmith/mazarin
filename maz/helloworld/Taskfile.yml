version: '3'

tasks:
  arm64:
    desc: Build helloworld.maz via mazgo (ET_DYN plugin-shape, UNDEF runtime)
    run: once
    deps: [':check-env', ':mazgo-build', ':mazlink-build', ':mazgo-toolexec-build']
    sources:
      - 'maz/helloworld/**/*.go'
      - 'mazarin/**/*.go'
      - '{{.MAZLINK_BIN}}'
      - '{{.MAZGO_BIN}}'
      - '{{.MAZGO_TOOLEXEC_BIN}}'
      - '{{.DLOPEN_HOST_POLICY}}'
    generates:
      - '{{.HELLOWORLD_MAZ}}'
    cmds:
      - '{{.GO}} tool go-echo "Building helloworld.maz (mazgo + mazlink, -buildmode=plugin)..."'
      - |
        CGO_ENABLED=0 GOARCH={{.TARGET_GOARCH}} GOOS={{.TARGET_GOOS}} \
        {{.ROOT_DIR}}/{{.MAZGO_BIN}} build \
          -buildmode=plugin \
          -toolexec="{{.ROOT_DIR}}/{{.MAZGO_TOOLEXEC_BIN}} {{.ROOT_DIR}}/{{.MAZLINK_BIN}}" \
          "-ldflags=-linkmode=internal -dlopen-host-packages={{.ROOT_DIR}}/{{.DLOPEN_HOST_POLICY}}" \
          {{.GCFLAGS}} -o {{.HELLOWORLD_MAZ}} ./maz/helloworld
      - '{{.GO}} tool go-echo "helloworld.maz ready at {{.HELLOWORLD_MAZ}}"'

  amd64:
    desc: Build helloworld.maz for x86_64 via mazgo
    run: once
    deps: [':check-env', ':mazgo-build', ':mazlink-build', ':mazgo-toolexec-build']
    sources:
      - 'maz/helloworld/**/*.go'
      - 'mazarin/**/*.go'
      - '{{.MAZLINK_BIN}}'
      - '{{.MAZGO_BIN}}'
      - '{{.MAZGO_TOOLEXEC_BIN}}'
      - '{{.DLOPEN_HOST_POLICY}}'
    generates:
      - '{{.HELLOWORLD_MAZ_AMD64}}'
    cmds:
      - '{{.GO}} tool go-echo "Building helloworld.maz for x86_64 (mazgo + mazlink)..."'
      - |
        CGO_ENABLED=0 GOARCH=amd64 GOOS=linux \
        {{.ROOT_DIR}}/{{.MAZGO_BIN}} build \
          -buildmode=plugin \
          -toolexec="{{.ROOT_DIR}}/{{.MAZGO_TOOLEXEC_BIN}} {{.ROOT_DIR}}/{{.MAZLINK_BIN}}" \
          "-ldflags=-linkmode=internal -dlopen-host-packages={{.ROOT_DIR}}/{{.DLOPEN_HOST_POLICY}}" \
          {{.GCFLAGS}} -o {{.HELLOWORLD_MAZ_AMD64}} ./maz/helloworld
      - '{{.GO}} tool go-echo "helloworld.maz (x86_64) ready at {{.HELLOWORLD_MAZ_AMD64}}"'

  riscv64:
    desc: Build helloworld.maz for RISC-V 64-bit (legacy thin-stub toolchain — mazlink/mazgo not yet ported)
    run: once
    deps: [':check-env', ':maz-overlay']
    sources:
      - 'maz/helloworld/**/*.go'
      - 'mazarin/**/*.go'
      - '{{.MAZ_OVERLAY_JSON}}'
    generates:
      - '{{.HELLOWORLD_MAZ_RISCV64}}'
    cmds:
      - '{{.GO}} tool go-echo "Building helloworld.maz for RISC-V 64-bit (fixed-address slot 1)..."'
      - 'CGO_ENABLED=0 GOARCH=riscv64 GOOS=linux {{.GO}} build -overlay={{.ROOT_DIR}}/{{.MAZ_OVERLAY_JSON}} -ldflags="-T 0x32000000" {{.GCFLAGS}} -o {{.HELLOWORLD_MAZ_RISCV64}} ./maz/helloworld'
      - '{{.GO}} tool go-echo "Fixing negative ELF offsets from -T flag..."'
      - '{{.GO}} tool fix-go-elf -no-bootstrap {{.HELLOWORLD_MAZ_RISCV64}}'
      - '{{.GO}} tool go-echo "Running maz-reloc to generate .maz_imports..."'
      - '{{.GO}} tool maz-reloc {{.HELLOWORLD_MAZ_RISCV64}} {{.THIN_MANIFEST}}'
      - '{{.GO}} tool go-echo "helloworld.maz (RISC-V 64-bit) ready at {{.HELLOWORLD_MAZ_RISCV64}}"'
