version: '3'

tasks:
  arm64:
    desc: Build prefs.maz (PIE + thin stubs, dynamically linked)
    run: once
    deps: [':check-env', ':maz-overlay']
    sources:
      - 'maz/prefs/**/*.go'
      - 'mazarin/**/*.go'
      - '{{.MAZ_OVERLAY_JSON}}'
    generates:
      - '{{.PREFS_MAZ}}'
    cmds:
      - '{{.GO}} tool go-echo "Building prefs.maz (PIE + thin stubs)..."'
      - 'CGO_ENABLED=0 GOARCH={{.TARGET_GOARCH}} GOOS={{.TARGET_GOOS}} {{.GO}} build -buildmode=pie -overlay={{.ROOT_DIR}}/{{.MAZ_OVERLAY_JSON}} {{.GCFLAGS}} -o {{.PREFS_MAZ}} ./maz/prefs'
      - '{{.GO}} tool go-echo "Running maz-reloc to generate .maz_imports..."'
      - '{{.GO}} tool maz-reloc {{.PREFS_MAZ}} {{.THIN_MANIFEST}}'
      - '{{.GO}} tool go-echo "prefs.maz ready at {{.PREFS_MAZ}}"'

  amd64:
    desc: Build prefs.maz for x86_64 (PIE + thin stubs, dynamically linked)
    run: once
    deps: [':check-env', ':maz-overlay-amd64']
    sources:
      - 'maz/prefs/**/*.go'
      - 'mazarin/**/*.go'
      - '{{.MAZ_OVERLAY_AMD64_JSON}}'
    generates:
      - '{{.PREFS_MAZ_AMD64}}'
    cmds:
      - '{{.GO}} tool go-echo "Building prefs.maz for x86_64 (PIE + thin stubs)..."'
      - 'CGO_ENABLED=0 GOARCH=amd64 GOOS=linux {{.GO}} build -buildmode=pie -overlay={{.ROOT_DIR}}/{{.MAZ_OVERLAY_AMD64_JSON}} {{.GCFLAGS}} -o {{.PREFS_MAZ_AMD64}} ./maz/prefs'
      - '{{.GO}} tool go-echo "Running maz-reloc to generate .maz_imports..."'
      - '{{.GO}} tool maz-reloc {{.PREFS_MAZ_AMD64}} {{.THIN_MANIFEST_AMD64}}'
      - '{{.GO}} tool go-echo "prefs.maz (x86_64) ready at {{.PREFS_MAZ_AMD64}}"'

  riscv64:
    desc: Build prefs.maz for RISC-V 64-bit (fixed-address slot 2, thin stubs)
    run: once
    deps: [':check-env', ':maz-overlay']
    sources:
      - 'maz/prefs/**/*.go'
      - 'mazarin/**/*.go'
      - '{{.MAZ_OVERLAY_JSON}}'
    generates:
      - '{{.PREFS_MAZ_RISCV64}}'
    cmds:
      - '{{.GO}} tool go-echo "Building prefs.maz for RISC-V 64-bit (fixed-address slot 2)..."'
      - 'CGO_ENABLED=0 GOARCH=riscv64 GOOS=linux {{.GO}} build -overlay={{.ROOT_DIR}}/{{.MAZ_OVERLAY_JSON}} -ldflags="-T 0x34000000" {{.GCFLAGS}} -o {{.PREFS_MAZ_RISCV64}} ./maz/prefs'
      - '{{.GO}} tool go-echo "Fixing negative ELF offsets from -T flag..."'
      - '{{.GO}} tool fix-go-elf -no-bootstrap {{.PREFS_MAZ_RISCV64}}'
      - '{{.GO}} tool go-echo "Running maz-reloc to generate .maz_imports..."'
      - '{{.GO}} tool maz-reloc {{.PREFS_MAZ_RISCV64}} {{.THIN_MANIFEST}}'
      - '{{.GO}} tool go-echo "prefs.maz (RISC-V 64-bit) ready at {{.PREFS_MAZ_RISCV64}}"'
