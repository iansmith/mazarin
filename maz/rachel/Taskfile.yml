version: '3'

tasks:
  arm64:
    desc: Build rachel.maz via mazgo (ET_DYN plugin, UNDEF runtime loaded by generic shepherd)
    run: once
    deps: [':check-env', ':mazgo-build', ':mazlink-build', ':mazgo-toolexec-build']
    sources:
      - 'maz/rachel/**/*.go'
      - 'maz/rachel/**/*.s'
      - 'mazarin/**/*.go'
      - 'shared/**/*.go'
      - '{{.MAZLINK_BIN}}'
      - '{{.MAZGO_BIN}}'
      - '{{.MAZGO_TOOLEXEC_BIN}}'
      - '{{.DLOPEN_HOST_POLICY}}'
    generates:
      - '{{.RACHEL_MAZ}}'
    cmds:
      - '{{.GO}} tool go-echo "Building rachel.maz (mazgo + mazlink, -buildmode=plugin)..."'
      - |
        CGO_ENABLED=0 GOARCH={{.TARGET_GOARCH}} GOOS={{.TARGET_GOOS}} \
        {{.ROOT_DIR}}/{{.MAZGO_BIN}} build \
          -buildmode=plugin \
          -toolexec="{{.ROOT_DIR}}/{{.MAZGO_TOOLEXEC_BIN}} {{.ROOT_DIR}}/{{.MAZLINK_BIN}}" \
          "-ldflags=-linkmode=internal -dlopen-host-packages={{.ROOT_DIR}}/{{.DLOPEN_HOST_POLICY}}" \
          {{.GCFLAGS}} -o {{.RACHEL_MAZ}} ./maz/rachel
      - '{{.GO}} tool go-echo "rachel.maz ready at {{.RACHEL_MAZ}}"'

  x86_64:
    desc: Build rachel.maz for x86_64 via mazgo
    run: once
    deps: [':check-env', ':mazgo-build', ':mazlink-build', ':mazgo-toolexec-build']
    sources:
      - 'maz/rachel/**/*.go'
      - 'maz/rachel/**/*.s'
      - 'mazarin/**/*.go'
      - 'shared/**/*.go'
      - '{{.MAZLINK_BIN}}'
      - '{{.MAZGO_BIN}}'
      - '{{.MAZGO_TOOLEXEC_BIN}}'
      - '{{.DLOPEN_HOST_POLICY}}'
    generates:
      - '{{.RACHEL_MAZ_AMD64}}'
    cmds:
      - '{{.GO}} tool go-echo "Building rachel.maz for x86_64 (mazgo + mazlink)..."'
      - |
        CGO_ENABLED=0 GOARCH=amd64 GOOS=linux \
        {{.ROOT_DIR}}/{{.MAZGO_BIN}} build \
          -buildmode=plugin \
          -toolexec="{{.ROOT_DIR}}/{{.MAZGO_TOOLEXEC_BIN}} {{.ROOT_DIR}}/{{.MAZLINK_BIN}}" \
          "-ldflags=-linkmode=internal -dlopen-host-packages={{.ROOT_DIR}}/{{.DLOPEN_HOST_POLICY}}" \
          {{.GCFLAGS}} -o {{.RACHEL_MAZ_AMD64}} ./maz/rachel
      - '{{.GO}} tool go-echo "rachel.maz (x86_64) ready at {{.RACHEL_MAZ_AMD64}}"'

  riscv64:
    desc: Build rachel shepherd (RISC-V 64-bit) — legacy ET_EXEC, stays on SysLoadMaz until Phase 7
    run: once
    deps: [':check-env', ':merged-shepherd-overlay-riscv64']
    sources:
      - 'maz/**/*.go'
      - 'maz/**/*.s'
      - 'mazarin/**/*.go'
      - 'shared/**/*.go'
      - '{{.MERGED_SHEPHERD_OVERLAY_RISCV64_JSON}}'
      - '{{.USERSPACE_OVERLAY_DIR}}/**/*'
      - '{{.SHEPHERD_OVERLAY_RISCV64_DIR}}/**/*'
    generates:
      - '{{.RACHEL_RISCV64_ELF}}'
    cmds:
      - '{{.GO}} tool go-echo "Building rachel for RISC-V 64-bit..."'
      - 'CGO_ENABLED=0 GOARCH=riscv64 GOOS=linux {{.GO}} build -tags mazhost -overlay={{.ROOT_DIR}}/{{.MERGED_SHEPHERD_OVERLAY_RISCV64_JSON}} {{.GCFLAGS}} -o {{.RACHEL_RISCV64_ELF}} ./maz/rachel'
      - '{{.GO}} tool go-echo "Rachel RISC-V 64-bit built at {{.RACHEL_RISCV64_ELF}}"'
