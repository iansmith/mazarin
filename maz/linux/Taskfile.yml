version: '3'

tasks:
  arm64:
    desc: Build linux.maz via mazgo (ET_DYN plugin, UNDEF runtime loaded by generic shepherd)
    run: once
    deps: [':check-env', ':mazgo-build', ':mazlink-build', ':mazgo-toolexec-build']
    sources:
      - '{{.ROOT_DIR}}/maz/linux/**/*.go'
      - '{{.ROOT_DIR}}/maz/linux/**/*.s'
      - '{{.ROOT_DIR}}/mazarin/**/*.go'
      - '{{.ROOT_DIR}}/shared/**/*.go'
      - '{{.MAZLINK_BIN}}'
      - '{{.MAZGO_BIN}}'
      - '{{.MAZGO_TOOLEXEC_BIN}}'
      - '{{.DLOPEN_HOST_POLICY}}'
    generates:
      - '{{.LINUX_MAZ}}'
    cmds:
      - '{{.GO}} tool go-echo "Building linux.maz (mazgo + mazlink, -buildmode=plugin)..."'
      - |
        CGO_ENABLED=0 GOARCH={{.TARGET_GOARCH}} GOOS={{.TARGET_GOOS}} \
        {{.ROOT_DIR}}/{{.MAZGO_BIN}} build \
          -buildmode=plugin \
          -toolexec="{{.ROOT_DIR}}/{{.MAZGO_TOOLEXEC_BIN}} {{.ROOT_DIR}}/{{.MAZLINK_BIN}}" \
          "-ldflags=-linkmode=internal -dlopen-host-packages={{.ROOT_DIR}}/{{.DLOPEN_HOST_POLICY}}" \
          {{.GCFLAGS}} -o {{.LINUX_MAZ}} ./maz/linux
      - '{{.GO}} tool go-echo "linux.maz ready at {{.LINUX_MAZ}}"'

  x86_64:
    desc: Build linux.maz for x86_64 via mazgo (ET_DYN plugin, UNDEF runtime loaded by generic shepherd)
    run: once
    deps: [':check-env', ':mazgo-build', ':mazlink-build', ':mazgo-toolexec-build']
    sources:
      - '{{.ROOT_DIR}}/maz/linux/**/*.go'
      - '{{.ROOT_DIR}}/maz/linux/**/*.s'
      - '{{.ROOT_DIR}}/mazarin/**/*.go'
      - '{{.ROOT_DIR}}/shared/**/*.go'
      - '{{.MAZLINK_BIN}}'
      - '{{.MAZGO_BIN}}'
      - '{{.MAZGO_TOOLEXEC_BIN}}'
      - '{{.DLOPEN_HOST_POLICY}}'
    generates:
      - '{{.LINUX_MAZ_AMD64}}'
    cmds:
      - '{{.GO}} tool go-echo "Building linux.maz (x86_64, mazgo + mazlink, -buildmode=plugin)..."'
      - |
        CGO_ENABLED=0 GOARCH=amd64 GOOS=linux \
        {{.ROOT_DIR}}/{{.MAZGO_BIN}} build \
          -buildmode=plugin \
          -toolexec="{{.ROOT_DIR}}/{{.MAZGO_TOOLEXEC_BIN}} {{.ROOT_DIR}}/{{.MAZLINK_BIN}}" \
          "-ldflags=-linkmode=internal -dlopen-host-packages={{.ROOT_DIR}}/{{.DLOPEN_HOST_POLICY}}" \
          {{.GCFLAGS}} -o {{.LINUX_MAZ_AMD64}} ./maz/linux
      - '{{.GO}} tool go-echo "linux.maz (x86_64) ready at {{.LINUX_MAZ_AMD64}}"'

