version: '3'

tasks:
  arm64:
    desc: Build handletest (Handle[T] API integration test shepherd, ARM64)
    run: once
    deps: [':check-env', ':mazarin:userspace-overlay']
    sources:
      - 'maz/handletest/**/*.go'
      - 'mazarin/**/*.go'
      - '{{.USERSPACE_OVERLAY_JSON}}'
      - '{{.USERSPACE_OVERLAY_DIR}}/**/*'
    generates:
      - '{{.HANDLETEST_ELF}}'
    cmds:
      - '{{.GO}} tool go-echo "Building handletest..."'
      - 'CGO_ENABLED=0 GOARCH={{.TARGET_GOARCH}} GOOS={{.TARGET_GOOS}} {{.GO}} build -overlay={{.ROOT_DIR}}/{{.USERSPACE_OVERLAY_JSON}} {{.GCFLAGS}} -o {{.HANDLETEST_ELF}} ./maz/handletest'
      - '{{.GO}} tool go-echo "Handletest built at {{.HANDLETEST_ELF}}"'

  x86_64:
    desc: Build handletest (x86_64)
    run: once
    deps: [':check-env', ':mazarin:userspace-overlay']
    sources:
      - 'maz/handletest/**/*.go'
      - 'mazarin/**/*.go'
      - '{{.USERSPACE_OVERLAY_JSON}}'
      - '{{.USERSPACE_OVERLAY_DIR}}/**/*'
    generates:
      - '{{.HANDLETEST_AMD64_ELF}}'
    cmds:
      - '{{.GO}} tool go-echo "Building handletest for x86_64..."'
      - 'CGO_ENABLED=0 GOARCH=amd64 GOOS=linux {{.GO}} build -overlay={{.ROOT_DIR}}/{{.USERSPACE_OVERLAY_JSON}} {{.GCFLAGS}} -o {{.HANDLETEST_AMD64_ELF}} ./maz/handletest'
      - '{{.GO}} tool go-echo "Handletest x86_64 built at {{.HANDLETEST_AMD64_ELF}}"'

  riscv64:
    desc: Build handletest (RISC-V 64-bit)
    run: once
    deps: [':check-env', ':mazarin:userspace-overlay']
    sources:
      - 'maz/handletest/**/*.go'
      - 'mazarin/**/*.go'
      - '{{.USERSPACE_OVERLAY_JSON}}'
      - '{{.USERSPACE_OVERLAY_DIR}}/**/*'
    generates:
      - '{{.HANDLETEST_RISCV64_ELF}}'
    cmds:
      - '{{.GO}} tool go-echo "Building handletest for RISC-V 64-bit..."'
      - 'CGO_ENABLED=0 GOARCH=riscv64 GOOS=linux {{.GO}} build -overlay={{.ROOT_DIR}}/{{.USERSPACE_OVERLAY_JSON}} {{.GCFLAGS}} -o {{.HANDLETEST_RISCV64_ELF}} ./maz/handletest'
      - '{{.GO}} tool go-echo "Handletest RISC-V 64-bit built at {{.HANDLETEST_RISCV64_ELF}}"'
