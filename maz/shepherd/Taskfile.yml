version: '3'

tasks:
  arm64:
    desc: Build generic shepherd (ARM64) — mazdl host for .maz plugins
    run: once
    deps: [':check-env', ':mazgo-build', ':mazlink-build', ':mazgo-toolexec-build']
    sources:
      - '{{.ROOT_DIR}}/maz/shepherd/**/*.go'
      - '{{.ROOT_DIR}}/mazarin/**/*.go'
      - '{{.ROOT_DIR}}/shared/**/*.go'
      - '{{.MAZLINK_BIN}}'
      - '{{.MAZGO_BIN}}'
      - '{{.MAZGO_TOOLEXEC_BIN}}'
      - '{{.DLOPEN_HOST_POLICY}}'
    generates:
      - '{{.SHEPHERD_ELF}}'
    cmds:
      - '{{.GO}} tool go-echo "Building shepherd for ARM64 (mazgo + mazlink, -dlopen-host-exports, -dynlink)..."'
      - |
        CGO_ENABLED=0 GOARCH={{.TARGET_GOARCH}} GOOS={{.TARGET_GOOS}} \
        {{.ROOT_DIR}}/{{.MAZGO_BIN}} build \
          -tags mazhost \
          "-gcflags=all=-dynlink" "-asmflags=all=-dynlink" \
          -toolexec="{{.ROOT_DIR}}/{{.MAZGO_TOOLEXEC_BIN}} {{.ROOT_DIR}}/{{.MAZLINK_BIN}}" \
          "-ldflags=-linkmode=internal -dlopen-host-exports={{.ROOT_DIR}}/{{.DLOPEN_HOST_POLICY}}" \
          {{.GCFLAGS}} -o {{.SHEPHERD_ELF}} ./maz/shepherd
      - '{{.GO}} tool go-echo "Shepherd ARM64 built at {{.SHEPHERD_ELF}}"'

  x86_64:
    desc: Build generic shepherd (x86_64) — mazdl host for .maz plugins
    run: once
    deps: [':check-env', ':mazgo-build', ':mazlink-build', ':mazgo-toolexec-build']
    sources:
      - '{{.ROOT_DIR}}/maz/shepherd/**/*.go'
      - '{{.ROOT_DIR}}/mazarin/**/*.go'
      - '{{.ROOT_DIR}}/shared/**/*.go'
      - '{{.MAZLINK_BIN}}'
      - '{{.MAZGO_BIN}}'
      - '{{.MAZGO_TOOLEXEC_BIN}}'
      - '{{.DLOPEN_HOST_POLICY}}'
    generates:
      - '{{.SHEPHERD_AMD64_ELF}}'
    cmds:
      - '{{.GO}} tool go-echo "Building shepherd for x86_64 (mazgo + mazlink, -dlopen-host-exports, -dynlink)..."'
      - |
        CGO_ENABLED=0 GOARCH=amd64 GOOS=linux \
        {{.ROOT_DIR}}/{{.MAZGO_BIN}} build \
          -tags mazhost \
          "-gcflags=all=-dynlink" "-asmflags=all=-dynlink" \
          -toolexec="{{.ROOT_DIR}}/{{.MAZGO_TOOLEXEC_BIN}} {{.ROOT_DIR}}/{{.MAZLINK_BIN}}" \
          "-ldflags=-linkmode=internal -dlopen-host-exports={{.ROOT_DIR}}/{{.DLOPEN_HOST_POLICY}}" \
          {{.GCFLAGS}} -o {{.SHEPHERD_AMD64_ELF}} ./maz/shepherd
      - '{{.GO}} tool go-echo "Shepherd x86_64 built at {{.SHEPHERD_AMD64_ELF}}"'
