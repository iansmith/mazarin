version: '3'

tasks:
  arm64:
    desc: Build fti.maz via mazgo (ET_DYN plugin, UNDEF runtime loaded by generic shepherd)
    run: once
    deps: [':check-env', ':mazgo-build', ':mazlink-build', ':mazgo-toolexec-build']
    sources:
      - '{{.ROOT_DIR}}/maz/fti/**/*.go'
      - '{{.ROOT_DIR}}/maz/fti/**/*.s'
      - '{{.ROOT_DIR}}/maz/**/*.go'
      - '{{.ROOT_DIR}}/maz/**/*.s'
      - '{{.ROOT_DIR}}/mazarin/**/*.go'
      - '{{.ROOT_DIR}}/shared/**/*.go'
      - '{{.MAZLINK_BIN}}'
      - '{{.MAZGO_BIN}}'
      - '{{.MAZGO_TOOLEXEC_BIN}}'
      - '{{.DLOPEN_HOST_POLICY}}'
    generates:
      - '{{.FTI_MAZ}}'
    cmds:
      - '{{.GO}} tool go-echo "Building fti.maz (mazgo + mazlink, -buildmode=plugin)..."'
      - |
        CGO_ENABLED=0 GOARCH={{.TARGET_GOARCH}} GOOS={{.TARGET_GOOS}} \
        {{.ROOT_DIR}}/{{.MAZGO_BIN}} build \
          -buildmode=plugin \
          -toolexec="{{.ROOT_DIR}}/{{.MAZGO_TOOLEXEC_BIN}} {{.ROOT_DIR}}/{{.MAZLINK_BIN}}" \
          "-ldflags=-linkmode=internal -dlopen-host-packages={{.ROOT_DIR}}/{{.DLOPEN_HOST_POLICY}}" \
          {{.GCFLAGS}} -o {{.FTI_MAZ}} ./maz/fti
      - '{{.GO}} tool go-echo "fti.maz ready at {{.FTI_MAZ}}"'

  x86_64:
    desc: Build fti.maz for x86_64 via mazgo
    run: once
    deps: [':check-env', ':mazgo-build', ':mazlink-build', ':mazgo-toolexec-build']
    sources:
      - '{{.ROOT_DIR}}/maz/fti/**/*.go'
      - '{{.ROOT_DIR}}/maz/fti/**/*.s'
      - '{{.ROOT_DIR}}/maz/**/*.go'
      - '{{.ROOT_DIR}}/maz/**/*.s'
      - '{{.ROOT_DIR}}/mazarin/**/*.go'
      - '{{.ROOT_DIR}}/shared/**/*.go'
      - '{{.MAZLINK_BIN}}'
      - '{{.MAZGO_BIN}}'
      - '{{.MAZGO_TOOLEXEC_BIN}}'
      - '{{.DLOPEN_HOST_POLICY}}'
    generates:
      - '{{.FTI_MAZ_AMD64}}'
    cmds:
      - '{{.GO}} tool go-echo "Building fti.maz for x86_64 (mazgo + mazlink)..."'
      - |
        CGO_ENABLED=0 GOARCH=amd64 GOOS=linux \
        {{.ROOT_DIR}}/{{.MAZGO_BIN}} build \
          -buildmode=plugin \
          -toolexec="{{.ROOT_DIR}}/{{.MAZGO_TOOLEXEC_BIN}} {{.ROOT_DIR}}/{{.MAZLINK_BIN}}" \
          "-ldflags=-linkmode=internal -dlopen-host-packages={{.ROOT_DIR}}/{{.DLOPEN_HOST_POLICY}}" \
          {{.GCFLAGS}} -o {{.FTI_MAZ_AMD64}} ./maz/fti
      - '{{.GO}} tool go-echo "fti.maz (x86_64) ready at {{.FTI_MAZ_AMD64}}"'
