version: '3'

tasks:
  arm64:
    desc: Build fti shepherd (ARM64) — both legacy ET_EXEC and new .maz plugin
    run: once
    deps: [':check-env', ':merged-shepherd-overlay', ':mazgo-build', ':mazlink-build', ':mazgo-toolexec-build']
    sources:
      - 'maz/fti/**/*.go'
      - 'maz/fti/**/*.s'
      - 'maz/**/*.go'
      - 'maz/**/*.s'
      - 'mazarin/**/*.go'
      - 'shared/**/*.go'
      - '{{.MERGED_SHEPHERD_OVERLAY_JSON}}'
      - '{{.USERSPACE_OVERLAY_DIR}}/**/*'
      - '{{.SHEPHERD_OVERLAY_DIR}}/**/*'
      - '{{.MAZLINK_BIN}}'
      - '{{.MAZGO_BIN}}'
      - '{{.MAZGO_TOOLEXEC_BIN}}'
      - '{{.DLOPEN_HOST_POLICY}}'
    generates:
      - '{{.FTI_ELF}}'
      - '{{.FTI_MAZ}}'
    cmds:
      - '{{.GO}} tool go-echo "Building fti for ARM64 (legacy ET_EXEC)..."'
      - 'CGO_ENABLED=0 GOARCH={{.TARGET_GOARCH}} GOOS={{.TARGET_GOOS}} {{.GO}} build -tags mazhost -overlay={{.ROOT_DIR}}/{{.MERGED_SHEPHERD_OVERLAY_JSON}} {{.GCFLAGS}} -o {{.FTI_ELF}} ./maz/fti'
      - '{{.GO}} tool go-echo "fti ARM64 ET_EXEC built at {{.FTI_ELF}}"'
      - '{{.GO}} tool go-echo "Building fti.maz (mazgo + mazlink, -buildmode=plugin)..."'
      - |
        CGO_ENABLED=0 GOARCH={{.TARGET_GOARCH}} GOOS={{.TARGET_GOOS}} \
        {{.ROOT_DIR}}/{{.MAZGO_BIN}} build \
          -buildmode=plugin \
          -toolexec="{{.ROOT_DIR}}/{{.MAZGO_TOOLEXEC_BIN}} {{.ROOT_DIR}}/{{.MAZLINK_BIN}}" \
          "-ldflags=-linkmode=internal -dlopen-host-packages={{.ROOT_DIR}}/{{.DLOPEN_HOST_POLICY}}" \
          {{.GCFLAGS}} -o {{.FTI_MAZ}} ./maz/fti
      - '{{.GO}} tool go-echo "fti.maz ready at {{.FTI_MAZ}}"'

  x86_64:
    desc: Build fti shepherd (x86_64) — legacy ET_EXEC + new .maz plugin
    run: once
    deps: [':check-env', ':merged-shepherd-overlay-amd64', ':mazgo-build', ':mazlink-build', ':mazgo-toolexec-build']
    sources:
      - 'maz/fti/**/*.go'
      - 'maz/fti/**/*.s'
      - 'maz/**/*.go'
      - 'maz/**/*.s'
      - 'mazarin/**/*.go'
      - 'shared/**/*.go'
      - '{{.MERGED_SHEPHERD_OVERLAY_AMD64_JSON}}'
      - '{{.USERSPACE_OVERLAY_DIR}}/**/*'
      - '{{.SHEPHERD_OVERLAY_AMD64_DIR}}/**/*'
      - '{{.MAZLINK_BIN}}'
      - '{{.MAZGO_BIN}}'
      - '{{.MAZGO_TOOLEXEC_BIN}}'
      - '{{.DLOPEN_HOST_POLICY}}'
    generates:
      - '{{.FTI_AMD64_ELF}}'
      - '{{.FTI_MAZ_AMD64}}'
    cmds:
      - '{{.GO}} tool go-echo "Building fti for x86_64 (legacy ET_EXEC)..."'
      - 'CGO_ENABLED=0 GOARCH=amd64 GOOS=linux {{.GO}} build -tags mazhost -overlay={{.ROOT_DIR}}/{{.MERGED_SHEPHERD_OVERLAY_AMD64_JSON}} {{.GCFLAGS}} -o {{.FTI_AMD64_ELF}} ./maz/fti'
      - '{{.GO}} tool go-echo "fti x86_64 ET_EXEC built at {{.FTI_AMD64_ELF}}"'
      - '{{.GO}} tool go-echo "Building fti.maz for x86_64 (mazgo + mazlink, -buildmode=plugin)..."'
      - |
        CGO_ENABLED=0 GOARCH=amd64 GOOS=linux \
        {{.ROOT_DIR}}/{{.MAZGO_BIN}} build \
          -buildmode=plugin \
          -toolexec="{{.ROOT_DIR}}/{{.MAZGO_TOOLEXEC_BIN}} {{.ROOT_DIR}}/{{.MAZLINK_BIN}}" \
          "-ldflags=-linkmode=internal -dlopen-host-packages={{.ROOT_DIR}}/{{.DLOPEN_HOST_POLICY}}" \
          {{.GCFLAGS}} -o {{.FTI_MAZ_AMD64}} ./maz/fti
      - '{{.GO}} tool go-echo "fti.maz (x86_64) ready at {{.FTI_MAZ_AMD64}}"'
