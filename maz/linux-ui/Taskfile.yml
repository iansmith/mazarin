version: '3'

tasks:
  arm64:
    desc: Build linux-ui.maz via mazgo (ET_DYN plugin-shape, UNDEF runtime)
    run: once
    deps: [':check-env', ':mazgo-build', ':mazlink-build', ':mazgo-toolexec-build']
    sources:
      - 'maz/linux-ui/**/*.go'
      - 'mazarin/**/*.go'
      - '{{.MAZLINK_BIN}}'
      - '{{.MAZGO_BIN}}'
      - '{{.MAZGO_TOOLEXEC_BIN}}'
      - '{{.DLOPEN_HOST_POLICY}}'
    generates:
      - '{{.LINUX_UI_MAZ}}'
    cmds:
      - '{{.GO}} tool go-echo "Building linux-ui.maz (mazgo + mazlink, -buildmode=plugin)..."'
      - |
        CGO_ENABLED=0 GOARCH={{.TARGET_GOARCH}} GOOS={{.TARGET_GOOS}} \
        {{.ROOT_DIR}}/{{.MAZGO_BIN}} build \
          -buildmode=plugin \
          -toolexec="{{.ROOT_DIR}}/{{.MAZGO_TOOLEXEC_BIN}} {{.ROOT_DIR}}/{{.MAZLINK_BIN}}" \
          "-ldflags=-linkmode=internal -dlopen-host-packages={{.ROOT_DIR}}/{{.DLOPEN_HOST_POLICY}}" \
          {{.GCFLAGS}} -o {{.LINUX_UI_MAZ}} ./maz/linux-ui
      - '{{.GO}} tool go-echo "linux-ui.maz ready at {{.LINUX_UI_MAZ}}"'

  amd64:
    desc: Build linux-ui.maz for x86_64 via mazgo
    run: once
    deps: [':check-env', ':mazgo-build', ':mazlink-build', ':mazgo-toolexec-build']
    sources:
      - 'maz/linux-ui/**/*.go'
      - 'mazarin/**/*.go'
      - '{{.MAZLINK_BIN}}'
      - '{{.MAZGO_BIN}}'
      - '{{.MAZGO_TOOLEXEC_BIN}}'
      - '{{.DLOPEN_HOST_POLICY}}'
    generates:
      - '{{.LINUX_UI_MAZ_AMD64}}'
    cmds:
      - '{{.GO}} tool go-echo "Building linux-ui.maz for x86_64 (mazgo + mazlink)..."'
      - |
        CGO_ENABLED=0 GOARCH=amd64 GOOS=linux \
        {{.ROOT_DIR}}/{{.MAZGO_BIN}} build \
          -buildmode=plugin \
          -toolexec="{{.ROOT_DIR}}/{{.MAZGO_TOOLEXEC_BIN}} {{.ROOT_DIR}}/{{.MAZLINK_BIN}}" \
          "-ldflags=-linkmode=internal -dlopen-host-packages={{.ROOT_DIR}}/{{.DLOPEN_HOST_POLICY}}" \
          {{.GCFLAGS}} -o {{.LINUX_UI_MAZ_AMD64}} ./maz/linux-ui
      - '{{.GO}} tool go-echo "linux-ui.maz (x86_64) ready at {{.LINUX_UI_MAZ_AMD64}}"'

  riscv64:
    desc: Build linux-ui.maz for RISC-V 64-bit (legacy thin-stub toolchain — mazlink/mazgo not yet ported)
    run: once
    deps: [':check-env', ':maz-overlay']
    sources:
      - 'maz/linux-ui/**/*.go'
      - 'mazarin/**/*.go'
      - '{{.MAZ_OVERLAY_JSON}}'
    generates:
      - '{{.LINUX_UI_MAZ_RISCV64}}'
    cmds:
      - '{{.GO}} tool go-echo "Building linux-ui.maz for RISC-V 64-bit (fixed-address slot 5)..."'
      - 'CGO_ENABLED=0 GOARCH=riscv64 GOOS=linux {{.GO}} build -overlay={{.ROOT_DIR}}/{{.MAZ_OVERLAY_JSON}} -ldflags="-T 0x3A000000" {{.GCFLAGS}} -o {{.LINUX_UI_MAZ_RISCV64}} ./maz/linux-ui'
      - '{{.GO}} tool go-echo "Fixing negative ELF offsets from -T flag..."'
      - '{{.GO}} tool fix-go-elf -no-bootstrap {{.LINUX_UI_MAZ_RISCV64}}'
      - '{{.GO}} tool go-echo "Running maz-reloc to generate .maz_imports..."'
      - '{{.GO}} tool maz-reloc {{.LINUX_UI_MAZ_RISCV64}} {{.THIN_MANIFEST}}'
      - '{{.GO}} tool go-echo "linux-ui.maz (RISC-V 64-bit) ready at {{.LINUX_UI_MAZ_RISCV64}}"'
