version: '3'

tasks:
  arm64:
    desc: Build fontsvc.maz (PIE + thin stubs, dynamically linked)
    run: once
    deps: [':check-env', ':maz-overlay']
    sources:
      - 'maz/fontsvc/**/*.go'
      - 'mazarin/**/*.go'
      - '{{.MAZ_OVERLAY_JSON}}'
    generates:
      - '{{.FONTSVC_MAZ}}'
    cmds:
      - '{{.GO}} tool go-echo "Building fontsvc.maz (PIE + thin stubs)..."'
      - 'CGO_ENABLED=0 GOARCH={{.TARGET_GOARCH}} GOOS={{.TARGET_GOOS}} {{.GO}} build -buildmode=pie -overlay={{.ROOT_DIR}}/{{.MAZ_OVERLAY_JSON}} {{.GCFLAGS}} -o {{.FONTSVC_MAZ}} ./maz/fontsvc'
      - '{{.GO}} tool go-echo "Running maz-reloc to generate .maz_imports..."'
      - '{{.GO}} tool maz-reloc {{.FONTSVC_MAZ}} {{.THIN_MANIFEST}}'
      - '{{.GO}} tool go-echo "fontsvc.maz ready at {{.FONTSVC_MAZ}}"'

  amd64:
    desc: Build fontsvc.maz for x86_64 (PIE + thin stubs, dynamically linked)
    run: once
    deps: [':check-env', ':maz-overlay-amd64']
    sources:
      - 'maz/fontsvc/**/*.go'
      - 'mazarin/**/*.go'
      - '{{.MAZ_OVERLAY_AMD64_JSON}}'
    generates:
      - '{{.FONTSVC_MAZ_AMD64}}'
    cmds:
      - '{{.GO}} tool go-echo "Building fontsvc.maz for x86_64 (PIE + thin stubs)..."'
      - 'CGO_ENABLED=0 GOARCH=amd64 GOOS=linux {{.GO}} build -buildmode=pie -overlay={{.ROOT_DIR}}/{{.MAZ_OVERLAY_AMD64_JSON}} {{.GCFLAGS}} -o {{.FONTSVC_MAZ_AMD64}} ./maz/fontsvc'
      - '{{.GO}} tool go-echo "Running maz-reloc to generate .maz_imports..."'
      - '{{.GO}} tool maz-reloc {{.FONTSVC_MAZ_AMD64}} {{.THIN_MANIFEST_AMD64}}'
      - '{{.GO}} tool go-echo "fontsvc.maz (x86_64) ready at {{.FONTSVC_MAZ_AMD64}}"'

  riscv64:
    desc: Build fontsvc.maz for RISC-V 64-bit (fixed-address slot 3, thin stubs)
    run: once
    deps: [':check-env', ':maz-overlay']
    sources:
      - 'maz/fontsvc/**/*.go'
      - 'mazarin/**/*.go'
      - '{{.MAZ_OVERLAY_JSON}}'
    generates:
      - '{{.FONTSVC_MAZ_RISCV64}}'
    cmds:
      - '{{.GO}} tool go-echo "Building fontsvc.maz for RISC-V 64-bit (fixed-address slot 3)..."'
      - 'CGO_ENABLED=0 GOARCH=riscv64 GOOS=linux {{.GO}} build -overlay={{.ROOT_DIR}}/{{.MAZ_OVERLAY_JSON}} -ldflags="-T 0x36000000" {{.GCFLAGS}} -o {{.FONTSVC_MAZ_RISCV64}} ./maz/fontsvc'
      - '{{.GO}} tool go-echo "Fixing negative ELF offsets from -T flag..."'
      - '{{.GO}} tool fix-go-elf -no-bootstrap {{.FONTSVC_MAZ_RISCV64}}'
      - '{{.GO}} tool go-echo "Running maz-reloc to generate .maz_imports..."'
      - '{{.GO}} tool maz-reloc {{.FONTSVC_MAZ_RISCV64}} {{.THIN_MANIFEST}}'
      - '{{.GO}} tool go-echo "fontsvc.maz (RISC-V 64-bit) ready at {{.FONTSVC_MAZ_RISCV64}}"'
