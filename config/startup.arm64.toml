# startup.arm64.toml — ARM64 shepherd launch sequence (read by fs from disk)
# NOTE: linux and rachel are launched explicitly by fs in bootSequence
# (linux first, then rachel) before this config is read.

#[[shepherd]]
#name = "sievetest"
#path = "/sievetest.elf"

#[[shepherd]]
#name = "versai"
#path = "/versai.maz"

#[[shepherd]]
#name = "clocks"
#path = "/clocks.maz"

#[[shepherd]]
#name = "calc"
#path = "/calc.maz"

[[shepherd]]
name = "fti"
path = "/fti.maz"
memlimit_mb = 128

[[shepherd]]
name = "maildb"
path = "/maildb.maz"

[[shepherd]]
name = "mail"
path = "/mail.maz"
gc_percent = 75

[[shepherd]]
name = "net"
path = "/net.elf"

# Boot-time smoke test for the MAZ-29 ownership-primitive syscalls
# (SyscallTransferDMAClump + SyscallShareNetPageWithClient + PD_NET_OWNED_SHARED).
[[shepherd]]
name = "xfertest"
path = "/xfertest.maz"

# MAZ-114 fork+exec+wait4 end-to-end acceptance smoke (the MAZ-62 umbrella DoD).
# forkexectest.elf is a FULL ELF (not a .maz) that os/exec's /forkexecchild.elf
# in four scenarios. PASS = `[forkexectest] all checks done` + per-stage
# `[forkexectest] PASS ...` lines in the serial log.
#
# Re-enabled by MAZ-127 (vfork double-return fix). Process-flavor clone now
# spawns a transient child-context thread and suspends the parent via
# kernel-emulated vfork; the double-return contract is honored.
#
# forkexecchild.elf is NOT launched at boot — forkexectest fork/exec's it on demand.
[[shepherd]]
name = "forkexectest"
path = "/forkexectest.elf"

# MAZ-50 boot-time smoke for mazarin/transfer Mode 1. transfertest is the
# server (registers + Waits); transferprobe is the client (Reserves + writes
# + Commits). PASS = `[transfertest] PASS Mode 1 round-trip` in serial log.
[[shepherd]]
name = "transfertest"
path = "/transfertest.maz"

[[shepherd]]
name = "transferprobe"
path = "/transferprobe.maz"

# MAZ-53 boot-time smoke for mazarin/transfer Mode 2 (Share). Three shepherds:
#   sharetest   = sender for stages 1–4 (whole-slab, sub-range, bidirectional,
#                 multi-share); B-node for stage 5 (chained share A→B→C).
#   shareprobe  = consumer for all stages (reads PatternA, writes PatternB,
#                 releases).
#   test-fixture-http = A-node for stage 5 only: allocates a Slab, fills
#                 PatternA, shares with sharetest (B), then verifies PatternB
#                 after the full A→B→C round-trip.
# PASS = `[sharetest] all stages PASS` + `[test-fixture-http] PASS chain A→B→C`
[[shepherd]]
name = "test-fixture-http"
path = "/test-fixture-http.maz"

[[shepherd]]
name = "sharetest"
path = "/sharetest.maz"

[[shepherd]]
name = "shareprobe"
path = "/shareprobe.maz"

# MAZ-43 boot-time smoke for end-to-end HTTPS+JSON connectivity to
# api.anthropic.com via mazarin's network stack. Asks Claude one
# question and asserts "Washington" in the response.
[[shepherd]]
name = "sophie"
path = "/sophie.maz"

# MAZ-49 HTTP/1.1 + TLS protocol shepherd. Owns x509, the CA bundle, and
# the wire framing; consumers call in via mazarin/httpclient. Phase one
# (item 2 of the plan) boots and registers; the Do handler lands in
# item 7. Currently coexists with sophie's fat-client TLS path; sophie's
# refactor onto httpclient lives in MAZ-48.
[[shepherd]]
name = "protocol-http"
path = "/protocol-http.maz"
