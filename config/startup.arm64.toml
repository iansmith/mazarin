[[shepherd]]
name = "fti"
path = "/fti.maz"
memlimit_mb = 128

[[shepherd]]
name = "maildb"
path = "/maildb.maz"

[[shepherd]]
name = "mail"
path = "/mail.maz"
gc_percent = 5
