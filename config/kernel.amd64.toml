# kernel.amd64.toml — x86_64 kernel configuration (embedded in kmazarin.elf)

timezone = "America/New_York"

# Memory
kernel_budget_mb = 32
go_mem_limit = 24
kernel_mem_limit = 24

# Framebuffer: single source of truth for the GPU framebuffer size cap (MB). The
# actual framebuffer is sized to the detected display resolution; the kernel
# panics at boot if that would exceed this cap.
framebuffer_max_mb = 64

# GC tuning — Go's stdlib default (100). See kernel.arm64.toml for the
# full rationale; the short version: 10000 disables routine GC and lets
# the heap drift large until GOMEMLIMIT kicks in, but by then the
# kernel's user-page budget is already exhausted in multi-shepherd runs.
gc_percentage = 100
gc_percent_kernel = 100

# Scheduling
kernel_tick_rate = 330
preempt_after_ticks = 33

# Serial output
suppress_serial_stdio_copy = false
suppress_kernel_serial = false

# Diagnostics
# MAZ-112: run the clone_exec intent-visibility race self-test at boot. See
# kernel.arm64.toml for the full rationale. OFF by default. (The x86_64 build is
# blocked on a separate nosplit-overflow bug, so this flag is plumbed for parity
# but not currently exercisable on amd64.)
clone_exec_race_test = false

# MAZ-135: run the context-marshal value-flow self-test at boot. Drives the real
# SaveContextFromFrame with synthetic sentinel inputs
# on a scratch thread and asserts every ThreadContext field is populated. OFF by
# default (like the other boot selftests); the build-time cmd/frameaudit gate is
# the always-on guard. Verified non-regressive over 10 GCP KVM boots (10/10 OK,
# 0 deadlock/morestack); enable to re-validate the savers after a context change.
ctx_marshal_test = false

# xmm_nest_test (MAZ-139 DoD#1): drive the production exception XMM save/restore
# through a REAL nested exception (outer INT $48 + a one-shot nested INT $48 from
# the timer-handler hook) and assert the OUTER level keeps its own XMM. RED while
# ·xmmSaveArea is a single global (nested save clobbers the outer snapshot); GREEN
# once XMM is stored per exception frame. Deterministic, allocation-free, amd64
# only. ON during MAZ-139 bring-up; the hook is temporary (removed after GREEN).
xmm_nest_test = true
