# kernel.amd64.toml — x86_64 kernel configuration (embedded in kmazarin.elf)

timezone = "America/New_York"

# Memory
kernel_budget_mb = 32
go_mem_limit = 24
kernel_mem_limit = 24

# GC tuning — Go's stdlib default (100). See kernel.arm64.toml for the
# full rationale; the short version: 10000 disables routine GC and lets
# the heap drift large until GOMEMLIMIT kicks in, but by then the
# kernel's user-page budget is already exhausted in multi-shepherd runs.
gc_percentage = 100
gc_percent_kernel = 100

# Scheduling
kernel_tick_rate = 330
preempt_after_ticks = 33

# Serial output
suppress_serial_stdio_copy = false
suppress_kernel_serial = false

# Diagnostics
# MAZ-112: run the clone_exec intent-visibility race self-test at boot. See
# kernel.arm64.toml for the full rationale. OFF by default. (The x86_64 build is
# blocked on a separate nosplit-overflow bug, so this flag is plumbed for parity
# but not currently exercisable on amd64.)
clone_exec_race_test = false
