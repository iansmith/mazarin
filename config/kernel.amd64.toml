# kernel.amd64.toml — x86_64 kernel configuration (embedded in kmazarin.elf)
# NOTE: cmd/embedaudit + shared/embedcheck match the header line above to verify
# the right arch's config got embedded (MAZ-153) — keep its prefix intact.

timezone = "America/New_York"

# Memory
kernel_budget_mb = 32
go_mem_limit = 24
kernel_mem_limit = 24

# Framebuffer: single source of truth for the GPU framebuffer size cap (MB). The
# actual framebuffer is sized to the detected display resolution; the kernel
# panics at boot if that would exceed this cap.
framebuffer_max_mb = 64

# GC tuning — Go's stdlib default (100). See kernel.arm64.toml for the
# full rationale; the short version: 10000 disables routine GC and lets
# the heap drift large until GOMEMLIMIT kicks in, but by then the
# kernel's user-page budget is already exhausted in multi-shepherd runs.
gc_percentage = 100
gc_percent_kernel = 100

# Scheduling
kernel_tick_rate = 330
preempt_after_ticks = 33

# Serial output
suppress_serial_stdio_copy = false
suppress_kernel_serial = false

# Diagnostics
# MAZ-112: run the clone_exec intent-visibility race self-test at boot. See
# kernel.arm64.toml for the full rationale. OFF by default. (The x86_64 build is
# blocked on a separate nosplit-overflow bug, so this flag is plumbed for parity
# but not currently exercisable on amd64.)
clone_exec_race_test = false

# MAZ-135/MAZ-139: run the context-marshal value-flow self-test at boot. Drives the
# REAL SaveContextFromFrame with synthetic sentinel inputs on a scratch thread and
# asserts (a) every ThreadContext field is populated, (b) the dual-home TLS-g is
# sourced correctly — from the user TLS slot (user CS) and from the per-exception-
# frame slot (kernel CS) — and (c) the unhandled-fault vector is read from the
# per-frame slot (vectorFromFrame). Non-invasive (scratch thread, synthetic frames);
# the kept always-on guards are the build-time cmd/frameaudit gate + the D2 canary.
# Left ON as the DoD#2 value-flow regression guard (catches a wrong-source rewiring
# that presence/clobber checks can't see).
ctx_marshal_test = true
