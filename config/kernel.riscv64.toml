# kernel.riscv64.toml — RISC-V kernel configuration (embedded in kmazarin.elf)

timezone = "America/New_York"

# Memory
kernel_budget_mb = 32
go_mem_limit = 24
kernel_mem_limit = 24

# GC tuning — set very high so GOMEMLIMIT is the governor.
gc_percentage = 10000
gc_percent_kernel = 10000

# Scheduling
kernel_tick_rate = 330
preempt_after_ticks = 33

# Serial output
suppress_serial_stdio_copy = false
suppress_kernel_serial = false
