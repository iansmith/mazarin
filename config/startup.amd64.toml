# startup.amd64.toml — x86_64 shepherd launch sequence (read by fs from disk)
# NOTE: linux and rachel are launched explicitly by fs in bootSequence
# (linux first, then rachel) before this config is read.

#[[shepherd]]
#name = "sievetest"
#path = "/sievetest.elf"

#[[shepherd]]
#name = "clocks"
#path = "/clocks.maz"

[[shepherd]]
name = "fti"
path = "/fti.maz"
memlimit_mb = 128

[[shepherd]]
name = "maildb"
path = "/maildb.maz"

[[shepherd]]
name = "mail"
path = "/mail.maz"

[[shepherd]]
name = "net"
path = "/net.elf"

# MAZ-43 boot-time smoke for end-to-end HTTPS+JSON connectivity to
# api.anthropic.com via mazarin's network stack. Asks Claude one
# question and asserts "Washington" in the response. amd64 entry
# defined for pattern parity; not gated by MAZ-43's acceptance.
# MAZ-50 transfertest + transferprobe entries (amd64 path is defined-but-
# not-gated; x86_64 disk doesn't bundle the binaries until the framework-
# level nosplit overflow clears).
[[shepherd]]
name = "transfertest"
path = "/transfertest.maz"

[[shepherd]]
name = "transferprobe"
path = "/transferprobe.maz"

[[shepherd]]
name = "sophie"
path = "/sophie.maz"
