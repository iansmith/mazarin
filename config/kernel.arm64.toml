# kernel.arm64.toml — ARM64 kernel configuration (embedded in kmazarin.elf)
# NOTE: cmd/embedaudit + shared/embedcheck match the header line above to verify
# the right arch's config got embedded (MAZ-153) — keep its prefix intact.

timezone = "America/New_York"

# Memory
kernel_budget_mb = 64
go_mem_limit = 256
kernel_mem_limit = 24

# Framebuffer: single source of truth for the GPU framebuffer size cap (MB). The
# actual framebuffer is sized to the detected display resolution; the kernel
# panics at boot if that would exceed this cap.
framebuffer_max_mb = 64

# GC tuning — Go's stdlib default (100). With GOGC=100 the collector fires
# when the heap has doubled since the previous live set. Lower values
# (5–50) compact more aggressively at the cost of more pauses; higher
# values (1000+) let the heap drift large and rely on GOMEMLIMIT as the
# governor. We learned the hard way that 10000 effectively disables
# routine GC: in long-running shepherds (linux especially) the heap
# climbs into the hundreds of MB before GOMEMLIMIT kicks in, by which
# point the kernel's user-page budget across all shepherds is already
# exhausted. 100 is the sweet spot — frequent enough that real leaks
# show up in memstats, infrequent enough not to cost real CPU.
gc_percentage = 100
gc_percent_kernel = 100

# Scheduling
# Timer tick rate in Hz (330 = ~3ms ticks). Controls deadline processing
# and signal delivery granularity.
kernel_tick_rate = 330
# Thread preemption quantum in wall-clock milliseconds. Tick-rate-independent
# (MAZ-172): the kernel derives the tick count from kernel_tick_rate, so
# changing the tick rate alone leaves the quantum unchanged.
preempt_interval_ms = 100
# Time-attribute update rate in Hz (clock refresh etc.). Its own policy knob
# (MAZ-172) - no longer coupled to the preemption quantum.
time_update_hz = 10
# Stage-5 A/D-bit sweep (clock-algorithm reference scan). OFF until page
# replacement lands (MAZ-171): with swap stubs-only it had no consumer and
# burned ~49 points of a host core keeping the kernel from ever idling.
ad_scan_enabled = false

# Serial output
# When true, userspace stdout/stderr is routed only through the linux shepherd
# and NOT echoed to the serial port. Improves performance since serial UART
# output is slow, but means serial logs won't contain shepherd output.
suppress_serial_stdio_copy = false
suppress_kernel_serial = false

# Diagnostics
# MAZ-108: run the kmem teardown leak-soak self-test at boot (verifies
# FreeProcessPageTable reclaims process page tables with no frame leak). OFF by
# default — flip to true to re-run the verification.
kmem_leak_test = false

# MAZ-112: run the clone_exec intent-visibility race self-test at boot. Creates
# a real clone_exec child and checks its race-sensitive startup state
# (ParentPID + buffered intent + chdir target) is already populated the moment
# the child becomes schedulable, then reaps the child. Logs [clone-exec-race]
# PASS (window closed) or FAIL (fields observed unset). OFF by default — flip to
# true to re-run the verification.
clone_exec_race_test = false

# MAZ-135: context-marshal value-flow self-test at boot. Drives the real arm64
# SaveContextFromFrame with synthetic sentinel inputs on a scratch thread and
# asserts every ThreadContext field is populated. OFF by default (like the other
# boot selftests); the build-time cmd/frameaudit gate is the always-on guard.
# Verified non-regressive via an HVF boot (boots to GUI, selftest OK). Flip to
# true to re-validate the arm64 savers after a context change.
ctx_marshal_test = false

# MAZ-163: run the page tracker shed-on-free self-test at boot. Verifies
# TrackedPageCount() returns to baseline after alloc/free cycles and that
# saturating past MaxTrackedPages produces zero "page tracker full" warnings.
# OFF by default — flip to true to re-run the verification.
page_tracker_test = false
