# kmazarin.toml — RISC-V boot sequence configuration

timezone = "America/New_York"

# When true, userspace stdout/stderr is routed only through the stdio priest
# and NOT echoed to the serial port. This improves performance since serial
# UART output is slow, but means serial logs won't contain priest output.
# When false (default), all output is echoed to serial as well.
suppress_serial = true

# Bootstrap priests: loaded by the kernel during early boot
[[bootstrap_priest]]
name = "disk"
path = "/disk.elf"
maz = ["fs=/fs.maz"]

# Application priests: launched after bootstrap priests are running
[[priest]]
name = "dapope"
path = "/dapope.elf"

[[priest]]
name = "stdio"
path = "/stdio.elf"
