# kmazarin.toml — ARM64 boot sequence configuration

timezone = "America/New_York"

# When true, userspace stdout/stderr is routed only through the stdio shepherd
# and NOT echoed to the serial port. This improves performance since serial
# UART output is slow, but means serial logs won't contain shepherd output.
# When false (default), all output is echoed to serial as well.
kernel_budget_mb = 64
suppress_serial_stdio_copy = false
suppress_kernel_serial = false
# gc_percentage is set very high so that GOMEMLIMIT is the governor.
# With a low gc_percentage, GOGC fires at its minimum heap threshold (~4MB)
# regardless of GOMEMLIMIT, causing thousands of unnecessary GC cycles.
gc_percentage = 10000
go_mem_limit = 24
kernel_mem_limit = 24
# gc_percent_kernel is the kernel's GOGC value, also set very high so
# GOMEMLIMIT (kernel_mem_limit) is the governor for kernel GC too.
gc_percent_kernel = 10000
# Timer tick rate in Hz (250 = 4ms ticks). Controls deadline processing
# and signal delivery granularity.
kernel_tick_rate = 250
# Thread preemption quantum in ticks (25 × 4ms = 100ms). Also determines
# the time attribute update frequency (10Hz at these settings).
preempt_after_ticks = 25

# Bootstrap shepherds: loaded by the kernel during early boot
[[bootstrap_shepherd]]
name = "disk"
path = "/disk.elf"
maz = ["fs=/fs.maz"]

# Application shepherds: launched after bootstrap shepherds are running
[[shepherd]]
name = "rachel"
path = "/rachel.elf"

