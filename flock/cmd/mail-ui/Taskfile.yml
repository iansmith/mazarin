version: '3'

tasks:
  arm64:
    desc: Build mail-ui.maz (PIE + thin stubs, dynamically linked)
    run: once
    deps: [':check-env', ':maz-overlay']
    sources:
      - 'flock/cmd/mail-ui/**/*.go'
      - 'mazarin/**/*.go'
      - '{{.MAZ_OVERLAY_JSON}}'
    generates:
      - '{{.MAIL_UI_MAZ}}'
    cmds:
      - '{{.GO}} tool go-echo "Building mail-ui.maz (PIE + thin stubs)..."'
      - 'CGO_ENABLED=0 GOARCH={{.TARGET_GOARCH}} GOOS={{.TARGET_GOOS}} {{.GO}} build -buildmode=pie -overlay={{.ROOT_DIR}}/{{.MAZ_OVERLAY_JSON}} {{.GCFLAGS}} -o {{.MAIL_UI_MAZ}} ./flock/cmd/mail-ui'
      - '{{.GO}} tool go-echo "Running maz-reloc to generate .maz_imports..."'
      - '{{.GO}} tool maz-reloc {{.MAIL_UI_MAZ}} {{.THIN_MANIFEST}}'
      - '{{.GO}} tool go-echo "mail-ui.maz ready at {{.MAIL_UI_MAZ}}"'

  amd64:
    desc: Build mail-ui.maz for x86_64 (PIE + thin stubs, dynamically linked)
    run: once
    deps: [':check-env', ':maz-overlay-amd64']
    sources:
      - 'flock/cmd/mail-ui/**/*.go'
      - 'mazarin/**/*.go'
      - '{{.MAZ_OVERLAY_AMD64_JSON}}'
    generates:
      - '{{.MAIL_UI_MAZ_AMD64}}'
    cmds:
      - '{{.GO}} tool go-echo "Building mail-ui.maz for x86_64 (PIE + thin stubs)..."'
      - 'CGO_ENABLED=0 GOARCH=amd64 GOOS=linux {{.GO}} build -buildmode=pie -overlay={{.ROOT_DIR}}/{{.MAZ_OVERLAY_AMD64_JSON}} {{.GCFLAGS}} -o {{.MAIL_UI_MAZ_AMD64}} ./flock/cmd/mail-ui'
      - '{{.GO}} tool go-echo "Running maz-reloc to generate .maz_imports..."'
      - '{{.GO}} tool maz-reloc {{.MAIL_UI_MAZ_AMD64}} {{.THIN_MANIFEST_AMD64}}'
      - '{{.GO}} tool go-echo "mail-ui.maz (x86_64) ready at {{.MAIL_UI_MAZ_AMD64}}"'

  riscv64:
    desc: Build mail-ui.maz for RISC-V 64-bit (fixed-address slot, thin stubs)
    run: once
    deps: [':check-env', ':maz-overlay']
    sources:
      - 'flock/cmd/mail-ui/**/*.go'
      - 'mazarin/**/*.go'
      - '{{.MAZ_OVERLAY_JSON}}'
    generates:
      - '{{.MAIL_UI_MAZ_RISCV64}}'
    cmds:
      - '{{.GO}} tool go-echo "Building mail-ui.maz for RISC-V 64-bit (fixed-address slot)..."'
      - 'CGO_ENABLED=0 GOARCH=riscv64 GOOS=linux {{.GO}} build -overlay={{.ROOT_DIR}}/{{.MAZ_OVERLAY_JSON}} -ldflags="-T 0x3C000000" {{.GCFLAGS}} -o {{.MAIL_UI_MAZ_RISCV64}} ./flock/cmd/mail-ui'
      - '{{.GO}} tool go-echo "Fixing negative ELF offsets from -T flag..."'
      - '{{.GO}} tool fix-go-elf -no-bootstrap {{.MAIL_UI_MAZ_RISCV64}}'
      - '{{.GO}} tool go-echo "Running maz-reloc to generate .maz_imports..."'
      - '{{.GO}} tool maz-reloc {{.MAIL_UI_MAZ_RISCV64}} {{.THIN_MANIFEST}}'
      - '{{.GO}} tool go-echo "mail-ui.maz (RISC-V 64-bit) ready at {{.MAIL_UI_MAZ_RISCV64}}"'
