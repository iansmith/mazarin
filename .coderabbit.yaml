# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
#
# Disable CodeRabbit's automatic per-PR reviews. This project gates PRs on the
# in-house /code-review skill instead (.project-conf.toml [pr_review] backend =
# "claude"), and the org's prepaid CodeRabbit credits are exhausted, so
# auto-reviews only ever hit the rate limit. On-demand reviews via
# `@coderabbitai review` still work if credits are restored later.
reviews:
  auto_review:
    enabled: false
